<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="IEMA Provas">

    <!-- 🔥 FAVICON LOCAL (NÃO DEPENDE DE INTERNET) -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/favicon.ico">
    
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('✅ Service Worker registrado:', registration.scope);
          })
          .catch(error => {
            console.log('❌ Service Worker falhou:', error);
          });
      });
    }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todas as Notificações - Sistema de Provas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos específicos para a página de notificações */
        .notificacoes-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .page-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .page-header::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        
        .page-header h1 {
            margin: 0 0 10px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .page-header h1 i {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 15px;
        }
        
        .page-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1rem;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
            border-left: 4px solid #667eea;
        }
        
        .stat-card .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-card .stat-label {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .filtros-bar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filtro-group {
            flex: 1;
            min-width: 200px;
        }
        
        .filtro-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #6b7280;
        }
        
        .filtro-select, .filtro-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        
        .btn-filtrar {
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            align-self: flex-end;
        }
        
        .btn-filtrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .acoes-bar {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn-acao {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .btn-voltar {
            background: #f3f4f6;
            color: #4b5563;
        }
        
        .btn-voltar:hover {
            background: #e5e7eb;
        }
        
        .btn-marcar-todas {
            background: #10b981;
            color: white;
        }
        
        .btn-marcar-todas:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        
        .btn-limpar-todas {
            background: #ef4444;
            color: white;
        }
        
        .btn-limpar-todas:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }
        
        .notificacoes-lista-page {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        
        .notificacao-item-page {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 15px;
            transition: all 0.3s;
            position: relative;
        }
        
        .notificacao-item-page:hover {
            background: #f9fafb;
        }
        
        .notificacao-item-page.nao-lida {
            background: #eff6ff;
            border-left: 4px solid #3b82f6;
        }
        
        .notificacao-icone-page {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: white;
            flex-shrink: 0;
        }
        
        .notificacao-conteudo-page {
            flex: 1;
        }
        
        .notificacao-header-page {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .notificacao-titulo-page {
            font-weight: 600;
            font-size: 1rem;
            color: #1f2937;
        }
        
        .notificacao-tempo-page {
            font-size: 0.8rem;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .notificacao-mensagem-page {
            font-size: 0.95rem;
            color: #4b5563;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .notificacao-dados-page {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: #6b7280;
            flex-wrap: wrap;
        }
        
        .badge-tipo {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: #e5e7eb;
            color: #4b5563;
        }
        
        .badge-tipo.resultado_liberado {
            background: #d1fae5;
            color: #065f46;
        }
        
        .badge-tipo.resultado_editado {
            background: #fef3c7;
            color: #92400e;
        }
        
        .notificacao-acoes {
            display: flex;
            gap: 8px;
            margin-left: auto;
            align-self: center;
        }
        
        .btn-excluir-item {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .btn-excluir-item:hover {
            background: #fecaca;
            transform: scale(1.05);
        }
        
        .paginacao {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }
        
        .btn-pagina {
            padding: 8px 16px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn-pagina:hover:not(:disabled) {
            border-color: #667eea;
            color: #667eea;
        }
        
        .btn-pagina:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .info-pagina {
            font-size: 0.9rem;
            color: #6b7280;
        }
        
        .empty-state-page {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-state-page i {
            font-size: 4rem;
            color: #d1d5db;
            margin-bottom: 20px;
        }
        
        .empty-state-page h3 {
            color: #374151;
            margin-bottom: 10px;
        }
        
        .empty-state-page p {
            color: #6b7280;
            margin-bottom: 20px;
        }
        
        .checkbox-item {
            margin-right: 10px;
        }
        
        @media (max-width: 768px) {
            .stats-cards {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .filtros-bar {
                flex-direction: column;
            }
            
            .filtro-group {
                width: 100%;
            }
            
            .acoes-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn-acao {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container notificacoes-page">
        <!-- Header -->
        <div class="page-header">
            <h1>
                <i class="fas fa-bell"></i>
                Todas as Notificações
            </h1>
            <p>Central de notificações do sistema</p>
        </div>
        
        <!-- Cards de Estatísticas -->
        <div class="stats-cards" id="statsCards">
            <div class="stat-card">
                <div class="stat-number" id="statTotal">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statNaoLidas">0</div>
                <div class="stat-label">Não lidas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statLidas">0</div>
                <div class="stat-label">Lidas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statResultados">0</div>
                <div class="stat-label">Resultados</div>
            </div>
        </div>
        
        <!-- Barra de Filtros -->
        <div class="filtros-bar">
            <div class="filtro-group">
                <label><i class="fas fa-filter"></i> Filtro</label>
                <select id="filtroTipo" class="filtro-select">
                    <option value="todas">Todas as notificações</option>
                    <option value="nao_lidas">Não lidas</option>
                    <option value="lidas">Lidas</option>
                    <option value="tipo:resultado_liberado">Resultados liberados</option>
                    <option value="tipo:resultado_editado">Resultados editados</option>
                    <option value="tipo:sistema">Sistema</option>
                </select>
            </div>
            
            <div class="filtro-group">
                <label><i class="fas fa-search"></i> Buscar</label>
                <input type="text" id="buscaNotificacao" class="filtro-input" placeholder="Pesquisar...">
            </div>
            
            <button class="btn-filtrar" onclick="aplicarFiltros()">
                <i class="fas fa-search"></i> Filtrar
            </button>
        </div>
        
        <!-- Barra de Ações -->
        <div class="acoes-bar">
            <button class="btn-acao btn-voltar" onclick="window.history.back()">
                <i class="fas fa-arrow-left"></i> Voltar
            </button>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-acao btn-marcar-todas" onclick="marcarTodasLidasPage()">
                    <i class="fas fa-check-double"></i> Marcar todas como lidas
                </button>
                
                <button class="btn-acao btn-limpar-todas" onclick="limparTodasNotificacoesPage()">
                    <i class="fas fa-trash"></i> Limpar todas
                </button>
            </div>
        </div>
        
        <!-- Lista de Notificações -->
        <div class="notificacoes-lista-page" id="listaNotificacoes">
            <div style="text-align: center; padding: 60px;">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: #667eea;"></i>
                <p style="margin-top: 15px; color: #6b7280;">Carregando notificações...</p>
            </div>
        </div>
        
        <!-- Paginação -->
        <div class="paginacao" id="paginacao" style="display: none;">
            <button class="btn-pagina" id="btnAnterior" onclick="mudarPagina('anterior')" disabled>
                <i class="fas fa-chevron-left"></i> Anterior
            </button>
            <span class="info-pagina" id="infoPagina">Página 1 de 1</span>
            <button class="btn-pagina" id="btnProxima" onclick="mudarPagina('proxima')" disabled>
                Próxima <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
    
    <script>
        // ============================================
        // PÁGINA DE TODAS AS NOTIFICAÇÕES
        // ============================================
        
        let paginaAtual = 1;
        let limite = 20;
        let filtroAtual = 'todas';
        let buscaAtual = '';
        let totalPaginas = 1;
        
        // Carregar notificações ao iniciar
        document.addEventListener('DOMContentLoaded', function() {
            carregarTodasNotificacoes();
        });
        
        async function carregarTodasNotificacoes() {
            try {
                const token = localStorage.getItem('auth_token');
                if (!token) {
                    window.location.href = 'login.html';
                    return;
                }
                
                // Mostrar loading
                document.getElementById('listaNotificacoes').innerHTML = `
                    <div style="text-align: center; padding: 60px;">
                        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: #667eea;"></i>
                        <p style="margin-top: 15px; color: #6b7280;">Carregando notificações...</p>
                    </div>
                `;
                
                // Construir URL com parâmetros
                let url = `/api/notificacoes/todas?pagina=${paginaAtual}&limite=${limite}`;
                if (filtroAtual !== 'todas') {
                    url += `&filtro=${filtroAtual}`;
                }
                
                console.log('📡 Fetching:', url);
                
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                // Verificar se a resposta é OK
                if (!response.ok) {
                    const text = await response.text();
                    console.error('❌ Resposta não-OK:', response.status, text.substring(0, 200));
                    throw new Error(`Erro ${response.status}: ${response.statusText}`);
                }
                
                // Verificar content-type
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.error('❌ Resposta não é JSON:', text.substring(0, 200));
                    throw new Error('Resposta do servidor não é JSON válido');
                }
                
                // Tentar parsear JSON
                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    console.error('❌ Erro ao parsear JSON:', e);
                    throw new Error('Resposta do servidor é inválida');
                }
                
                if (data.success) {
                    atualizarEstatisticas(data.estatisticas || {});
                    renderizarNotificacoes(data.notificacoes || []);
                    atualizarPaginacao(data.paginacao);
                } else {
                    throw new Error(data.error || 'Erro ao carregar notificações');
                }
                
            } catch (error) {
                console.error('❌ Erro detalhado:', error);
                
                // Mostrar erro na interface
                document.getElementById('listaNotificacoes').innerHTML = `
                    <div class="empty-state-page">
                        <i class="fas fa-exclamation-triangle" style="color: #ef4444; font-size: 3rem;"></i>
                        <h3 style="color: #7f1d1d; margin: 15px 0;">Erro ao carregar notificações</h3>
                        <p style="color: #6b7280; margin-bottom: 20px;">${error.message}</p>
                        <div style="background: #f3f4f6; padding: 15px; border-radius: 8px; text-align: left; margin: 20px auto; max-width: 500px;">
                            <p><strong>🔍 Diagnóstico:</strong></p>
                            <ul style="margin-left: 20px; color: #4b5563;">
                                <li>URL: <code>/api/notificacoes/todas</code></li>
                                <li>Token: ${token ? '✅ Presente' : '❌ Ausente'}</li>
                                <li>Página: ${paginaAtual}</li>
                                <li>Filtro: ${filtroAtual}</li>
                            </ul>
                        </div>
                        <button onclick="carregarTodasNotificacoes()" class="btn-acao btn-voltar" style="margin-top: 15px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">
                            <i class="fas fa-redo"></i> Tentar novamente
                        </button>
                        <button onclick="window.location.href='aluno.html'" class="btn-acao btn-voltar" style="margin-top: 15px; margin-left: 10px; padding: 10px 20px; background: #6b7280; color: white; border: none; border-radius: 8px; cursor: pointer;">
                            <i class="fas fa-arrow-left"></i> Voltar
                        </button>
                    </div>
                `;
            }
        }
        
        function atualizarEstatisticas(stats) {
            document.getElementById('statTotal').textContent = stats.total || 0;
            document.getElementById('statNaoLidas').textContent = stats.naoLidas || 0;
            document.getElementById('statLidas').textContent = stats.lidas || 0;
            
            const resultados = (stats.porTipo?.resultado_liberado || 0) + 
                              (stats.porTipo?.resultado_editado || 0);
            document.getElementById('statResultados').textContent = resultados;
        }
        
        function renderizarNotificacoes(notificacoes) {
            const lista = document.getElementById('listaNotificacoes');
            
            if (!notificacoes || notificacoes.length === 0) {
                lista.innerHTML = `
                    <div class="empty-state-page">
                        <i class="fas fa-bell-slash"></i>
                        <h3>Nenhuma notificação encontrada</h3>
                        <p>Você não possui notificações com os filtros selecionados.</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            notificacoes.forEach(notif => {
                const data = new Date(notif.createdAt);
                const dataFormatada = data.toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                const classeLida = notif.lida ? '' : 'nao-lida';
                
                // Determinar badge de tipo
                let tipoClasse = '';
                let tipoTexto = notif.tipo || 'sistema';
                
                if (notif.tipo === 'resultado_liberado') {
                    tipoClasse = 'resultado_liberado';
                    tipoTexto = 'Resultado Liberado';
                } else if (notif.tipo === 'resultado_editado') {
                    tipoClasse = 'resultado_editado';
                    tipoTexto = 'Resultado Editado';
                } else if (notif.tipo === 'cancelamento') {
                    tipoClasse = 'cancelamento';
                    tipoTexto = 'Cancelamento';
                } else {
                    tipoTexto = 'Sistema';
                }
                
                // Extrair dados adicionais
                const dados = notif.dados || {};
                const infoExtra = [];
                
                if (dados.provaTitulo) infoExtra.push(`Prova: ${dados.provaTitulo}`);
                if (dados.alunoNome) infoExtra.push(`Aluno: ${dados.alunoNome}`);
                if (dados.adminNome) infoExtra.push(`Admin: ${dados.adminNome}`);
                
                // 🔥 DADOS DA TURMA (NOVO)
                const turma = dados.turma || {};
                let turmaHtml = '';
                
                if (turma.nome) {
                    turmaHtml = `
                        <div class="notificacao-turma-info" style="
                            margin-top: 10px;
                            padding: 8px 12px;
                            background: #f8fafc;
                            border-radius: 8px;
                            border-left: 3px solid ${notif.cor || '#667eea'};
                            font-size: 0.85rem;
                            display: flex;
                            flex-wrap: wrap;
                            align-items: center;
                            gap: 15px;
                        ">
                            <span style="display: flex; align-items: center; gap: 5px;">
                                <i class="fas fa-school" style="color: ${notif.cor || '#667eea'};"></i>
                                <strong>Turma:</strong> ${turma.nome}
                            </span>
                            
                            ${turma.disciplina ? `
                                <span style="display: flex; align-items: center; gap: 5px;">
                                    <i class="fas fa-book" style="color: ${notif.cor || '#667eea'};"></i>
                                    <strong>Disciplina:</strong> ${turma.disciplina}
                                </span>
                            ` : ''}
                            
                            ${turma.codigo ? `
                                <span style="display: flex; align-items: center; gap: 5px;">
                                    <i class="fas fa-hashtag" style="color: ${notif.cor || '#667eea'};"></i>
                                    <strong>Código:</strong> ${turma.codigo}
                                </span>
                            ` : ''}
                        </div>
                    `;
                }
                
                html += `
                    <div class="notificacao-item-page ${classeLida}" data-id="${notif._id}">
                        <div class="notificacao-icone-page" style="background: ${notif.cor || '#667eea'};">
                            ${notif.icone || '📋'}
                        </div>
                        
                        <div class="notificacao-conteudo-page">
                            <div class="notificacao-header-page">
                                <div>
                                    <span class="notificacao-titulo-page">${notif.titulo}</span>
                                    <span class="badge-tipo ${tipoClasse}" style="margin-left: 10px;">${tipoTexto}</span>
                                </div>
                                <span class="notificacao-tempo-page">
                                    <i class="far fa-clock"></i> ${dataFormatada}
                                </span>
                            </div>
                            
                            <div class="notificacao-mensagem-page">${notif.mensagem}</div>
                            
                            ${infoExtra.length > 0 ? `
                                <div class="notificacao-dados-page">
                                    ${infoExtra.map(item => `<span><i class="fas fa-info-circle"></i> ${item}</span>`).join('')}
                                </div>
                            ` : ''}
                            
                            ${turmaHtml}
                        </div>
                        
                        <div class="notificacao-acoes">
                            ${!notif.lida ? `
                                <button class="btn-excluir-item" onclick="marcarComoLida('${notif._id}')" title="Marcar como lida" style="background: #dbeafe; color: #2563eb;">
                                    <i class="fas fa-check"></i>
                                </button>
                            ` : ''}
                            
                            <button class="btn-excluir-item" onclick="excluirNotificacaoPage('${notif._id}')" title="Excluir">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            lista.innerHTML = html;
        }
                
        function atualizarPaginacao(paginacao) {
            if (!paginacao || paginacao.totalPaginas <= 1) {
                document.getElementById('paginacao').style.display = 'none';
                return;
            }
            
            document.getElementById('paginacao').style.display = 'flex';
            document.getElementById('infoPagina').textContent = `Página ${paginacao.pagina} de ${paginacao.totalPaginas}`;
            
            document.getElementById('btnAnterior').disabled = paginacao.pagina <= 1;
            document.getElementById('btnProxima').disabled = paginacao.pagina >= paginacao.totalPaginas;
            
            totalPaginas = paginacao.totalPaginas;
        }
        
        function mudarPagina(direcao) {
            if (direcao === 'anterior' && paginaAtual > 1) {
                paginaAtual--;
            } else if (direcao === 'proxima' && paginaAtual < totalPaginas) {
                paginaAtual++;
            } else {
                return;
            }
            
            carregarTodasNotificacoes();
        }
        
        function aplicarFiltros() {
            filtroAtual = document.getElementById('filtroTipo').value;
            buscaAtual = document.getElementById('buscaNotificacao').value;
            paginaAtual = 1;
            carregarTodasNotificacoes();
        }
        
        async function marcarComoLida(id) {
            try {
                const token = localStorage.getItem('auth_token');
                
                const response = await fetch(`/api/notificacoes/${id}/lida`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    carregarTodasNotificacoes();
                }
                
            } catch (error) {
                console.error('Erro ao marcar como lida:', error);
                alert('Erro ao marcar notificação como lida');
            }
        }
        
        async function excluirNotificacaoPage(id) {
            if (!confirm('Excluir esta notificação?')) return;
            
            try {
                const token = localStorage.getItem('auth_token');
                
                const response = await fetch(`/api/notificacoes/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    carregarTodasNotificacoes();
                } else {
                    throw new Error(data.error || 'Erro ao excluir');
                }
                
            } catch (error) {
                console.error('Erro ao excluir:', error);
                alert('Erro ao excluir notificação');
            }
        }
        
        async function marcarTodasLidasPage() {
            if (!confirm('Marcar todas as notificações como lidas?')) return;
            
            try {
                const token = localStorage.getItem('auth_token');
                
                const response = await fetch('/api/notificacoes/marcar-todas-lidas', {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    carregarTodasNotificacoes();
                }
                
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao marcar todas como lidas');
            }
        }
        
        async function limparTodasNotificacoesPage() {
            if (!confirm('🗑️ Deseja excluir TODAS as suas notificações?\n\nEsta ação não pode ser desfeita.')) return;
            
            try {
                const token = localStorage.getItem('auth_token');
                
                const response = await fetch('/api/notificacoes/limpar-minhas', {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(`✅ ${data.message}`);
                    carregarTodasNotificacoes();
                } else {
                    throw new Error(data.error || 'Erro ao limpar');
                }
                
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ ' + error.message);
            }
        }
    </script>
</body>
</html>
