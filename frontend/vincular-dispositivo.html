<!DOCTYPE html>
<html lang="pt-BR">
<head>
        <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EducaPleno">

    <!-- 🔥 FAVICON LOCAL (NÃO DEPENDE DE INTERNET) -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Face ID - EducaPleno</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.2/dist/face-api.min.js"></script>

        <!-- VLibras Oficial -->
    <script src="js/vlibras-oficial.js"></script>
    <script src="js/acessibilidade.js"></script>
    <script src="js/chatbot-frontend.js"></script>
    <script src="js/toggle-buttons.js"></script>
    <script src="js/draggable.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Vincular Dispositivo - EducaPleno</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Externo -->
    <link rel="stylesheet" href="css/vincular-dispositivo.css">
</head>
<body>
    <div class="card">
        <!-- Ícone Principal (muda de cor/ícone conforme o estado) -->
        <div class="icon" id="icon">
            <i class="fas fa-mobile-alt"></i>
        </div>
        
        <!-- Título e Subtítulo dinâmicos -->
        <h1 id="titulo">Vincular Dispositivo</h1>
        <p id="subTitulo">Confirme o vínculo deste dispositivo à sua conta para receber notificações.</p>
        
        <!-- Box que mostra o playerId -->
        <div class="player-id-box" id="playerIdBox">
            Carregando...
        </div>
        
        <!-- Área de status (mensagens de sucesso/erro/loading) -->
        <div id="status" class="status"></div>
        
        <!-- Botão Principal -->
        <button class="btn btn-primary" id="btnVincular" onclick="vincular()">
            <i class="fas fa-link"></i>
            <span>Confirmar Vínculo</span>
        </button>
        
        <!-- Botão Secundário -->
        <button class="btn btn-secondary" onclick="cancelar()">
            <i class="fas fa-times"></i>
            <span>Cancelar</span>
        </button>
    </div>
    
    <!-- JavaScript Externo -->
    <script src="js/vincular-dispositivo.js"></script>
</body>
</html>
