<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sistema de Provas">

    <!-- 🔥 FAVICON LOCAL (NÃO DEPENDE DE INTERNET) -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Face ID - Sistema de Provas</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.2/dist/face-api.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .camera-box {
            width: 100%;
            height: 400px;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
            z-index: 10;
        }
        
        .circle-guide {
            width: 220px;
            height: 220px;
            border: 4px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            margin: 0 auto;
            box-shadow: 0 0 0 500px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        
        .circle-guide.waiting {
            border-color: #f59e0b;
            animation: pulse 1.5s infinite;
        }
        
        .circle-guide.good {
            border-color: #10b981;
            border-width: 6px;
            animation: pulseGreen 1.5s infinite;
        }
        
        .circle-guide.error {
            border-color: #ef4444;
            border-width: 6px;
        }
        
        .instruction-box {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 40px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
            margin-top: 10px;
        }
        
        .timer-bar {
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }
        
        .timer-fill {
            height: 100%;
            background: #10b981;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .status-bar {
            padding: 15px;
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .attempt-badge {
            background: #4f46e5;
            color: white;
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding: 15px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .btn-primary {
            background: #10b981;
            color: white;
        }
        
        .btn-primary:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        
        .btn-outline {
            background: white;
            border: 2px solid #e5e7eb;
            color: #4b5563;
        }
        
        .btn-outline:hover {
            background: #f3f4f6;
        }
        
        .info-text {
            font-size: 0.8rem;
            color: #6b7280;
            text-align: center;
            padding: 15px;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(245, 158, 11, 0); }
        }
        
        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
        }
        
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .prova-info-card {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 15px;
            border-left: 4px solid #4f46e5;
        }

        .prova-info-card h3 {
            margin: 0 0 10px 0;
            color: #1f2937;
            font-size: 1rem;
        }

        .prova-info-card p {
            margin: 5px 0;
            color: #6b7280;
            font-size: 0.9rem;
        }

        /* Estilo para a sequência de ações */
        .action-sequence {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 30px;
            margin: 0 20px;
            font-size: 0.9rem;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Validar Identidade</h1>
            <p>Posicione seu rosto no círculo para liberar a prova</p>
        </div>
        
        <div class="camera-box">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlayCanvas"></canvas>
            <div class="overlay">
                <div class="circle-guide" id="circle"></div>
                <div class="instruction-box" id="instruction">
                    <span id="instructionText">Inicializando...</span>
                    <div class="timer-bar" id="timerBar">
                        <div class="timer-fill" id="timerFill"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <span class="attempt-badge" id="attemptCounter">Tentativa 1/3</span>
        </div>

        <!-- Indicador de localização -->
        <div class="localizacao-status" id="localizacaoStatus" style="
            padding: 8px 15px;
            background: #f0f9ff;
            border-bottom: 1px solid #bae6fd;
            font-size: 0.85rem;
            color: #0369a1;
            display: flex;
            align-items: center;
            gap: 8px;
        ">
            <i class="fas fa-map-marker-alt"></i>
            <span id="localizacaoTexto">Verificando localização...</span>
        </div>

        <div class="prova-info-card" id="provaInfo">
            <h3><i class="fas fa-file-alt"></i> Prova selecionada:</h3>
            <p id="provaTitulo">Carregando...</p>
            <p id="provaDetalhes"></p>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-primary" id="btnValidar">
                <i class="fas fa-camera"></i> Iniciar Validação
            </button>
            <button class="btn btn-outline" id="btnCancelar">
                <i class="fas fa-times"></i> Cancelar
            </button>
        </div>
        
        <div class="info-text">
            <i class="fas fa-shield-alt"></i>
            A validação facial é necessária para garantir sua identidade
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO
        // ============================================
        const MAX_TENTATIVAS = 3;
        
        // 🔥 NOVAS VARIÁVEIS PARA LIVENESS DETECTION
        let livenessFrames = [];
        let livenessInterval = null;
        let sequenciaAtual = 0;
        let coletandoFrames = false;
        let framesColetados = 0;
        
        const sequenciasAcao = [
            { acao: 'piscar', instrucao: '👁️ Pisque os olhos lentamente', duracao: 2000, dica: 'Pisque 1-2 vezes' },
            { acao: 'sorrir', instrucao: '😊 Sorria por 2 segundos', duracao: 2500, dica: 'Mostre um sorriso natural' },
            { acao: 'neutral', instrucao: '😐 Mantenha expressão neutra', duracao: 2000, dica: 'Fique sério por um momento' }
        ];
        
        // Controle de estado
        let tentativas = 0;
        let stream = null;
        let videoEl = null;
        let detectionInterval = null;
        let modelsLoaded = false;
        let validando = false;
        let provaId = null;
        let tokenProva = null;
        let localizacaoAtual = null;
        
        // Elementos DOM
        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const ctx = overlayCanvas.getContext('2d');
        const circle = document.getElementById('circle');
        const instructionText = document.getElementById('instructionText');
        const timerBar = document.getElementById('timerBar');
        const timerFill = document.getElementById('timerFill');
        const attemptCounter = document.getElementById('attemptCounter');
        const btnValidar = document.getElementById('btnValidar');
        const btnCancelar = document.getElementById('btnCancelar');
        const provaTitulo = document.getElementById('provaTitulo');
        const provaDetalhes = document.getElementById('provaDetalhes');
        
        // ============================================
        // OBTER PARÂMETROS DA URL
        // ============================================
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                provaId: params.get('provaId'),
                token: params.get('token')
            };
        }

        // ============================================
        // CARREGAR DADOS DA PROVA
        // ============================================
        async function carregarDadosProva() {
            const params = getQueryParams();
            provaId = params.provaId;
            
            if (!provaId) {
                provaId = localStorage.getItem('provaId_temp');
                if (!provaId) {
                    alert('Dados da prova não encontrados. Redirecionando...');
                    window.location.href = '/aluno.html';
                    return;
                }
            }
            
            // Verificar localização salva
            const localizacaoSalva = sessionStorage.getItem('ultima_localizacao');
            const statusEl = document.getElementById('localizacaoTexto');
            const statusDiv = document.getElementById('localizacaoStatus');
            
            if (localizacaoSalva && statusEl) {
                try {
                    const loc = JSON.parse(localizacaoSalva);
                    statusEl.innerHTML = `📍 Localização: ${loc.latitude.toFixed(4)}, ${loc.longitude.toFixed(4)}`;
                    statusDiv.style.background = '#f0fdf4';
                    statusDiv.style.color = '#166534';
                    localizacaoAtual = loc;
                } catch (e) {
                    console.warn('Erro ao ler localização salva');
                }
            }
            
            try {
                let dadosTemp = localStorage.getItem('provaDados_temp') || localStorage.getItem('provaData_temp');
                let tokenTemp = localStorage.getItem('provaToken_temp') || localStorage.getItem('provaToken');
                
                if (dadosTemp) {
                    const dados = JSON.parse(dadosTemp);
                    provaTitulo.textContent = dados.titulo || 'Prova sem título';
                    
                    let detalhes = '';
                    if (dados.conteudo) {
                        detalhes += `📚 ${dados.conteudo.substring(0, 100)}${dados.conteudo.length > 100 ? '...' : ''}`;
                    }
                    if (dados.quantidadeQuestoes) {
                        detalhes += ` | ${dados.quantidadeQuestoes} questões`;
                    }
                    if (dados.periodo) {
                        detalhes += ` | ${dados.periodo}º Período`;
                    }
                    provaDetalhes.textContent = detalhes || 'Clique em "Iniciar Validação" para começar';
                } else {
                    provaTitulo.textContent = 'Prova selecionada';
                    provaDetalhes.textContent = 'Clique em "Iniciar Validação" para continuar';
                }
                
                if (tokenTemp) {
                    tokenProva = tokenTemp;
                }
                
                console.log('✅ Dados da prova carregados');
                
            } catch (error) {
                console.error('Erro ao carregar dados da prova:', error);
                provaTitulo.textContent = 'Prova selecionada';
                provaDetalhes.textContent = 'Clique em "Iniciar Validação" para continuar';
            }
        }
        
        // ============================================
        // CARREGAR MODELOS FACE-API
        // ============================================
        async function carregarModelos() {
            instructionText.innerHTML = '⏳ Carregando detector facial...';
            
            try {
                await faceapi.nets.tinyFaceDetector.load('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
                console.log('✅ TinyFaceDetector carregado');
                
                await faceapi.nets.faceLandmark68Net.load('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
                console.log('✅ FaceLandmark68 carregado');
                
                modelsLoaded = true;
                instructionText.innerHTML = 'Clique em "Iniciar Validação" e siga as instruções';
                
            } catch (error) {
                console.error('❌ Erro ao carregar modelos:', error);
                instructionText.innerHTML = '❌ Erro no detector. Recarregue a página.';
            }
        }
        
        // ============================================
        // INICIAR CÂMERA
        // ============================================
        async function iniciarCamera() {
            try {
                instructionText.innerHTML = '📷 Solicitando permissão de câmera...';
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });
                
                videoEl = video;
                videoEl.srcObject = stream;
                
                videoEl.onloadedmetadata = () => {
                    videoEl.play();
                    overlayCanvas.width = videoEl.videoWidth;
                    overlayCanvas.height = videoEl.videoHeight;
                    carregarModelos();
                };
                
            } catch (error) {
                console.error('❌ Erro na câmera:', error);
                instructionText.innerHTML = '❌ Erro ao acessar câmera';
            }
        }

        // ============================================
        // VERIFICAR GEOLOCALIZAÇÃO
        // ============================================
        async function verificarGeolocalizacao() {
            return new Promise((resolve) => {
                console.log('📍 Verificando geolocalização...');
                
                const statusEl = document.getElementById('localizacaoTexto');
                const statusDiv = document.getElementById('localizacaoStatus');
                
                if (statusEl) statusEl.innerHTML = '📍 Solicitando permissão...';
                
                if (!navigator.geolocation) {
                    if (statusEl) statusEl.innerHTML = '⚠️ Geolocalização não suportada';
                    resolve({ success: false, podeContinuar: true });
                    return;
                }
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        localizacaoAtual = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        };
                        
                        sessionStorage.setItem('ultima_localizacao', JSON.stringify(localizacaoAtual));
                        
                        if (statusEl) {
                            statusEl.innerHTML = `📍 Localização: ${localizacaoAtual.latitude.toFixed(4)}, ${localizacaoAtual.longitude.toFixed(4)}`;
                        }
                        if (statusDiv) {
                            statusDiv.style.background = '#f0fdf4';
                            statusDiv.style.color = '#166534';
                        }
                        
                        resolve({ success: true, coords: localizacaoAtual });
                    },
                    (error) => {
                        let mensagem = '';
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                mensagem = '⚠️ Permissão negada. A prova continuará.';
                                break;
                            default:
                                mensagem = '⚠️ Localização não disponível.';
                        }
                        
                        if (statusEl) statusEl.innerHTML = mensagem;
                        if (statusDiv) {
                            statusDiv.style.background = '#fef3c7';
                            statusDiv.style.color = '#92400e';
                        }
                        
                        resolve({ success: false, error: mensagem, podeContinuar: true });
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }
        
        // ============================================
        // EXECUTAR SEQUÊNCIA DE LIVENESS
        // ============================================
        async function executarSequenciaLiveness() {
            if (sequenciaAtual >= sequenciasAcao.length) {
                // Todas as sequências executadas, validar todos os frames
                await validarTodosFrames();
                return;
            }
            
            const sequencia = sequenciasAcao[sequenciaAtual];
            instructionText.innerHTML = `${sequencia.instrucao}<br><small style="font-size:0.7rem">${sequencia.dica}</small>`;
            circle.className = 'circle-guide waiting';
            
            // Capturar frames durante a sequência
            const framesPorSegundo = 5; // 5 frames por segundo
            const tempoFrame = 1000 / framesPorSegundo;
            const numeroFrames = Math.ceil(sequencia.duracao / tempoFrame);
            
            let framesColetados = 0;
            const framesDestaSequencia = [];
            
            livenessInterval = setInterval(() => {
                if (framesColetados >= numeroFrames) {
                    clearInterval(livenessInterval);
                    sequenciaAtual++;
                    setTimeout(() => executarSequenciaLiveness(), 500);
                    return;
                }
                
                // Capturar frame do vídeo
                if (videoEl && videoEl.videoWidth > 0) {
                    const canvas = document.createElement('canvas');
                    canvas.width = 160;
                    canvas.height = 120;
                    const canvasCtx = canvas.getContext('2d');
                    canvasCtx.translate(canvas.width, 0);
                    canvasCtx.scale(-1, 1);
                    canvasCtx.drawImage(videoEl, 0, 0, 160, 120);
                    
                    const frameBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    
                    livenessFrames.push({
                        frame: frameBase64.split(',')[1],
                        acao: sequencia.acao,
                        timestamp: Date.now(),
                        ordem: framesColetados
                    });
                    
                    framesColetados++;
                }
            }, tempoFrame);
        }
        
        // ============================================
        // VALIDAR TODOS OS FRAMES CAPTURADOS
        // ============================================
        async function validarTodosFrames() {
            if (livenessFrames.length === 0) {
                instructionText.innerHTML = '❌ Não foi possível capturar frames. Tente novamente.';
                btnValidar.disabled = false;
                btnCancelar.disabled = false;
                validando = false;
                return;
            }
            
            instructionText.innerHTML = `📸 Analisando ${livenessFrames.length} frames... Aguarde.`;
            
            try {
                const token = localStorage.getItem('auth_token');
                const user = JSON.parse(localStorage.getItem('user_data') || '{}');
                
                const response = await fetch('/api/auth/validar-camera', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuarioId: user.id,
                        frames: livenessFrames.map(f => f.frame),
                        acoes: livenessFrames.map(f => f.acao),
                        timestamps: livenessFrames.map(f => f.timestamp),
                        localizacao: localizacaoAtual
                    })
                });
                
                const data = await response.json();
                console.log('📦 Resposta da validação:', data);
                
                if (data.success && data.reconhecido) {
                    instructionText.innerHTML = '✅ Identidade confirmada! Redirecionando...';
                    sessionStorage.setItem('face_validado_' + provaId, 'true');
                    
                    // Enviar localização
                    if (localizacaoAtual) {
                        try {
                            await fetch('/api/provas/registrar-localizacao', {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    provaId: provaId,
                                    latitude: localizacaoAtual.latitude,
                                    longitude: localizacaoAtual.longitude,
                                    accuracy: localizacaoAtual.accuracy || 0
                                })
                            });
                        } catch (locError) {
                            console.warn('⚠️ Erro ao enviar localização:', locError);
                        }
                    }
                    
                    // Recuperar token da prova
                    const tokenProva = localStorage.getItem('provaToken_temp') || localStorage.getItem('provaToken');
                    
                    if (tokenProva) {
                        localStorage.setItem('provaToken', tokenProva);
                        localStorage.setItem('provaAtual', provaId);
                        localStorage.removeItem('provaToken_temp');
                        localStorage.removeItem('provaData_temp');
                        localStorage.removeItem('provaId_temp');
                        
                        setTimeout(() => {
                            window.location.href = `/realizar-prova.html?token=${tokenProva}`;
                        }, 1500);
                    } else {
                        setTimeout(() => {
                            window.location.href = '/aluno.html';
                        }, 1500);
                    }
                    
                } else {
                    throw new Error(data.error || 'Falha na validação');
                }
                
            } catch (error) {
                console.error('❌ Erro na validação:', error);
                
                tentativas++;
                attemptCounter.textContent = `Tentativa ${tentativas}/${MAX_TENTATIVAS}`;
                
                if (tentativas >= MAX_TENTATIVAS) {
                    instructionText.innerHTML = '❌ Muitas tentativas. Tente novamente mais tarde.';
                    btnValidar.disabled = true;
                    setTimeout(() => {
                        window.location.href = '/aluno.html';
                    }, 3000);
                } else {
                    instructionText.innerHTML = '❌ ' + (error.message || 'Falha na validação');
                    btnValidar.disabled = false;
                    btnCancelar.disabled = false;
                    validando = false;
                    livenessFrames = [];
                    sequenciaAtual = 0;
                }
            }
        }
        
        // ============================================
        // INICIAR VALIDAÇÃO COM LIVENESS
        // ============================================
        async function iniciarValidacao() {
            if (validando) return;
            
            // Resetar estado
            livenessFrames = [];
            sequenciaAtual = 0;
            tentativas = 0;
            attemptCounter.textContent = `Tentativa 1/${MAX_TENTATIVAS}`;
            
            btnValidar.disabled = true;
            btnValidar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Obtendo localização...';
            instructionText.innerHTML = '📍 Obtendo localização...';
            
            // Capturar localização
            await verificarGeolocalizacao();
            
            validando = true;
            btnValidar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Validando...';
            
            // Pequeno delay antes de iniciar a sequência
            setTimeout(() => {
                executarSequenciaLiveness();
            }, 500);
        }
        
        // ============================================
        // CANCELAR VALIDAÇÃO
        // ============================================
        function cancelarValidacao() {
            if (confirm('Deseja cancelar a validação? Você será redirecionado para o painel.')) {
                window.location.href = '/aluno.html';
            }
        }
        
        // ============================================
        // LIMPEZA AO SAIR
        // ============================================
        window.addEventListener('beforeunload', () => {
            if (detectionInterval) clearInterval(detectionInterval);
            if (livenessInterval) clearInterval(livenessInterval);
            if (window.contagemTimer) clearInterval(window.contagemTimer);
            if (stream) stream.getTracks().forEach(t => t.stop());
        });
        
        // ============================================
        // EVENTOS DOS BOTÕES
        // ============================================
        btnValidar.onclick = iniciarValidacao;
        btnCancelar.onclick = cancelarValidacao;
        
        // ============================================
        // INICIAR TUDO
        // ============================================
        carregarDadosProva();
        iniciarCamera();

        // Verificar localização automaticamente
        setTimeout(() => {
            verificarGeolocalizacao();
        }, 2000);
    </script>

    <script>
        // ============================================
        // SISTEMA DE ESCALONAMENTO PROPORCIONAL - APENAS MOBILE
        // ============================================
        (function() {
            if (window.innerWidth > 768) {
                console.log('📐 Desktop detectado - escalonamento desativado');
                return;
            }
            
            console.log('📐 Inicializando sistema de escalonamento proporcional (mobile)...');
            
            function calcularEscalaMobile() {
                const width = window.innerWidth;
                const baseWidth = 768;
                let escala = Math.max(0.5, Math.min(1, width / baseWidth));
                
                if (width <= 320) escala = 0.55;
                else if (width <= 360) escala = 0.6;
                else if (width <= 400) escala = 0.65;
                else if (width <= 500) escala = 0.75;
                else if (width <= 600) escala = 0.85;
                else if (width <= 700) escala = 0.95;
                else escala = 1;
                
                return escala;
            }
            
            function aplicarEscalaMobile() {
                if (window.innerWidth > 768) return;
                const escala = calcularEscalaMobile();
                document.documentElement.style.setProperty('--scale-ratio', escala);
                document.documentElement.style.setProperty('--current-width', window.innerWidth);
                console.log(`📐 Mobile: escala ${escala.toFixed(2)} | largura: ${window.innerWidth}px`);
            }
            
            aplicarEscalaMobile();
            
            let timeout;
            window.addEventListener('resize', function() {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    if (window.innerWidth <= 768) {
                        aplicarEscalaMobile();
                    } else {
                        document.documentElement.style.setProperty('--scale-ratio', '1');
                        console.log('📐 Modo desktop - escala resetada');
                    }
                }, 100);
            });
            
            window.addEventListener('orientationchange', function() {
                setTimeout(() => {
                    if (window.innerWidth <= 768) {
                        aplicarEscalaMobile();
                    }
                }, 200);
            });
            
            console.log('✅ Sistema de escalonamento mobile ativo!');
        })();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('✅ Service Worker ativo'))
                    .catch(err => console.log('❌ Erro:', err));
            });
        }

        window.addEventListener('online', () => console.log('🌐 Online'));
        window.addEventListener('offline', () => console.log('📴 Offline'));
    </script>
