<!DOCTYPE html>
<html lang="pt-BR">
<head>

        <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Editar Perfil">

    <!-- 🔥 FAVICON LOCAL -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/favicon.ico">

    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gestão Geral - Controle de Rodízio de Refeições</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Acessibilidade -->
    <script src="js/vlibras-oficial.js"></script>
    <script src="js/acessibilidade.js"></script>
    <script src="js/toggle-buttons.js"></script>
    <script src="js/draggable.js"></script>
    <script src="js/chatbot-frontend.js"></script>
    <script src="js/push-client.js"></script>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/gestao-geral.css">

</head>
<body>
    <div class="container">
        <!-- Header com informações do usuário e botões -->
        <div class="header-top">
            <div class="user-info-card">
                <div class="user-avatar" id="userAvatar">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div class="user-details">
                    <div class="user-name" id="userName">Carregando...</div>
                    <div class="user-role" id="userRole">Gestão Geral</div>
                </div>
            </div>
            <div class="btn-actions">
                <!-- LINK DO APP (antes do Editar Perfil) -->
                <a href="https://drive.google.com/file/d/1AcB6NmGjKO0JlmKmQURonscInc-1MfQn/view?usp=sharing" target="_blank" class="btn-icon" style="
                    background: linear-gradient(135deg, #10b981, #059669);
                    border-radius: 50%;
                    width: 40px;
                    height: 40px;
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    text-decoration: none;
                    color: white;
                    transition: all 0.3s;
                " title="Baixar App">
                    <i class="fas fa-download"></i>
                </a>
                <button class="btn-icon" onclick="window.location.href='editar-perfil.html'" title="Editar Perfil">
                    <i class="fas fa-user-edit"></i>
                </button>
                <button class="btn-icon danger" onclick="logout()" title="Sair do Sistema">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
        
        <!-- Título da página -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <i class="fas fa-calendar-alt me-2"></i>
                    Controle de Rodízio de Refeições - Gestão Geral
                </div>
                <div>
                    <span id="dataAtual" class="badge bg-light text-dark"></span>
                </div>
            </div>
        </div>
        
        <!-- Cards de Estatísticas -->
        <div class="stats-grid">
            <div class="stat-card" onclick="carregarRodizios()">
                <div class="stat-number" id="totalRodizios">0</div>
                <div class="stat-label">Total de Rodízios</div>
            </div>
            <div class="stat-card" onclick="filtrarRodizios('ativos')">
                <div class="stat-number" id="rodiziosAtivos">0</div>
                <div class="stat-label">Rodízios Ativos</div>
            </div>
            <div class="stat-card" onclick="filtrarRodizios('inativos')">
                <div class="stat-number" id="rodiziosInativos">0</div>
                <div class="stat-label">Rodízios Inativos</div>
            </div>
            <div class="stat-card" onclick="mostrarTurmasSemRodizio()">
                <div class="stat-number" id="turmasSemRodizio">0</div>
                <div class="stat-label">Turmas sem Rodízio</div>
            </div>
        </div>
        
        <!-- Botão Novo Rodízio -->
        <div class="card">
            <div class="card-body">
                <button class="btn-primary btn-sm" onclick="abrirModalRodizio()">
                    <i class="fas fa-plus"></i> Novo Rodízio
                </button>
                <button class="btn-success btn-sm ms-2" onclick="carregarRodizios()">
                    <i class="fas fa-sync-alt"></i> Atualizar
                </button>
            </div>
        </div>
        
        <!-- Tabela de Rodízios -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-list me-2"></i> Rodízios Configurados
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Turma</th>
                                <th>Tipo</th>
                                <th>Dias Permitidos</th>
                                <th>Horário</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaRodizios">
                            <tr><td colspan="6" class="text-center py-5"><div class="loading-spinner"></div> Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal de Edição/Criação de Rodízio -->
    <div class="modal fade" id="modalRodizio" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-calendar-alt"></i> Configurar Rodízio</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formRodizio">
                        <div class="mb-3">
                            <label class="form-label">Turma</label>
                            <select id="rodizioTurma" class="form-select" required>
                                <option value="">Selecione uma turma...</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Tipo de Rodízio</label>
                            <select id="rodizioTipo" class="form-select" onchange="toggleTipoRodizio()">
                                <option value="semanal">📅 Semanal (dias da semana)</option>
                                <option value="mensal">📆 Mensal (dias do mês)</option>
                                <option value="ambos">🔄 Ambos</option>
                            </select>
                        </div>
                        
                        <div id="diasSemanaDiv" class="mb-3">
                            <label class="form-label">Dias da Semana que podem almoçar</label>
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="1" id="diaSegunda">
                                        <label class="form-check-label">Segunda-feira</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="2" id="diaTerca">
                                        <label class="form-check-label">Terça-feira</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="3" id="diaQuarta">
                                        <label class="form-check-label">Quarta-feira</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="4" id="diaQuinta">
                                        <label class="form-check-label">Quinta-feira</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="5" id="diaSexta">
                                        <label class="form-check-label">Sexta-feira</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="6" id="diaSabado">
                                        <label class="form-check-label">Sábado</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="0" id="diaDomingo">
                                        <label class="form-check-label">Domingo</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div id="diasMesDiv" class="mb-3" style="display: none;">
                            <label class="form-label">Dias do Mês que podem almoçar</label>
                            <div class="row">
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="1" id="diaMes1">
                                        <label class="form-check-label">Dia 1</label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="2" id="diaMes2">
                                        <label class="form-check-label">Dia 2</label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="3" id="diaMes3">
                                        <label class="form-check-label">Dia 3</label>
                                    </div>
                                </div>
                                <!-- Continue até 31 -->
                            </div>
                            <small class="text-muted">Selecione os dias específicos do mês</small>
                        </div>
                        
                        <div id="semanasMesDiv" class="mb-3" style="display: none;">
                            <label class="form-label">Semanas do Mês que podem almoçar</label>
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="1" id="semana1">
                                        <label class="form-check-label">1ª Semana</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="2" id="semana2">
                                        <label class="form-check-label">2ª Semana</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="3" id="semana3">
                                        <label class="form-check-label">3ª Semana</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" value="4" id="semana4">
                                        <label class="form-check-label">4ª Semana</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Horário de Início</label>
                                <input type="time" id="rodizioHorarioInicio" class="form-control" value="11:00">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Horário de Término</label>
                                <input type="time" id="rodizioHorarioFim" class="form-control" value="13:00">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" id="rodizioAtivo" class="form-check-input" checked>
                                <label class="form-check-label">Rodízio Ativo</label>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Descrição (opcional)</label>
                            <textarea id="rodizioDescricao" class="form-control" rows="2" placeholder="Informações adicionais sobre o rodízio..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-primary btn-sm" onclick="salvarRodizio()">Salvar</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================
        // GESTÃO GERAL - CONTROLE DE RODÍZIO
        // ============================================
        
        let token = localStorage.getItem('auth_token');
        let userData = {};
        let modalRodizio = null;
        let rodizioEditando = null;
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', async () => {
            if (!token) { window.location.href = '/login.html'; return; }
            
            userData = JSON.parse(localStorage.getItem('user_data') || '{}');
            if (userData.role !== 'gestao_geral' && userData.role !== 'super_admin' && userData.role !== 'admin') {
                alert('Acesso negado.');
                window.location.href = '/login.html';
                return;
            }
            
            document.getElementById('userName').textContent = userData.nome || 'Gestão Geral';
            document.getElementById('dataAtual').textContent = new Date().toLocaleDateString('pt-BR');
            
            await carregarFotoPerfil();
            await carregarRodizios();
            
            modalRodizio = new bootstrap.Modal(document.getElementById('modalRodizio'));
        });
        
        async function carregarFotoPerfil() {
            try {
                const response = await fetch('/api/perfil/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success && data.perfil && data.perfil.fotoPerfil) {
                    const avatarDiv = document.getElementById('userAvatar');
                    if (avatarDiv) {
                        avatarDiv.innerHTML = `<img src="${data.perfil.fotoPerfil}" alt="Foto de perfil">`;
                    }
                }
            } catch (error) {
                console.error('Erro ao carregar foto:', error);
            }
        }
        
        async function carregarRodizios() {
            try {
                const response = await fetch('/api/gestao-geral/rodizios', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    window.rodiziosData = data.rodizios;
                    window.todasTurmas = data.todasTurmas;
                    
                    // Atualizar estatísticas
                    const ativos = data.rodizios.filter(r => r.ativo).length;
                    const inativos = data.rodizios.length - ativos;
                    const turmasComRodizio = new Set(data.rodizios.map(r => r.turma));
                    const turmasSem = data.todasTurmas.filter(t => !turmasComRodizio.has(t));
                    
                    document.getElementById('totalRodizios').textContent = data.rodizios.length;
                    document.getElementById('rodiziosAtivos').textContent = ativos;
                    document.getElementById('rodiziosInativos').textContent = inativos;
                    document.getElementById('turmasSemRodizio').textContent = turmasSem.length;
                    
                    // Preencher tabela
                    renderizarTabela(data.rodizios);
                }
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('tabelaRodizios').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Erro ao carregar rodízios</td></tr>';
            }
        }
        
        function renderizarTabela(rodizios) {
            const tbody = document.getElementById('tabelaRodizios');
            
            if (!rodizios || rodizios.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5">Nenhum rodízio configurado</td></tr>';
                return;
            }
            
            const diasSemanaNomes = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
            
            let html = '';
            rodizios.forEach(r => {
                let diasTexto = '';
                if (r.tipoRodizio === 'semanal' || r.tipoRodizio === 'ambos') {
                    diasTexto = r.diasSemana.map(d => diasSemanaNomes[d]).join(', ');
                }
                if (r.tipoRodizio === 'mensal' || r.tipoRodizio === 'ambos') {
                    if (diasTexto) diasTexto += ' | ';
                    if (r.diasMes && r.diasMes.length > 0) {
                        diasTexto += `Dias: ${r.diasMes.join(', ')}`;
                    }
                    if (r.semanasMes && r.semanasMes.length > 0) {
                        if (diasTexto && !diasTexto.includes('Dias:')) diasTexto += ' | ';
                        diasTexto += `Semanas: ${r.semanasMes.map(s => `${s}ª`).join(', ')}`;
                    }
                }
                
                html += `
                    <tr>
                        <td><strong>${r.turma}</strong></td>
                        <td>
                            <span class="badge ${r.tipoRodizio === 'semanal' ? 'bg-info' : r.tipoRodizio === 'mensal' ? 'bg-warning' : 'bg-primary'}">
                                ${r.tipoRodizio === 'semanal' ? '📅 Semanal' : r.tipoRodizio === 'mensal' ? '📆 Mensal' : '🔄 Ambos'}
                            </span>
                        </td>
                        <td style="max-width: 300px;">${diasTexto || '-'}</td>
                        <td>${r.horarioInicio} - ${r.horarioFim}</td>
                        <td>
                            <span class="status-badge ${r.ativo ? 'status-ativo' : 'status-inativo'}">
                                ${r.ativo ? 'Ativo' : 'Inativo'}
                            </span>
                        </td>
                        <td>
                            <button class="btn-warning btn-sm" onclick="editarRodizio('${r.turma}')">
                                <i class="fas fa-edit"></i> Editar
                            </button>
                            <button class="btn-danger btn-sm ms-1" onclick="excluirRodizio('${r.turma}')">
                                <i class="fas fa-trash"></i> Excluir
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }
        
        async function abrirModalRodizio(turma = null) {
            rodizioEditando = turma;
            
            // Carregar turmas para o select
            const selectTurma = document.getElementById('rodizioTurma');
            selectTurma.innerHTML = '<option value="">Selecione uma turma...</option>';
            
            if (window.todasTurmas) {
                window.todasTurmas.forEach(t => {
                    selectTurma.innerHTML += `<option value="${t}">${t}</option>`;
                });
            }
            
            // Se estiver editando, carregar dados
            if (turma) {
                try {
                    const response = await fetch(`/api/gestao-geral/rodizios/${turma}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    
                    if (data.success && data.rodizio) {
                        const r = data.rodizio;
                        
                        selectTurma.value = r.turma;
                        selectTurma.disabled = true;
                        
                        document.getElementById('rodizioTipo').value = r.tipoRodizio;
                        toggleTipoRodizio();
                        
                        // Marcar dias da semana
                        if (r.diasSemana) {
                            document.getElementById('diaDomingo').checked = r.diasSemana.includes(0);
                            document.getElementById('diaSegunda').checked = r.diasSemana.includes(1);
                            document.getElementById('diaTerca').checked = r.diasSemana.includes(2);
                            document.getElementById('diaQuarta').checked = r.diasSemana.includes(3);
                            document.getElementById('diaQuinta').checked = r.diasSemana.includes(4);
                            document.getElementById('diaSexta').checked = r.diasSemana.includes(5);
                            document.getElementById('diaSabado').checked = r.diasSemana.includes(6);
                        }
                        
                        // Marcar dias do mês
                        if (r.diasMes) {
                            for (let i = 1; i <= 31; i++) {
                                const cb = document.getElementById(`diaMes${i}`);
                                if (cb) cb.checked = r.diasMes.includes(i);
                            }
                        }
                        
                        // Marcar semanas
                        if (r.semanasMes) {
                            document.getElementById('semana1').checked = r.semanasMes.includes(1);
                            document.getElementById('semana2').checked = r.semanasMes.includes(2);
                            document.getElementById('semana3').checked = r.semanasMes.includes(3);
                            document.getElementById('semana4').checked = r.semanasMes.includes(4);
                        }
                        
                        document.getElementById('rodizioHorarioInicio').value = r.horarioInicio || '11:00';
                        document.getElementById('rodizioHorarioFim').value = r.horarioFim || '13:00';
                        document.getElementById('rodizioAtivo').checked = r.ativo;
                        document.getElementById('rodizioDescricao').value = r.descricao || '';
                    }
                } catch (error) {
                    console.error('Erro ao carregar rodízio:', error);
                }
            } else {
                selectTurma.disabled = false;
                // Resetar formulário
                document.getElementById('rodizioTipo').value = 'semanal';
                toggleTipoRodizio();
                document.getElementById('rodizioHorarioInicio').value = '11:00';
                document.getElementById('rodizioHorarioFim').value = '13:00';
                document.getElementById('rodizioAtivo').checked = true;
                document.getElementById('rodizioDescricao').value = '';
                
                // Desmarcar todos os dias
                document.querySelectorAll('#diasSemanaDiv input[type="checkbox"]').forEach(cb => cb.checked = false);
                document.querySelectorAll('#diasMesDiv input[type="checkbox"]').forEach(cb => cb.checked = false);
                document.querySelectorAll('#semanasMesDiv input[type="checkbox"]').forEach(cb => cb.checked = false);
            }
            
            modalRodizio.show();
        }
        
        function toggleTipoRodizio() {
            const tipo = document.getElementById('rodizioTipo').value;
            
            document.getElementById('diasSemanaDiv').style.display = (tipo === 'semanal' || tipo === 'ambos') ? 'block' : 'none';
            document.getElementById('diasMesDiv').style.display = (tipo === 'mensal' || tipo === 'ambos') ? 'block' : 'none';
            document.getElementById('semanasMesDiv').style.display = (tipo === 'mensal' || tipo === 'ambos') ? 'block' : 'none';
        }
        
        async function salvarRodizio() {
            const turma = document.getElementById('rodizioTurma').value;
            if (!turma) {
                alert('Selecione uma turma');
                return;
            }
            
            const tipoRodizio = document.getElementById('rodizioTipo').value;
            
            // Coletar dias da semana
            const diasSemana = [];
            if (document.getElementById('diaDomingo').checked) diasSemana.push(0);
            if (document.getElementById('diaSegunda').checked) diasSemana.push(1);
            if (document.getElementById('diaTerca').checked) diasSemana.push(2);
            if (document.getElementById('diaQuarta').checked) diasSemana.push(3);
            if (document.getElementById('diaQuinta').checked) diasSemana.push(4);
            if (document.getElementById('diaSexta').checked) diasSemana.push(5);
            if (document.getElementById('diaSabado').checked) diasSemana.push(6);
            
            // Coletar dias do mês
            const diasMes = [];
            for (let i = 1; i <= 31; i++) {
                const cb = document.getElementById(`diaMes${i}`);
                if (cb && cb.checked) diasMes.push(i);
            }
            
            // Coletar semanas
            const semanasMes = [];
            if (document.getElementById('semana1').checked) semanasMes.push(1);
            if (document.getElementById('semana2').checked) semanasMes.push(2);
            if (document.getElementById('semana3').checked) semanasMes.push(3);
            if (document.getElementById('semana4').checked) semanasMes.push(4);
            
            const dados = {
                turma,
                tipoRodizio,
                diasSemana,
                diasMes,
                semanasMes,
                horarioInicio: document.getElementById('rodizioHorarioInicio').value,
                horarioFim: document.getElementById('rodizioHorarioFim').value,
                ativo: document.getElementById('rodizioAtivo').checked,
                descricao: document.getElementById('rodizioDescricao').value
            };
            
            try {
                const response = await fetch('/api/gestao-geral/rodizios', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Rodízio salvo com sucesso!');
                    modalRodizio.hide();
                    await carregarRodizios();
                } else {
                    alert('❌ Erro: ' + data.error);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao salvar rodízio');
            }
        }
        
        function editarRodizio(turma) {
            abrirModalRodizio(turma);
        }
        
        async function excluirRodizio(turma) {
            if (!confirm(`Excluir rodízio da turma ${turma}?`)) return;
            
            try {
                const response = await fetch(`/api/gestao-geral/rodizios/${turma}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Rodízio excluído!');
                    await carregarRodizios();
                } else {
                    alert('❌ Erro: ' + data.error);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao excluir rodízio');
            }
        }
        
        function filtrarRodizios(tipo) {
            if (!window.rodiziosData) return;
            
            let filtrados = window.rodiziosData;
            if (tipo === 'ativos') filtrados = filtrados.filter(r => r.ativo);
            if (tipo === 'inativos') filtrados = filtrados.filter(r => !r.ativo);
            
            renderizarTabela(filtrados);
        }
        
        function mostrarTurmasSemRodizio() {
            if (!window.todasTurmas || !window.rodiziosData) return;
            
            const turmasComRodizio = new Set(window.rodiziosData.map(r => r.turma));
            const turmasSem = window.todasTurmas.filter(t => !turmasComRodizio.has(t));
            
            if (turmasSem.length === 0) {
                alert('✅ Todas as turmas já possuem rodízio configurado!');
            } else {
                alert(`📋 Turmas sem rodízio:\n\n${turmasSem.join('\n')}\n\nTotal: ${turmasSem.length} turmas`);
            }
        }
        
        function logout() {
            if (confirm('Tem certeza que deseja sair do sistema?')) {
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user_data');
                window.location.href = '/login.html';
            }
        }
        
        window.abrirModalRodizio = abrirModalRodizio;
        window.editarRodizio = editarRodizio;
        window.excluirRodizio = excluirRodizio;
        window.filtrarRodizios = filtrarRodizios;
        window.mostrarTurmasSemRodizio = mostrarTurmasSemRodizio;
        window.carregarRodizios = carregarRodizios;
        window.salvarRodizio = salvarRodizio;
        window.toggleTipoRodizio = toggleTipoRodizio;
        window.logout = logout;
    </script>

        <script>
        // ============================================
        // SISTEMA DE ESCALONAMENTO PROPORCIONAL - APENAS MOBILE
        // ============================================
        (function() {
            if (window.innerWidth > 768) {
                console.log('📐 Desktop detectado - escalonamento desativado');
                return;
            }
            
            console.log('📐 Inicializando sistema de escalonamento proporcional (mobile)...');
            
            function calcularEscalaMobile() {
                const width = window.innerWidth;
                const baseWidth = 768;
                let escala = Math.max(0.5, Math.min(1, width / baseWidth));
                
                if (width <= 320) escala = 0.55;
                else if (width <= 360) escala = 0.6;
                else if (width <= 400) escala = 0.65;
                else if (width <= 500) escala = 0.75;
                else if (width <= 600) escala = 0.85;
                else if (width <= 700) escala = 0.95;
                else escala = 1;
                
                return escala;
            }
            
            function aplicarEscalaMobile() {
                if (window.innerWidth > 768) return;
                const escala = calcularEscalaMobile();
                document.documentElement.style.setProperty('--scale-ratio', escala);
                document.documentElement.style.setProperty('--current-width', window.innerWidth);
                console.log(`📐 Mobile: escala ${escala.toFixed(2)} | largura: ${window.innerWidth}px`);
            }
            
            aplicarEscalaMobile();
            
            let timeout;
            window.addEventListener('resize', function() {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    if (window.innerWidth <= 768) {
                        aplicarEscalaMobile();
                    } else {
                        document.documentElement.style.setProperty('--scale-ratio', '1');
                        console.log('📐 Modo desktop - escala resetada');
                    }
                }, 100);
            });
            
            window.addEventListener('orientationchange', function() {
                setTimeout(() => {
                    if (window.innerWidth <= 768) {
                        aplicarEscalaMobile();
                    }
                }, 200);
            });
            
            console.log('✅ Sistema de escalonamento mobile ativo!');
        })();
    </script>

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('✅ Service Worker ativo'))
                    .catch(err => console.log('❌ Erro:', err));
            });
        }

        window.addEventListener('online', () => console.log('🌐 Online'));
