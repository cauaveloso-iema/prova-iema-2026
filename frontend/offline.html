<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - EducaPleno</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EducaPleno">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/favicon.ico">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS (Certifique-se de que o arquivo está na pasta css/ e com 2 'f') -->
    <link rel="stylesheet" href="css/offline.css">
</head>
<body>
    <div class="offline-card">
        <div class="icon" id="iconContainer">
            <i class="fas fa-wifi-slash"></i>
        </div>
        
        <h1 id="statusTitle">📴 Você está offline</h1>
        <p id="statusMessage">Não foi possível carregar esta página. Conecte-se à internet e tente novamente.</p>
        
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div id="countdownDisplay" class="countdown"></div>
        
        <div class="actions">
            <button class="btn" onclick="window.location.reload()" id="reloadBtn">
                <i class="fas fa-sync-alt"></i> Tentar novamente
            </button>

            <button class="btn btn-success" onclick="voltarParaPaginaAnterior()" id="backBtn" style="display: none;">
                <i class="fas fa-arrow-left"></i> Voltar para página anterior
            </button> 
        </div>

        <div class="dicas">
            <h3><i class="fas fa-lightbulb" style="color: #f59e0b;"></i> Dicas:</h3>
            <ul>
                <li>Verifique sua conexão WiFi</li>
                <li>Desative o modo avião</li>
                <li>Provas em andamento continuam disponíveis</li>
                <li>Seus dados serão sincronizados automaticamente</li>
            </ul>
        </div>
    </div>

    <script>
        // Variáveis de controle
        let intervalo;
        let tempoRestante = 5;
        let paginaAnterior = document.referrer || localStorage.getItem('ultimaPagina') || '/';
        
        // Elementos DOM
        const statusTitle = document.getElementById('statusTitle');
        const statusMessage = document.getElementById('statusMessage');
        const reloadBtn = document.getElementById('reloadBtn');
        const backBtn = document.getElementById('backBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const iconContainer = document.getElementById('iconContainer');
        
        // Salvar página atual como última visitada
        localStorage.setItem('ultimaPagina', window.location.pathname);
        
        // Verificar conexão real
        async function verificarConexao() {
            try {
                await fetch('/api/health-check', {
                    method: 'GET',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    signal: AbortSignal.timeout(3000)
                });
                return navigator.onLine;
            } catch (error) {
                return false;
            }
        }
        
        // Voltar para página anterior
        function voltarParaPaginaAnterior() {
            if (paginaAnterior && paginaAnterior !== window.location.href && paginaAnterior !== 'about:blank') {
                window.location.href = paginaAnterior;
            } else {
                window.location.href = '/';
            }
        }
        
        // Interface quando online
        function quandoOnline() {
            statusTitle.innerHTML = '✅ Conexão restaurada!';
            statusTitle.style.color = '#10b981';
            statusMessage.innerHTML = 'Redirecionando para a página anterior...';
            
            // Muda o ícone para verde de sucesso
            iconContainer.style.color = '#10b981';
            iconContainer.innerHTML = '<i class="fas fa-check-circle"></i>';
            
            reloadBtn.style.display = 'none';
            backBtn.style.display = 'inline-block';
            progressBar.style.display = 'block';
            
            tempoRestante = 5;
            countdownDisplay.innerHTML = `Redirecionando em ${tempoRestante} segundos...`;
            
            intervalo = setInterval(() => {
                tempoRestante--;
                const progresso = ((5 - tempoRestante) / 5) * 100;
                progressFill.style.width = progresso + '%';
                countdownDisplay.innerHTML = `Redirecionando em ${tempoRestante} segundos...`;
                
                if (tempoRestante <= 0) {
                    clearInterval(intervalo);
                    voltarParaPaginaAnterior();
                }
            }, 1000);
        }
        
        // Interface quando offline
        function quandoOffline() {
            statusTitle.innerHTML = '📴 Você está offline';
            statusTitle.style.color = '#1f2937';
            statusMessage.innerHTML = 'Não foi possível carregar esta página. Conecte-se à internet e tente novamente.';
            
            // Volta o ícone para o original laranja
            iconContainer.style.color = '#f59e0b';
            iconContainer.innerHTML = '<i class="fas fa-wifi-slash"></i>';
            
            reloadBtn.style.display = 'inline-block';
            backBtn.style.display = 'none';
            progressBar.style.display = 'none';
            countdownDisplay.innerHTML = '';
            
            if (intervalo) clearInterval(intervalo);
        }
        
        // Monitorar mudanças de conexão
        window.addEventListener('online', async () => {
            const realmenteOnline = await verificarConexao();
            if (realmenteOnline) quandoOnline();
        });
        
        window.addEventListener('offline', quandoOffline);
        
        // Verificar conexão inicial
        document.addEventListener('DOMContentLoaded', async () => {
            if (navigator.onLine) {
                const realmenteOnline = await verificarConexao();
                if (realmenteOnline) quandoOnline();
            }
        });

        // Tornar função global
        window.voltarParaPaginaAnterior = voltarParaPaginaAnterior;
    </script>
</body>
</html>
