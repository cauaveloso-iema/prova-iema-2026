<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capturar Face ID - Sistema de Provas</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.2/dist/face-api.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .camera-box {
            width: 100%;
            height: 300px;
            background: #1e1e2e;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
        }
        .camera-placeholder {
            text-align: center;
            color: #9ca3af;
        }
        .camera-placeholder i {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }
        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .instruction-box {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 40px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            margin: 15px;
        }
        .status-bar {
            padding: 15px;
            background: #f8fafc;
            text-align: center;
        }
        .attempt-badge {
            background: #4f46e5;
            color: white;
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            padding: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #10b981;
            color: white;
        }
        .btn-outline {
            background: white;
            border: 2px solid #e5e7eb;
            color: #4b5563;
        }
        .btn-skip {
            background: #9ca3af;
            color: white;
            width: calc(100% - 30px);
            margin: 0 15px 15px;
        }
        .info-text {
            font-size: 0.8rem;
            color: #6b7280;
            text-align: center;
            padding: 15px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .reminder-banner {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 12px;
            margin: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #92400e;
            display: none;
        }
        .reminder-banner.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Cadastro de Face ID</h1>
            <p>Clique no botão para tirar uma foto do seu rosto</p>
        </div>
        
        <div class="reminder-banner" id="reminderBanner">
            <i class="fas fa-bell"></i>
            <strong>Lembrete:</strong> Você precisará cadastrar sua Face ID para acessar as provas
        </div>
        
        <div class="camera-box">
            <div id="cameraPlaceholder" class="camera-placeholder">
                <i class="fas fa-camera"></i>
                <p>Clique em "Tirar Foto" para abrir a câmera</p>
            </div>
            <img id="previewImg" class="preview-img" alt="Preview">
        </div>
        
        <div class="instruction-box" id="instruction">
            <span id="instructionText">Aguardando ação...</span>
        </div>
        
        <div class="status-bar">
            <span class="attempt-badge" id="attemptCounter">Tentativa 1/3</span>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-primary" id="btnCapturar">
                <i class="fas fa-camera"></i> Tirar Foto
            </button>
            <button class="btn btn-outline" id="btnTentarNovamente" style="display: none;">
                <i class="fas fa-redo"></i> Tentar de novo
            </button>
        </div>
        
        <button class="btn btn-skip" id="btnSkip">
            <i class="fas fa-forward"></i> Fazer depois
        </button>
        
        <div class="info-text">
            <i class="fas fa-shield-alt"></i>
            Sua imagem é usada apenas para validar seu acesso às provas
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO
        // ============================================
        const MAX_TENTATIVAS = 3;
        let tentativas = 0;
        let enviando = false;
        let modelsLoaded = false;
        let ultimaFoto = null;
        
        const instructionText = document.getElementById('instructionText');
        const attemptCounter = document.getElementById('attemptCounter');
        const btnCapturar = document.getElementById('btnCapturar');
        const btnTentarNovamente = document.getElementById('btnTentarNovamente');
        const btnSkip = document.getElementById('btnSkip');
        const previewImg = document.getElementById('previewImg');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');
        const reminderBanner = document.getElementById('reminderBanner');
        
        // ============================================
        // FUNÇÃO PARA COMUNICAR COM KODULAR
        // ============================================
        function abrirCameraKodular() {
            console.log('📱 Solicitando abertura da câmera no Kodular...');
            
            if (window.kodularCamera && window.kodularCamera.capture) {
                window.kodularCamera.capture();
            } else {
                alert('Câmera não disponível. Tente novamente.');
            }
        }
        
        // ============================================
        // FUNÇÃO PARA RECEBER IMAGEM DO KODULAR
        // ============================================
        window.receberImagemKodular = function(imagemBase64) {
            console.log('📸 Imagem recebida do Kodular!');
            
            // Mostrar preview
            previewImg.src = imagemBase64;
            previewImg.style.display = 'block';
            cameraPlaceholder.style.display = 'none';
            btnTentarNovamente.style.display = 'block';
            btnCapturar.style.display = 'none';
            
            ultimaFoto = imagemBase64;
            
            // Validar a imagem
            validarImagem(imagemBase64);
        };
        
        // ============================================
        // VALIDAR IMAGEM COM FACE-API
        // ============================================
        async function validarImagem(imagemBase64) {
            if (enviando) return;
            
            tentativas++;
            attemptCounter.textContent = `Tentativa ${tentativas}/${MAX_TENTATIVAS}`;
            instructionText.innerHTML = '<span class="loading-spinner"></span> Analisando imagem...';
            
            try {
                // Carregar imagem para validação
                const img = new Image();
                img.src = imagemBase64;
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                });
                
                // Verificar se Face-API está carregada
                if (!modelsLoaded) {
                    instructionText.innerHTML = '⏳ Aguardando carregamento do detector...';
                    const carregado = await carregarFaceAPI();
                    if (!carregado) throw new Error('Falha ao carregar detector');
                }
                
                // Detectar rosto
                const detections = await faceapi.detectAllFaces(
                    img, 
                    new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.3 })
                );
                
                if (detections.length === 0) {
                    throw new Error('Nenhum rosto detectado na imagem');
                }
                
                if (detections.length > 1) {
                    throw new Error('Múltiplos rostos detectados');
                }
                
                instructionText.innerHTML = '<span class="loading-spinner"></span> Enviando para cadastro...';
                
                // Enviar para o servidor
                const token = localStorage.getItem('auth_token');
                const user = JSON.parse(localStorage.getItem('user_data') || '{}');
                
                const response = await fetch('/api/auth/cadastrar-face', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuarioId: user.id,
                        imagem: imagemBase64.split(',')[1]
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    instructionText.innerHTML = '✅ Face cadastrada com sucesso!';
                    localStorage.setItem('face_cadastrado', 'true');
                    
                    setTimeout(() => {
                        window.location.href = '/aluno.html';
                    }, 1500);
                    
                } else {
                    throw new Error(data.error || 'Erro no cadastro');
                }
                
            } catch (error) {
                console.error('❌ Erro:', error);
                
                if (tentativas >= MAX_TENTATIVAS) {
                    instructionText.innerHTML = '❌ Muitas tentativas. Você pode cadastrar depois.';
                    btnCapturar.style.display = 'none';
                    btnTentarNovamente.style.display = 'none';
                    setTimeout(() => {
                        window.location.href = '/aluno.html';
                    }, 2000);
                } else {
                    instructionText.innerHTML = '❌ ' + error.message;
                    btnTentarNovamente.style.display = 'block';
                    btnCapturar.style.display = 'none';
                }
            }
        }
        
        // ============================================
        // CARREGAR FACE-API
        // ============================================
        async function carregarFaceAPI() {
            if (modelsLoaded) return true;
            
            instructionText.innerHTML = '⏳ Carregando detector facial...';
            try {
                await faceapi.nets.tinyFaceDetector.load('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
                await faceapi.nets.faceLandmark68Net.load('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
                modelsLoaded = true;
                console.log('✅ Face-API carregada');
                instructionText.innerHTML = 'Clique em "Tirar Foto" para começar';
                return true;
            } catch (error) {
                console.error('❌ Erro ao carregar Face-API:', error);
                instructionText.innerHTML = '❌ Erro ao carregar detector. Recarregue a página.';
                return false;
            }
        }
        
        // ============================================
        // TENTAR NOVAMENTE
        // ============================================
        function tentarNovamente() {
            previewImg.style.display = 'none';
            cameraPlaceholder.style.display = 'flex';
            btnTentarNovamente.style.display = 'none';
            btnCapturar.style.display = 'block';
            instructionText.innerHTML = 'Clique em "Tirar Foto" para começar';
            ultimaFoto = null;
        }
        
        // ============================================
        // VERIFICAR SE FACE JÁ FOI CADASTRADA
        // ============================================
        async function verificarFaceCadastrada() {
            try {
                const token = localStorage.getItem('auth_token');
                const user = JSON.parse(localStorage.getItem('user_data') || '{}');
                
                if (!user.id) return false;
                
                const res = await fetch(`/api/auth/verificar-face/${user.id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await res.json();
                
                if (data.success && data.temFace) {
                    instructionText.innerHTML = '✅ Face ID já cadastrado! Redirecionando...';
                    setTimeout(() => {
                        window.location.href = '/aluno.html';
                    }, 2000);
                    return true;
                }
                return false;
                
            } catch (error) {
                console.error('❌ Erro ao verificar face:', error);
                return false;
            }
        }
        
        // ============================================
        // ENVIAR LEMBRETE
        // ============================================
        async function enviarLembrete() {
            try {
                const token = localStorage.getItem('auth_token');
                const user = JSON.parse(localStorage.getItem('user_data') || '{}');
                
                if (token && user.id) {
                    await fetch('/api/notificacoes', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            usuarioId: user.id,
                            tipo: 'sistema',
                            titulo: '📸 Cadastro de Face ID Pendente',
                            mensagem: 'Você ainda não cadastrou sua Face ID. Clique aqui para cadastrar agora.',
                            icone: '📸',
                            cor: '#f97316',
                            link: '/capturar-face.html',
                            prioridade: 4
                        })
                    });
                    
                    reminderBanner.classList.add('show');
                    setTimeout(() => {
                        reminderBanner.classList.remove('show');
                    }, 10000);
                }
            } catch (error) {
                console.error('❌ Erro:', error);
            }
        }
        
        // ============================================
        // EVENTOS
        // ============================================
        btnCapturar.addEventListener('click', () => {
            abrirCameraKodular();
        });
        
        btnTentarNovamente.addEventListener('click', tentarNovamente);
        
        btnSkip.addEventListener('click', async function(e) {
            e.preventDefault();
            if (confirm('Deseja pular o cadastro facial? Você poderá fazer depois.')) {
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
                this.disabled = true;
                await enviarLembrete();
                window.location.href = '/aluno.html';
            }
        });
        
        // ============================================
        // INICIAR
        // ============================================
        (async function() {
            const jaCadastrada = await verificarFaceCadastrada();
            if (!jaCadastrada) {
                await carregarFaceAPI();
            }
        })();
    </script>
</body>
</html>
