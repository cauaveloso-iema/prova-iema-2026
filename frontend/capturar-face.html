<!DOCTYPE html>
<html lang="pt-BR">
<head>
        <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sistema de Provas">

    <!-- 🔥 FAVICON LOCAL (NÃO DEPENDE DE INTERNET) -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capturar Face ID - Sistema de Provas</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.2/dist/face-api.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .camera-box {
            width: 100%;
            height: 400px;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
            z-index: 10;
        }
        
        .circle-guide {
            width: 220px;
            height: 220px;
            border: 4px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            margin: 0 auto;
            box-shadow: 0 0 0 500px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        
        .circle-guide.waiting {
            border-color: #f59e0b;
            animation: pulse 1.5s infinite;
        }
        
        .circle-guide.good {
            border-color: #10b981;
            border-width: 6px;
            animation: pulseGreen 1.5s infinite;
        }
        
        .circle-guide.error {
            border-color: #ef4444;
            border-width: 6px;
        }
        
        .instruction-box {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 40px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
            margin-top: 10px;
        }
        
        .timer-bar {
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }
        
        .timer-fill {
            height: 100%;
            background: #10b981;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .status-bar {
            padding: 15px;
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .attempt-badge {
            background: #4f46e5;
            color: white;
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
        }
        
        .preview-box {
            padding: 15px;
            background: #f8fafc;
            border-top: 2px solid #e5e7eb;
            display: none;
        }
        
        .preview-box.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        
        .preview-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #10b981;
            margin-bottom: 10px;
        }
        
        .preview-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .preview-title i {
            color: #f59e0b;
        }
        
        .preview-dicas {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9rem;
            color: #92400e;
        }
        
        .preview-dicas i {
            margin-right: 5px;
        }
        
        .preview-dicas ul {
            margin: 8px 0 0 20px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .btn-primary {
            background: #10b981;
            color: white;
        }
        
        .btn-primary:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        
        .btn-outline {
            background: white;
            border: 2px solid #e5e7eb;
            color: #4b5563;
        }
        
        .btn-outline:hover {
            background: #f3f4f6;
        }
        
        .btn-skip {
            background: #9ca3af;
            color: white;
            margin-top: 10px;
        }
        
        .btn-skip:hover {
            background: #6b7280;
        }
        
        .info-text {
            font-size: 0.8rem;
            color: #6b7280;
            text-align: center;
            padding: 15px;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(245, 158, 11, 0); }
        }
        
        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        /* Banner de lembrete */
        .reminder-banner {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: none;
        }

        .reminder-banner.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Cadastro de Face ID</h1>
            <p>Posicione seu rosto no círculo</p>
        </div>
        
        <!-- Banner de lembrete -->
        <div class="reminder-banner" id="reminderBanner">
            <i class="fas fa-bell"></i>
            <strong>Lembrete:</strong> Você precisará cadastrar sua Face ID para acessar as provas. 
            Não se esqueça de fazer isso antes da próxima prova!
        </div>
        
        <div class="camera-box">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlayCanvas"></canvas>
            <div class="overlay">
                <div class="circle-guide" id="circle"></div>
                <div class="instruction-box" id="instruction">
                    <span id="instructionText">Inicializando...</span>
                    <div class="timer-bar" id="timerBar">
                        <div class="timer-fill" id="timerFill"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <span class="attempt-badge" id="attemptCounter">Tentativa 1/3</span>
        </div>
        
        <!-- PREVIEW - SÓ APARECE QUANDO A FOTO NÃO FICA BOA -->
        <div class="preview-box" id="previewBox">
            <div class="preview-title">
                <i class="fas fa-exclamation-triangle"></i>
                <span>A foto não ficou boa</span>
            </div>
            <img class="preview-image" id="previewImg" src="" alt="Preview">
            <div class="preview-dicas" id="previewDicas"></div>
            <div class="btn-group">
                <button class="btn btn-outline" id="btnTentarNovamente">
                    <i class="fas fa-redo"></i> Tentar de novo
                </button>
                <button class="btn btn-primary" id="btnForcarEnvio">
                    <i class="fas fa-check"></i> Enviar mesmo assim
                </button>
            </div>
        </div>
        
        <!-- BOTÃO PULAR -->
        <div style="padding: 0 15px 15px;">
            <button class="btn btn-skip" id="btnSkip">
                <i class="fas fa-forward"></i> Fazer depois
            </button>
        </div>
        
        <div class="info-text">
            <i class="fas fa-shield-alt"></i>
            Sua imagem é usada apenas para validar seu acesso às provas
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO
        // ============================================
        const MAX_TENTATIVAS = 3;
        const TEMPO_ESTAVEL = 3000; // 3 segundos
        const TAMANHO_CIRCULO = 220;
        
        // Controle de estado
        let tentativas = 0;
        let stream = null;
        let videoEl = null;
        let ultimaFoto = null;
        let detectionInterval = null;
        let modelsLoaded = false;
        let contando = false;
        let enviando = false;
        let capturando = false;
        let faceJaCadastrada = false; // NOVA VARIÁVEL
        
        // Elementos DOM
        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const ctx = overlayCanvas.getContext('2d');
        const circle = document.getElementById('circle');
        const instructionText = document.getElementById('instructionText');
        const timerBar = document.getElementById('timerBar');
        const timerFill = document.getElementById('timerFill');
        const attemptCounter = document.getElementById('attemptCounter');
        const previewBox = document.getElementById('previewBox');
        const previewImg = document.getElementById('previewImg');
        const previewDicas = document.getElementById('previewDicas');
        const btnTentarNovamente = document.getElementById('btnTentarNovamente');
        const btnForcarEnvio = document.getElementById('btnForcarEnvio');
        const btnSkip = document.getElementById('btnSkip');
        const reminderBanner = document.getElementById('reminderBanner'); // NOVO ELEMENTO
        
        // ============================================
        // VERIFICAR AUTENTICAÇÃO
        // ============================================
        if (!localStorage.getItem('auth_token')) {
            window.location.href = '/login.html';
        }
        
        // ============================================
        // VERIFICAR SE FACE JÁ FOI CADASTRADA (NOVA FUNÇÃO)
        // ============================================
        async function verificarFaceCadastrada() {
            try {
                const token = localStorage.getItem('auth_token');
                const user = JSON.parse(localStorage.getItem('user_data') || '{}');
                
                if (!user.id) return false;
                
                const res = await fetch(`/api/auth/verificar-face/${user.id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await res.json();
                
                if (data.success && data.temFace) {
                    faceJaCadastrada = true;
                    instructionText.innerHTML = '✅ Face ID já cadastrado! Redirecionando...';
                    
                    setTimeout(() => {
                        window.location.href = '/aluno.html';
                    }, 2000);
                    
                    return true;
                }
                return false;
                
            } catch (error) {
                console.error('❌ Erro ao verificar face:', error);
                return false;
            }
        }
        
        // ============================================
        // ENVIAR NOTIFICAÇÃO DE LEMBRETE (NOVA FUNÇÃO)
        // ============================================
        async function enviarLembreteFace() {
            try {
                const token = localStorage.getItem('auth_token');
                const user = JSON.parse(localStorage.getItem('user_data') || '{}');
                
                if (!user.id) return;
                
                // Notificação push se permitido
                if ('Notification' in window && Notification.permission === 'granted') {
                    new Notification('📸 Lembrete: Cadastre sua Face ID', {
                        body: 'Não se esqueça de cadastrar sua Face ID para acessar as provas!',
                        icon: '/icons/favicon.ico',
                        requireInteraction: true
                    });
                }
                
                // Mostrar banner
                reminderBanner.classList.add('show');
                
                // Esconder após 10 segundos
                setTimeout(() => {
                    reminderBanner.classList.remove('show');
                }, 10000);
                
                console.log('📱 Lembrete de face ID enviado');
                
            } catch (error) {
                console.error('❌ Erro ao enviar lembrete:', error);
            }
        }
        
        // ============================================
        // CARREGAR MODELOS FACE-API
        // ============================================
        async function carregarModelos() {
            instructionText.innerHTML = '⏳ Carregando detector facial...';
            
            try {
                // Carregar apenas o TinyFaceDetector (mais rápido)
                await faceapi.nets.tinyFaceDetector.load('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
                console.log('✅ TinyFaceDetector carregado');
                
                // Carregar landmarks (opcional, mas ajuda na precisão)
                await faceapi.nets.faceLandmark68Net.load('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
                console.log('✅ FaceLandmark68 carregado');
                
                modelsLoaded = true;
                
                // Verificar se face já existe (NOVO)
                const jaCadastrada = await verificarFaceCadastrada();
                
                if (!jaCadastrada) {
                    instructionText.innerHTML = 'Posicione o rosto no círculo';
                    iniciarDeteccao();
                }
            } catch (error) {
                console.error('❌ Erro ao carregar modelos:', error);
                instructionText.innerHTML = '❌ Erro no detector. Recarregue a página.';
            }
        }
        
        // ============================================
        // INICIAR DETECÇÃO CONTÍNUA
        // ============================================
        function iniciarDeteccao() {
            if (!modelsLoaded) return;
            
            detectionInterval = setInterval(async () => {
                if (!videoEl || videoEl.videoWidth === 0 || previewBox.classList.contains('show') || enviando || faceJaCadastrada) return; // ADICIONADO faceJaCadastrada
                
                try {
                    const detections = await faceapi.detectAllFaces(
                        videoEl, 
                        new faceapi.TinyFaceDetectorOptions({
                            inputSize: 320,
                            scoreThreshold: 0.3
                        })
                    );
                    
                    ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                    
                    if (detections.length === 0) {
                        circle.className = 'circle-guide error';
                        instructionText.innerHTML = '<span class="status-dot" style="background:#ef4444;"></span> Nenhum rosto';
                        resetTimer();
                        return;
                    }
                    
                    if (detections.length > 1) {
                        circle.className = 'circle-guide error';
                        instructionText.innerHTML = '<span class="status-dot" style="background:#ef4444;"></span> Apenas uma pessoa';
                        resetTimer();
                        return;
                    }
                    
                    const face = detections[0];
                    
                    // Desenhar caixa ao redor do rosto
                    ctx.strokeStyle = '#10b981';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(face.box.x, face.box.y, face.box.width, face.box.height);
                    
                    // Calcular centro do rosto
                    const faceCenterX = face.box.x + face.box.width/2;
                    const faceCenterY = face.box.y + face.box.height/2;
                    const screenCenterX = overlayCanvas.width / 2;
                    const screenCenterY = overlayCanvas.height / 2;
                    
                    // Calcular desvio do centro (%)
                    const distX = Math.abs(faceCenterX - screenCenterX) / (overlayCanvas.width/2) * 100;
                    const distY = Math.abs(faceCenterY - screenCenterY) / (overlayCanvas.height/2) * 100;
                    const desvio = Math.max(distX, distY);
                    
                    // Calcular tamanho do rosto em relação ao círculo
                    const tamanhoRosto = Math.max(face.box.width, face.box.height);
                    const proporcao = (tamanhoRosto / TAMANHO_CIRCULO) * 100;
                    
                    // Verificar se está na posição ideal
                    const centralizado = desvio < 25;
                    const tamanhoOk = proporcao > 65 && proporcao < 90;
                    
                    if (centralizado && tamanhoOk) {
                        circle.className = 'circle-guide good';
                        instructionText.innerHTML = '<span class="status-dot" style="background:#10b981;"></span> Perfeito! Aguarde 3s...';
                        
                        if (!contando && !capturando && !enviando) {
                            iniciarContagem();
                        }
                    } else {
                        circle.className = 'circle-guide waiting';
                        
                        if (!centralizado && !tamanhoOk) {
                            instructionText.innerHTML = '<span class="status-dot" style="background:#f59e0b;"></span> Centralize e ajuste a distância';
                        } else if (!centralizado) {
                            instructionText.innerHTML = '<span class="status-dot" style="background:#f59e0b;"></span> Centralize o rosto';
                        } else {
                            instructionText.innerHTML = '<span class="status-dot" style="background:#f59e0b;"></span> Ajuste a distância';
                        }
                        
                        resetTimer();
                    }
                    
                } catch (error) {
                    console.error('Erro na detecção:', error);
                }
                
            }, 100);
        }
        
        // ============================================
        // INICIAR CONTAGEM REGRESSIVA
        // ============================================
        function iniciarContagem() {
            if (contando) return;
            
            contando = true;
            timerBar.style.display = 'block';
            const startTime = Date.now();
            
            const timer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progresso = (elapsed / TEMPO_ESTAVEL) * 100;
                timerFill.style.width = Math.min(progresso, 100) + '%';
                
                if (elapsed >= TEMPO_ESTAVEL) {
                    clearInterval(timer);
                    timerBar.style.display = 'none';
                    capturarFoto();
                    contando = false;
                }
            }, 50);
            
            window.contagemTimer = timer;
        }
        
        // ============================================
        // RESETAR CONTAGEM
        // ============================================
        function resetTimer() {
            if (window.contagemTimer) {
                clearInterval(window.contagemTimer);
            }
            contando = false;
            timerBar.style.display = 'none';
            timerFill.style.width = '0%';
        }
        
        // ============================================
        // VALIDAR IMAGEM LOCALMENTE (NO NAVEGADOR)
        // ============================================
        async function validarImagemLocalmente(imagemBase64) {
            try {
                instructionText.innerHTML = '🔍 Verificando qualidade...';
                
                // Criar imagem a partir do base64
                const img = new Image();
                img.src = imagemBase64;
                
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                });
                
                // Detectar rosto
                const detections = await faceapi.detectAllFaces(
                    img, 
                    new faceapi.TinyFaceDetectorOptions({
                        inputSize: 320,
                        scoreThreshold: 0.3
                    })
                );
                
                if (detections.length === 0) {
                    return { 
                        success: false, 
                        error: 'Nenhum rosto detectado' 
                    };
                }
                
                if (detections.length > 1) {
                    return { 
                        success: false, 
                        error: 'Múltiplos rostos detectados' 
                    };
                }
                
                // Verificar tamanho do rosto
                const face = detections[0];
                const faceArea = face.box.width * face.box.height;
                const imageArea = img.width * img.height;
                const proportion = (faceArea / imageArea) * 100;
                
                if (proportion < 15) {
                    return { 
                        success: false, 
                        error: 'Rosto muito distante' 
                    };
                }
                
                if (proportion > 50) {
                    return { 
                        success: false, 
                        error: 'Rosto muito próximo' 
                    };
                }
                
                // Verificar centralização
                const centerX = img.width / 2;
                const centerY = img.height / 2;
                const faceCenterX = face.box.x + face.box.width / 2;
                const faceCenterY = face.box.y + face.box.height / 2;
                
                const offsetX = Math.abs(faceCenterX - centerX) / (img.width / 2) * 100;
                const offsetY = Math.abs(faceCenterY - centerY) / (img.height / 2) * 100;
                
                if (offsetX > 30 || offsetY > 30) {
                    return { 
                        success: false, 
                        error: 'Centralize melhor o rosto' 
                    };
                }
                
                return { 
                    success: true, 
                    message: 'Imagem válida!',
                    face: face
                };
                
            } catch (error) {
                console.error('❌ Erro na validação:', error);
                return { 
                    success: false, 
                    error: 'Erro ao processar imagem' 
                };
            }
        }
        
        // ============================================
        // CAPTURAR FOTO (VERSÃO SUPER OTIMIZADA)
        // ============================================
        async function capturarFoto() {
            if (capturando || enviando || faceJaCadastrada) return;
            
            capturando = true;
            
            if (!videoEl) return;
            
            tentativas++;
            attemptCounter.textContent = `Tentativa ${tentativas}/${MAX_TENTATIVAS}`;
            
            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }
            resetTimer();
            
            // ===== CAPTURA 1: Imagem PEQUENA para validação =====
            const canvasValidacao = document.createElement('canvas');
            canvasValidacao.width = 160;  // REDUZIDO de 320 para 160
            canvasValidacao.height = 120; // REDUZIDO de 240 para 120
            const ctxValidacao = canvasValidacao.getContext('2d');
            ctxValidacao.translate(canvasValidacao.width, 0);
            ctxValidacao.scale(-1, 1);
            ctxValidacao.drawImage(videoEl, 0, 0, 160, 120);
            
            const imagemValidacao = canvasValidacao.toDataURL('image/jpeg', 0.6); // Qualidade 0.6
            
            instructionText.innerHTML = '🔍 Validando imagem...';
            
            // VALIDAR usando a imagem pequena
            const resultado = await validarImagemLocalmente(imagemValidacao);
            
            if (!resultado.success) {
                mostrarPreviewComDicas(imagemValidacao, resultado.error);
                instructionText.innerHTML = '❌ ' + resultado.error;
                capturando = false;
                
                if (modelsLoaded && !detectionInterval) {
                    iniciarDeteccao();
                }
                return;
            }
            
            instructionText.innerHTML = '✅ Capturando imagem para cadastro...';
            
            // ===== CAPTURA 2: Imagem para cadastro (TAMBÉM REDUZIDA) =====
            const canvasEnvio = document.createElement('canvas');
            canvasEnvio.width = 160;  // MESMO TAMANHO DA VALIDAÇÃO
            canvasEnvio.height = 120;
            const ctxEnvio = canvasEnvio.getContext('2d');
            ctxEnvio.translate(canvasEnvio.width, 0);
            ctxEnvio.scale(-1, 1);
            ctxEnvio.drawImage(videoEl, 0, 0, 160, 120);
            
            // Qualidade 0.6 (mais baixa)
            const imagemBase64 = canvasEnvio.toDataURL('image/jpeg', 0.6);
            ultimaFoto = imagemBase64;
            
            instructionText.innerHTML = '📤 Aguarde...';
            enviarParaServidor();
        }

        // ============================================
        // VALIDAR IMAGEM LOCALMENTE (AJUSTADA)
        // ============================================
        async function validarImagemLocalmente(imagemBase64) {
            try {
                // Criar imagem a partir do base64
                const img = new Image();
                img.src = imagemBase64;
                
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                });
                
                console.log(`📏 Imagem de validação: ${img.width}x${img.height}`);
                
                // Detectar rosto com parâmetros ajustados
                const detections = await faceapi.detectAllFaces(
                    img, 
                    new faceapi.TinyFaceDetectorOptions({
                        inputSize: 224,      // Reduzido para ficar mais rápido
                        scoreThreshold: 0.2   // Threshold mais baixo para detectar faces mesmo em baixa qualidade
                    })
                );
                
                console.log(`🔍 Detecções: ${detections.length}`);
                
                if (detections.length === 0) {
                    return { 
                        success: false, 
                        error: 'Nenhum rosto detectado' 
                    };
                }
                
                if (detections.length > 1) {
                    return { 
                        success: false, 
                        error: 'Múltiplos rostos detectados' 
                    };
                }
                
                const face = detections[0];
                
                // Calcular proporção do rosto em relação à imagem
                const faceArea = face.box.width * face.box.height;
                const imageArea = img.width * img.height;
                const proportion = (faceArea / imageArea) * 100;
                
                console.log(`📊 Proporção do rosto: ${proportion.toFixed(1)}%`);
                
                // Ajustar os limites para webcam de PC
                if (proportion < 10) {  // Reduzido de 15 para 10
                    return { 
                        success: false, 
                        error: 'Rosto muito distante. Aproxime-se.' 
                    };
                }
                
                if (proportion > 60) {  // Aumentado de 50 para 60
                    return { 
                        success: false, 
                        error: 'Rosto muito próximo. Afaste-se um pouco.' 
                    };
                }
                
                // Verificar centralização (mais tolerante)
                const centerX = img.width / 2;
                const centerY = img.height / 2;
                const faceCenterX = face.box.x + face.box.width / 2;
                const faceCenterY = face.box.y + face.box.height / 2;
                
                const offsetX = Math.abs(faceCenterX - centerX) / (img.width / 2) * 100;
                const offsetY = Math.abs(faceCenterY - centerY) / (img.height / 2) * 100;
                
                console.log(`📍 Centralização: X:${offsetX.toFixed(1)}%, Y:${offsetY.toFixed(1)}%`);
                
                if (offsetX > 40 || offsetY > 40) {  // Aumentado de 30 para 40
                    return { 
                        success: false, 
                        error: 'Centralize melhor o rosto' 
                    };
                }
                
                return { 
                    success: true, 
                    message: 'Imagem válida!',
                    proportion: proportion,
                    face: face
                };
                
            } catch (error) {
                console.error('❌ Erro na validação:', error);
                return { 
                    success: false, 
                    error: 'Erro ao processar imagem' 
                };
            }
        }

        // ============================================
        // FUNÇÃO DE TESTE PARA VER RESOLUÇÃO DA CÂMERA
        // ============================================
        function verificarResolucaoCamera() {
            if (videoEl) {
                console.log('📸 Resolução da câmera:');
                console.log(`   Largura: ${videoEl.videoWidth}px`);
                console.log(`   Altura: ${videoEl.videoHeight}px`);
                console.log(`   Proporção: ${(videoEl.videoWidth/videoEl.videoHeight).toFixed(2)}`);
                
                alert(`Resolução da câmera: ${videoEl.videoWidth}x${videoEl.videoHeight}`);
            }
        }

        // Adicione esta linha temporariamente no console do navegador para testar:
        verificarResolucaoCamera();
        
        // ============================================
        // MOSTRAR PREVIEW COM DICAS
        // ============================================
        function mostrarPreviewComDicas(imagemBase64, erro) {
            previewImg.src = imagemBase64;
            
            let dicas = '';
            if (erro.includes('rosto')) {
                dicas = `
                    <strong>❌ Nenhum rosto detectado!</strong>
                    <ul>
                        <li>Centralize seu rosto no círculo</li>
                        <li>Melhore a iluminação do ambiente</li>
                        <li>Remova óculos se estiver usando</li>
                        <li>Mantenha uma expressão neutra</li>
                    </ul>
                `;
            } else if (erro.includes('distante')) {
                dicas = `
                    <strong>📏 Rosto muito distante!</strong>
                    <ul>
                        <li>Aproxime-se da câmera</li>
                        <li>O rosto deve ocupar a maior parte do círculo</li>
                    </ul>
                `;
            } else if (erro.includes('próximo')) {
                dicas = `
                    <strong>📏 Rosto muito próximo!</strong>
                    <ul>
                        <li>Afaste-se um pouco da câmera</li>
                        <li>O rosto deve caber completamente no círculo</li>
                    </ul>
                `;
            } else if (erro.includes('Centralize')) {
                dicas = `
                    <strong>🎯 Rosto descentralizado!</strong>
                    <ul>
                        <li>Centralize seu rosto no círculo</li>
                        <li>Mantenha o rosto no centro da tela</li>
                    </ul>
                `;
            } else if (erro.includes('Múltiplos')) {
                dicas = `
                    <strong>👥 Múltiplas pessoas detectadas!</strong>
                    <ul>
                        <li>Apenas uma pessoa por vez</li>
                        <li>Certifique-se de que só você está no quadro</li>
                    </ul>
                `;
            } else {
                dicas = `
                    <strong>⚠️ A imagem não ficou boa</strong>
                    <ul>
                        <li>Tente novamente com melhor posicionamento</li>
                        <li>Certifique-se que seu rosto está visível</li>
                        <li>Evite movimento no momento da captura</li>
                    </ul>
                `;
            }
            
            previewDicas.innerHTML = dicas;
            previewBox.classList.add('show');
        }

        // ============================================
        // ENVIAR PARA O SERVIDOR (COM TIMEOUT)
        // ============================================
        async function enviarParaServidor() {
            if (enviando) return;
            if (!ultimaFoto) return;
            
            enviando = true;
            
            instructionText.innerHTML = '⏳ Aguarde...';
            timerBar.style.display = 'block';
            timerFill.style.width = '30%';
            
            try {
                const token = localStorage.getItem('auth_token');
                const user = JSON.parse(localStorage.getItem('user_data') || '{}');
                
                timerFill.style.width = '60%';
                
                console.log('📤 Enviando imagem para cadastro...');
                
                // Criar promise com timeout de 30 segundos
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                const res = await fetch('/api/auth/cadastrar-face', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuarioId: user.id,
                        imagem: ultimaFoto.split(',')[1]
                    }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                timerFill.style.width = '90%';
                
                const data = await res.json();
                console.log('📦 Resposta do servidor:', data);
                
                if (data.success) {
                    instructionText.innerHTML = '✅ Face cadastrada com sucesso!';
                    timerFill.style.width = '100%';
                    localStorage.setItem('face_cadastrado', 'true');
                    
                    setTimeout(() => {
                        window.location.href = '/aluno.html';
                    }, 1500);
                    
                } else {
                    throw new Error(data.error || 'Erro no cadastro');
                }
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    instructionText.innerHTML = '❌ Tempo esgotado. Tente novamente.';
                } else {
                    instructionText.innerHTML = '❌ Erro: ' + error.message;
                }
                
                console.error('❌ Erro no envio:', error);
                timerBar.style.display = 'none';
                enviando = false;
                capturando = false;
                
                mostrarPreviewComDicas(ultimaFoto, error.message);
            }
        }
        
        // ============================================
        // REINICIAR APÓS PREVIEW
        // ============================================
        function reiniciarAposPreview() {
            previewBox.classList.remove('show');
            capturando = false;
            enviando = false;
            
            if (modelsLoaded && !detectionInterval && !faceJaCadastrada) { // ADICIONADO faceJaCadastrada
                iniciarDeteccao();
            }
            
            instructionText.innerHTML = 'Posicione o rosto no círculo';
        }
        
        // ============================================
        // INICIAR CÂMERA
        // ============================================
        async function iniciarCamera() {
            try {
                instructionText.innerHTML = '📷 Solicitando permissão de câmera...';
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });
                
                videoEl = video;
                videoEl.srcObject = stream;
                
                videoEl.onloadedmetadata = () => {
                    videoEl.play();
                    overlayCanvas.width = videoEl.videoWidth;
                    overlayCanvas.height = videoEl.videoHeight;
                    carregarModelos();
                };
                
            } catch (error) {
                console.error('❌ Erro na câmera:', error);
                instructionText.innerHTML = '❌ Erro ao acessar câmera';
            }
        }
        
        // ============================================
        // EVENTOS
        // ============================================
        btnTentarNovamente.addEventListener('click', reiniciarAposPreview);
        
        btnForcarEnvio.addEventListener('click', () => {
            if (ultimaFoto) {
                previewBox.classList.remove('show');
                enviarParaServidor();
            }
        });
        
        btnSkip.addEventListener('click', async function(e) {
            e.preventDefault();
            
            if (confirm('Deseja pular o cadastro facial? Você poderá fazer depois.')) {
                
                // Mostrar loading no botão
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
                this.disabled = true;
                
                try {
                    const token = localStorage.getItem('auth_token');
                    const user = JSON.parse(localStorage.getItem('user_data') || '{}');
                    
                    if (token && user.id) {
                        // Enviar notificação no sistema
                        await fetch('/api/notificacoes', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                usuarioId: user.id,
                                tipo: 'sistema',
                                titulo: '📸 Cadastro de Face ID Pendente',
                                mensagem: 'Você ainda não cadastrou sua Face ID. Clique aqui para cadastrar agora.',
                                icone: '📸',
                                cor: '#f97316',
                                link: '/capturar-face.html',
                                prioridade: 4
                            })
                        });
                        
                        // Enviar push notification
                        await fetch('/api/usuario/enviar-push', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                usuarioId: user.id,
                                titulo: '📸 Cadastre sua Face ID',
                                mensagem: 'Não se esqueça de cadastrar sua Face ID para acessar as provas!',
                                dados: {
                                    tipo: 'lembrete_face',
                                    url: '/capturar-face.html'
                                }
                            })
                        });
                        
                        // Limpar flag de banner fechado para aparecer novamente
                        localStorage.removeItem('banner_face_fechado');
                    }
                } catch (error) {
                    console.error('❌ Erro ao enviar lembretes:', error);
                }
                
                // Redirecionar para o painel do aluno
                window.location.href = '/aluno.html';
            }
        });
        
        // ============================================
        // LIMPEZA AO SAIR
        // ============================================
        window.addEventListener('beforeunload', () => {
            if (detectionInterval) clearInterval(detectionInterval);
            if (window.contagemTimer) clearInterval(window.contagemTimer);
            if (stream) stream.getTracks().forEach(t => t.stop());
        });
        
        // ============================================
        // SOLICITAR PERMISSÃO DE NOTIFICAÇÃO (NOVO)
        // ============================================
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
        
        // ============================================
        // INICIAR TUDO
        // ============================================
        iniciarCamera();
    </script>

        <script>
// ============================================
// SISTEMA DE ESCALONAMENTO PROPORCIONAL - APENAS MOBILE
// ============================================

(function() {
    // Só ativar em telas menores que 768px
    if (window.innerWidth > 768) {
        console.log('📐 Desktop detectado - escalonamento desativado');
        return;
    }
    
    console.log('📐 Inicializando sistema de escalonamento proporcional (mobile)...');
    
    // Função para calcular a escala baseada na largura (apenas mobile)
    function calcularEscalaMobile() {
        const width = window.innerWidth;
        
        // Largura de referência para mobile (768px)
        const baseWidth = 768;
        
        // Calcular escala (nunca menor que 0.5 e nunca maior que 1)
        let escala = Math.max(0.5, Math.min(1, width / baseWidth));
        
        // Ajustes específicos para faixas de tamanho
        if (width <= 320) escala = 0.55;
        else if (width <= 360) escala = 0.6;
        else if (width <= 400) escala = 0.65;
        else if (width <= 500) escala = 0.75;
        else if (width <= 600) escala = 0.85;
        else if (width <= 700) escala = 0.95;
        else escala = 1;
        
        return escala;
    }
    
    // Função para aplicar a escala
    function aplicarEscalaMobile() {
        // Só aplicar se ainda estiver em mobile
        if (window.innerWidth > 768) return;
        
        const escala = calcularEscalaMobile();
        
        // Atualizar variável CSS
        document.documentElement.style.setProperty('--scale-ratio', escala);
        document.documentElement.style.setProperty('--current-width', window.innerWidth);
        
        console.log(`📐 Mobile: escala ${escala.toFixed(2)} | largura: ${window.innerWidth}px`);
    }
    
    // Aplicar inicial
    aplicarEscalaMobile();
    
    // Aplicar ao redimensionar (com debounce)
    let timeout;
    window.addEventListener('resize', function() {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
            // Verificar se ainda está em mobile
            if (window.innerWidth <= 768) {
                aplicarEscalaMobile();
            } else {
                // Se passou para desktop, resetar escala
                document.documentElement.style.setProperty('--scale-ratio', '1');
                console.log('📐 Modo desktop - escala resetada');
            }
        }, 100);
    });
    
    // Também aplicar quando orientação mudar
    window.addEventListener('orientationchange', function() {
        setTimeout(() => {
            if (window.innerWidth <= 768) {
                aplicarEscalaMobile();
            }
        }, 200);
    });
    
    console.log('✅ Sistema de escalonamento mobile ativo!');
    
})();
</script>
