<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Aluno - Sistema de Provas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .aluno-header {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .aluno-info {
            flex: 1;
        }
        
        .aluno-info h1 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }
        
        .aluno-details {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .btn-entrar-turma {
            background: white;
            color: #10b981;
            border: 2px solid #10b981;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .btn-entrar-turma:hover {
            background: #10b981;
            color: white;
            transform: translateY(-2px);
        }
        
        .prova-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            border-left: 4px solid;
            transition: transform 0.3s;
        }
        
        .prova-card:hover {
            transform: translateY(-3px);
        }
        
        .prova-card.pendente {
            border-left-color: #f59e0b;
        }
        
        .prova-card.concluida {
            border-left-color: #6b7280;
        }
        
        .prova-card.ativa {
            border-left-color: #10b981;
        }
        
        .prova-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .prova-titulo {
            font-weight: 600;
            font-size: 1.1rem;
            margin: 0;
        }
        
        .prova-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .status-pendente {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status-concluida {
            background: #f3f4f6;
            color: #374151;
        }
        
        .status-ativa {
            background: #d1fae5;
            color: #065f46;
        }
        
        .prova-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #6b7280;
        }
        
        .prova-info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .prova-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-iniciar-prova {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }
        
        .btn-iniciar-prova:hover {
            background: #059669;
        }
        
        .btn-ver-resultado {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }
        
        .btn-ver-resultado:hover {
            background: #3730a3;
        }
        
        .btn-sair-prova {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }
        
        .btn-sair-prova:hover {
            background: #dc2626;
        }
        
        .turma-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 3px solid #4f46e5;
        }
        
        .turma-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .turma-codigo {
            background: #f3f4f6;
            padding: 5px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 600;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
        }
        
        .btn-logout {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        
        .loading i {
            font-size: 2rem;
            color: #4f46e5;
        }
    </style>
</head>
<!-- Incluir Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Incluir o chatbot -->
<script src="js/chatbot-frontend.js"></script>

<!-- Opcional: Ação específica para alunos -->
<script>
// Exemplo: Mostrar mensagem especial quando o aluno carregar a página
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(() => {
        if (window.chatbot) {
            window.chatbot.sendSystemMessage("💡 Dica: Você pode usar o assistente para tirar dúvidas sobre suas provas!");
        }
    }, 3000);
});
</script>
<body>
    <!-- Botão de Logout -->
    <button class="btn-logout" id="btnLogout">
        <i class="fas fa-sign-out-alt"></i> Sair
    </button>
    
    <div class="container">
        <!-- Header do Aluno -->
        <div class="aluno-header">
            <div class="aluno-info">
                <h1><i class="fas fa-user-graduate"></i> Painel do Aluno</h1>
                <div class="aluno-details" id="alunoDetails">
                    <p>Carregando informações...</p>
                </div>
            </div>
            <button class="btn-entrar-turma" id="btnEntrarTurma">
                <i class="fas fa-plus-circle"></i> Entrar em Turma
            </button>
        </div>
        
        <!-- Provas Pendentes -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-clock"></i> Provas Pendentes</h2>
            </div>
            <div class="card-body">
                <div id="provasPendentes">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Carregando provas pendentes...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Provas Concluídas -->
        <div class="card" style="margin-top: 30px;">
            <div class="card-header">
                <h2><i class="fas fa-check-circle"></i> Provas Concluídas</h2>
            </div>
            <div class="card-body">
                <div id="provasConcluidas">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Carregando provas concluídas...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Turmas -->
        <div class="card" style="margin-top: 30px; margin-bottom: 50px;">
            <div class="card-header">
                <h2><i class="fas fa-school"></i> Minhas Turmas</h2>
            </div>
            <div class="card-body">
                <div id="turmasAluno">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Carregando suas turmas...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Entrar na Turma -->
    <div class="modal" id="modalEntrarTurma">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-sign-in-alt"></i> Entrar em uma Turma</h3>
                <button class="modal-close" onclick="fecharModal('modalEntrarTurma')">&times;</button>
            </div>
            <div class="form-group">
                <label for="codigoTurma">Código da Turma</label>
                <input type="text" id="codigoTurma" class="form-control" placeholder="Ex: ABC123" style="text-transform: uppercase;">
                <small style="color: #6b7280; display: block; margin-top: 5px;">Pergunte ao professor pelo código da turma</small>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-iniciar-prova" style="flex: 1;" onclick="entrarNaTurma()">
                    <i class="fas fa-check"></i> Entrar
                </button>
                <button class="btn-sair-prova" style="flex: 1;" onclick="fecharModal('modalEntrarTurma')">
                    <i class="fas fa-times"></i> Cancelar
                </button>
            </div>
        </div>
    </div>
    
    <!-- Modal Iniciar Prova -->
    <div class="modal" id="modalIniciarProva">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-play-circle"></i> Iniciar Prova</h3>
                <button class="modal-close" onclick="fecharModal('modalIniciarProva')">&times;</button>
            </div>
            <div id="modalProvaInfo">
                <!-- Informações da prova serão inseridas aqui -->
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-iniciar-prova" style="flex: 1;" onclick="iniciarProvaSelecionada()">
                    <i class="fas fa-play"></i> Iniciar Prova
                </button>
                <button class="btn-sair-prova" style="flex: 1;" onclick="fecharModal('modalIniciarProva')">
                    <i class="fas fa-times"></i> Cancelar
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Configuração da API
        // ============ DETECTAR AMBIENTE DINAMICAMENTE ============
        const IS_LOCALHOST = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1';
        const IS_RENDER = window.location.hostname.includes('render.com') || 
                        window.location.hostname.includes('sistema-avaliativo');

        // URL base da API - AUTO-DETECTADA
        let API_BASE_URL;

        if (IS_LOCALHOST) {
            // Desenvolvimento local
            API_BASE_URL = 'http://localhost:3000/api';
            console.log('🔧 Modo: DESENVOLVIMENTO LOCAL');
        } else if (IS_RENDER) {
            // Produção no Render
            API_BASE_URL = window.location.origin + '/api';
            console.log('🚀 Modo: PRODUÇÃO (Render)');
        } else {
            // Fallback
            API_BASE_URL = '/api';
            console.log('⚙️ Modo: FALLBACK');
        }

        // Para debugging
        console.log('📡 Host:', window.location.hostname);
        console.log('🌐 API URL:', API_BASE_URL);

        // Exportar para uso global
        window.API_BASE_URL = API_BASE_URL;
        
        // Variáveis globais
        let usuario = null;
        let provasPendentes = [];
        let provasConcluidas = [];
        let turmas = [];
        let provaSelecionada = null;
        
        // Funções do modal
        function mostrarModal(id) {
            document.getElementById(id).style.display = 'flex';
        }
        
        function fecharModal(id) {
            document.getElementById(id).style.display = 'none';
        }
        
        // Carregar dados do aluno
        async function carregarDadosAluno() {
            try {
                const token = localStorage.getItem('auth_token');
                if (!token) {
                    window.location.href = 'login.html';
                    return;
                }
                
                // Buscar dados atualizados do usuário
                const userResponse = await fetch(`${API_BASE_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (userResponse.status === 401) {
                    localStorage.clear();
                    window.location.href = 'login.html';
                    return;
                }
                
                const userData = await userResponse.json();
                
                if (userData.success) {
                    usuario = userData.user;
                    localStorage.setItem('user_data', JSON.stringify(usuario));
                    
                    if (usuario.role !== 'aluno') {
                        alert('Apenas alunos podem acessar esta página');
                        window.location.href = usuario.role === 'professor' ? 'index.html' : 'login.html';
                        return;
                    }
                    
                    // Atualizar informações do aluno
                    document.getElementById('alunoDetails').innerHTML = `
                        <p><strong>${usuario.nome}</strong></p>
                        <p>${usuario.curso ? usuario.curso + ' | ' : ''}${usuario.matricula || 'Sem matrícula'}</p>
                        <p>${usuario.email}</p>
                    `;
                    
                    // Carregar provas pendentes e turmas
                    await carregarProvasPendentes();
                    await carregarTurmasAluno();
                    
                } else {
                    throw new Error(userData.error || 'Erro ao carregar dados do usuário');
                }
                
            } catch (error) {
                console.error('Erro ao carregar dados do aluno:', error);
                mostrarErro('Erro ao carregar dados. Verifique sua conexão.');
            }
        }
        
        // Carregar provas pendentes do aluno - ROTA NOVA
        async function carregarProvasPendentes() {
            try {
                const token = localStorage.getItem('auth_token');
                const response = await fetch(`${API_BASE_URL}/aluno/provas/pendentes`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    provasPendentes = data.provas || [];
                    
                    // Atualizar interface
                    atualizarListaProvas('provasPendentes', provasPendentes, 'pendente');
                    
                    // Carregar provas concluídas também
                    await carregarProvasConcluidas();
                } else {
                    throw new Error(data.error || 'Erro ao carregar provas pendentes');
                }
            } catch (error) {
                console.error('Erro ao carregar provas pendentes:', error);
                document.getElementById('provasPendentes').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Erro ao carregar provas</h3>
                        <p>${error.message || 'Tente recarregar a página'}</p>
                    </div>
                `;
            }
        }
        
        // Carregar provas concluídas - VERSÃO QUE GARANTE DADOS DO LOG

        async function carregarProvasConcluidas() {
            try {
                const token = localStorage.getItem('auth_token');
                const response = await fetch(`${API_BASE_URL}/aluno/provas`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                console.log('📊 Dados completos recebidos:', data);
                
                if (data.success) {
                    // Separar provas por status - CORREÇÃO: Lógica simplificada
                    const provasConcluidasNormais = [];
                    const provasAguardandoCorrecao = [];
                    const provasCanceladas = [];
                    
                    (data.provas || []).forEach(prova => {
                        console.log(`Prova ${prova.titulo}:`, {
                            id: prova._id,
                            status: prova.status,
                            dataRealizacao: prova.dataRealizacao,
                            notaLiberada: prova.notaLiberada,
                            nota: prova.nota,
                            finalizada: prova.finalizada
                        });
                        
                        // Se a prova foi cancelada
                        if (prova.cancelada || prova.status === 'cancelada') {
                            provasCanceladas.push(prova);
                        } 
                        // Se a prova foi realizada (tem dataRealizacao) E tem nota liberada
                        else if (prova.dataRealizacao && prova.notaLiberada && prova.nota !== null) {
                            provasConcluidasNormais.push(prova);
                        }
                        // Se a prova foi realizada mas NÃO tem nota liberada ainda
                        else if (prova.dataRealizacao && (!prova.notaLiberada || prova.nota === null)) {
                            provasAguardandoCorrecao.push(prova);
                        }
                        // Se NÃO tem dataRealizacao, NÃO FOI REALIZADA - não mostrar
                    });
                    
                    console.log('📊 Separação das provas:', {
                        concluidasNormais: provasConcluidasNormais.length,
                        aguardandoCorrecao: provasAguardandoCorrecao.length,
                        canceladas: provasCanceladas.length
                    });
                    
                    // Renderizar provas concluídas normais (com nota liberada)
                    if (provasConcluidasNormais.length > 0) {
                        atualizarListaProvas('provasConcluidas', provasConcluidasNormais, 'concluida');
                    } else {
                        document.getElementById('provasConcluidas').innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-file"></i>
                                <h3>Nenhuma prova concluída</h3>
                                <p>Você ainda não concluiu nenhuma prova</p>
                            </div>
                        `;
                    }
                    
                    // Adicionar seção de provas aguardando correção (se houver)
                    if (provasAguardandoCorrecao.length > 0) {
                        const container = document.getElementById('provasConcluidas');
                        
                        // Se já há conteúdo, adicionar seção separada
                        if (provasConcluidasNormais.length > 0) {
                            container.insertAdjacentHTML('beforeend', `
                                <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #e5e7eb;">
                                    <h3 style="color: #f59e0b; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                                        <i class="fas fa-hourglass-half"></i>
                                        Aguardando Correção
                                        <span style="background: #fef3c7; color: #f59e0b; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem;">
                                            ${provasAguardandoCorrecao.length}
                                        </span>
                                    </h3>
                                    <p style="color: #6b7280; margin-bottom: 15px; font-size: 0.9rem;">
                                        Sua prova já foi enviada e aguarda correção.
                                    </p>
                                    <div id="provasAguardandoContainer"></div>
                                </div>
                            `);
                            
                            // Renderizar provas aguardando correção
                            const aguardandoContainer = document.getElementById('provasAguardandoContainer');
                            aguardandoContainer.innerHTML = provasAguardandoCorrecao.map(prova => {
                                const dataRealizacao = prova.dataRealizacao ? 
                                    new Date(prova.dataRealizacao).toLocaleDateString('pt-BR') + ' ' + 
                                    new Date(prova.dataRealizacao).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) : 
                                    'Data não informada';
                                
                                // Verificar se já passou tempo suficiente para correção
                                const agora = new Date();
                                const dataProva = prova.dataRealizacao ? new Date(prova.dataRealizacao) : agora;
                                const horasPassadas = (agora - dataProva) / (1000 * 60 * 60);
                                
                                let mensagemStatus = 'Aguardando correção do professor';
                                if (horasPassadas > 24) {
                                    mensagemStatus = 'Aguardando correção - Já faz mais de 24 horas';
                                } else if (horasPassadas > 12) {
                                    mensagemStatus = 'Aguardando correção - Já faz mais de 12 horas';
                                }
                                
                                return `
                                    <div class="prova-card" style="border-left-color: #f59e0b; background: #fef3c7; margin-bottom: 10px;">
                                        <div class="prova-header">
                                            <h4 class="prova-titulo">${prova.titulo || 'Prova'}</h4>
                                            <span class="prova-status" style="background: #fef3c7; color: #f59e0b; border-color: #f59e0b;">
                                                <i class="fas fa-hourglass-half"></i> AGUARDANDO CORREÇÃO
                                            </span>
                                        </div>
                                        <div class="prova-info">
                                            <div class="prova-info-item">
                                                <i class="fas fa-book"></i>
                                                <span>${prova.conteudo || 'Conteúdo não especificado'}</span>
                                            </div>
                                            <div class="prova-info-item">
                                                <i class="fas fa-graduation-cap"></i>
                                                <span>${prova.turma?.nome || prova.turma?.disciplina || 'Turma não especificada'}</span>
                                            </div>
                                            <div class="prova-info-item">
                                                <i class="far fa-calendar-alt"></i>
                                                <span>Realizada em: ${dataRealizacao}</span>
                                            </div>
                                        </div>
                                        <div class="prova-actions">
                                            <button class="btn-iniciar-prova" style="background: #f59e0b; color: #92400e;" disabled>
                                                <i class="fas fa-hourglass-half"></i> ${mensagemStatus}
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('');
                        } else {
                            // Se não há provas concluídas, mostrar apenas as aguardando correção
                            container.innerHTML = `
                                <div>
                                    <h3 style="color: #f59e0b; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                                        <i class="fas fa-hourglass-half"></i>
                                        Aguardando Correção
                                        <span style="background: #fef3c7; color: #f59e0b; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem;">
                                            ${provasAguardandoCorrecao.length}
                                        </span>
                                    </h3>
                                    <p style="color: #6b7280; margin-bottom: 20px; font-size: 0.9rem;">
                                        Suas provas já foram enviadas e aguardam correção.
                                    </p>
                                    ${provasAguardandoCorrecao.map(prova => {
                                        const dataRealizacao = prova.dataRealizacao ? 
                                            new Date(prova.dataRealizacao).toLocaleDateString('pt-BR') + ' ' + 
                                            new Date(prova.dataRealizacao).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) : 
                                            'Data não informada';
                                        
                                        return `
                                            <div class="prova-card" style="border-left-color: #f59e0b; background: #fef3c7; margin-bottom: 15px;">
                                                <div class="prova-header">
                                                    <h4 class="prova-titulo">${prova.titulo || 'Prova'}</h4>

        // Adicione esta função no aluno.html (logo após as variáveis globais)
        function detectarTipoCancelamento(prova) {
            console.log('🔍 Analisando tipo de cancelamento:', prova);
            
            const motivo = prova.motivoCancelamento || '';
            const motivoLower = motivo.toLowerCase();
            
            // Verificar se tem estatísticas de violação
            const temEstatisticasViolacao = prova.estatisticasCancelamento && 
                                        (prova.estatisticasCancelamento.avisos > 0 || 
                                            prova.estatisticasCancelamento.tentativasAtalho > 0 ||
                                            prova.estatisticasCancelamento.capturasTela > 0);
            
            // Palavras-chave para violação (incluindo variações)
            const palavrasViolacao = [
                'violação', 'violacao', 'violou', 'viola', 'regras', 
                'multiplas', 'múltiplas', 'monitoramento', 'avançar',
                'trapaça', 'trapaca', 'fraude', 'irregular', 'conjunto de regras'
            ];
            
            let isViolacao = false;
            
            // 1. Primeiro verificar pela flag explícita
            if (prova.flagViolacao === true) {
                isViolacao = true;
                console.log('✅ Detectado por flagViolacao: true');
            }
            // 2. Verificar por palavras no motivo
            else if (palavrasViolacao.some(palavra => motivoLower.includes(palavra))) {
                isViolacao = true;
                console.log(`✅ Detectado por palavra no motivo: "${motivo}"`);
            }
            // 3. Verificar por estatísticas
            else if (temEstatisticasViolacao) {
                isViolacao = true;
                console.log('✅ Detectado por estatísticas de violação');
            }
            // 4. Verificar por tipo de cancelamento
            else if (prova.tipoCancelamento === 'violacao' || prova.status === 'violacao') {
                isViolacao = true;
                console.log('✅ Detectado por tipoCancelamento');
            }
            // 5. Se tiver estatísticas com avisos, é violação
            else if (prova.estatisticasCancelamento && prova.estatisticasCancelamento.avisos > 0) {
                isViolacao = true;
                console.log('✅ Detectado por avisos > 0');
            }
            // 6. Se não for nenhum dos anteriores, é prazo
            else {
                isViolacao = false;
                console.log('📅 Detectado como prazo expirado');
            }
            
            console.log(`🎯 Resultado: ${isViolacao ? 'VIOLAÇÃO' : 'PRAZO EXPIRADO'}`);
            return isViolacao;
        }

        // Função para gerar card de prova - VERSÃO COM DADOS DO LOG
        function gerarCardProva(prova, isCancelada) {
            const dataLimite = prova.dataLimite ? 
                new Date(prova.dataLimite).toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'

            // USAR A NOVA FUNÇÃO DE DETECÇÃO
            let isViolacao = false;
            let motivoExibicao = prova.motivoCancelamento || 'Prova cancelada';
            
            if (isCancelada) {
                isViolacao = detectarTipoCancelamento(prova);
                
                // Ajustar o motivo de exibição baseado no tipo
                if (isViolacao) {
                    motivoExibicao = prova.motivoCancelamento || 'Prova cancelada por violação das regras';
                } else {
                    motivoExibicao = prova.motivoCancelamento || 'Prazo de entrega expirado';
                }

            // Configurar aparência baseada no tipo

            if (isCancelada) {
                if (isViolacao) {
                    statusText = 'CANCELADA - VIOLAÇÃO';
                    statusColor = '#dc2626';
                    borderColor = '#dc2626';
                    backgroundColor = '#fef2f2';

                        <i class="fas fa-hourglass-half"></i> Sem nota disponível
                    </button>
                `;
            }
            
            // Informações da prova
            const infoItems = [
                { icon: 'book', text: prova.conteudo || 'Conteúdo não especificado' },
                { icon: 'graduation-cap', text: prova.turma?.nome || prova.turma?.disciplina || 'Turma não especificada' },

            return `

                style="border-left-color: ${borderColor}; ${backgroundColor ? 'background: ' + backgroundColor + ';' : ''}">

        // Função para atualizar o card da prova com informações do cancelamento
        function atualizarCardProvaCancelada(provaId, dadosCancelamento) {
            const card = document.querySelector(`[data-prova-id="${provaId}"]`);
            
            if (!card) return;
            
            const tipo = dadosCancelamento.tipoCancelamento;
            const config = {
                'violacao': {
                    cor: '#dc2626',
                    corFundo: '#fee2e2',
                    icone: 'user-slash',
                    texto: 'CANCELADA - VIOLAÇÃO'
                },
                'prazo': {
                    cor: '#f59e0b',
                    corFundo: '#fef3c7',
                    icone: 'clock',
                    texto: 'CANCELADA - PRAZO'
                }
            }[tipo] || { cor: '#ef4444', corFundo: '#fef2f2', icone: 'ban', texto: 'CANCELADA' };
            
            // Atualizar o card
            const statusDiv = card.querySelector('.prova-status');
            if (statusDiv) {
                statusDiv.innerHTML = `
                    <i class="fas fa-${config.icone}"></i> ${config.texto}
                `;
                statusDiv.style.background = config.corFundo;
                statusDiv.style.color = config.cor;
                statusDiv.style.borderColor = config.cor;
            }
        }
        // Nova função para carregar provas aguardando correção
        async function carregarProvasAguardandoCorrecao() {
            try {
                const token = localStorage.getItem('auth_token');
                const response = await fetch(`${API_BASE_URL}/aluno/provas`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Filtrar provas concluídas mas sem nota liberada
                    const provasAguardando = (data.provas || []).filter(prova => {
                        return prova.status === 'concluida' && 
                            (prova.nota === null || prova.nota === undefined) &&
                            prova.statusCorrecao !== 'corrigida';
                    });
                    
                    if (provasAguardando.length > 0) {
                        const container = document.getElementById('provasConcluidas');
                        if (container) {
                            // Adicionar seção de provas aguardando correção
                            container.insertAdjacentHTML('beforeend', `
                                <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #e5e7eb;">
                                    <h3 style="color: #6b7280; margin-bottom: 15px;">
                                        <i class="fas fa-clock"></i> Aguardando Correção
                                    </h3>
                                    ${provasAguardando.map(prova => `
                                        <div class="prova-card concluida" style="opacity: 0.7;">
                                            <div class="prova-header">
                                                <h4 class="prova-titulo">${prova.titulo || 'Prova sem título'}</h4>
                                                <span class="prova-status status-pendente">
                                                    AGUARDANDO
                                                </span>
                                            </div>
                                            <div class="prova-info">
                                                <div class="prova-info-item">
                                                    <i class="fas fa-book"></i>
                                                    <span>${prova.conteudo || 'Conteúdo não especificado'}</span>
                                                </div>
                                                <div class="prova-info-item">
                                                    <i class="fas fa-graduation-cap"></i>
                                                    <span>${prova.turma?.nome || prova.turma?.disciplina || 'Turma não especificada'}</span>
                                                </div>
                                                <div class="prova-info-item">
                                                    <i class="fas fa-question-circle"></i>
                                                    <span>${prova.quantidadeQuestoes || '?'} questões</span>
                                                </div>
                                            </div>
                                            <div class="prova-actions">
                                                <button class="btn-iniciar-prova" style="background: #6b7280;" disabled>
                                                    <i class="fas fa-hourglass-half"></i> Aguardando Correção
                                                </button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            `);
                        }
                    }
                }
            } catch (error) {
                console.error('Erro ao carregar provas aguardando correção:', error);
            }
        }
        
        // Atualizar lista de provas na interface - VERSÃO CORRIGIDA COM STATUS CANCELADA
        function atualizarListaProvas(elementId, provas, tipo) {
            const container = document.getElementById(elementId);
            
            if (!provas || provas.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-${tipo === 'pendente' ? 'check-circle' : 'file'}"></i>
                        <h3>${tipo === 'pendente' ? 'Nenhuma prova pendente' : 'Nenhuma prova concluída'}</h3>
                        <p>${tipo === 'pendente' ? 'Todas as provas foram concluídas' : 'Você ainda não realizou nenhuma prova'}</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = provas.map(prova => {
                const dataLimite = prova.dataLimite ? 
                    new Date(prova.dataLimite).toLocaleDateString('pt-BR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    }) : 'Sem data limite';
                
                // Calcular tempo restante
                let tempoInfo = '';
                if (prova.dataLimite) {
                    const dataLimiteObj = new Date(prova.dataLimite);
                    const hoje = new Date();
                    
                    const hojeSemHora = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
                    const dataLimiteSemHora = new Date(dataLimiteObj.getFullYear(), dataLimiteObj.getMonth(), dataLimiteObj.getDate());
                    
                    const diffMs = dataLimiteSemHora - hojeSemHora;
                    const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    
                    if (diffDias === 0) {
                        tempoInfo = `⏰ <span style="color: #dc2626; font-weight: bold;">HOJE</span>`;
                    } else if (diffDias === 1) {
                        tempoInfo = `⏰ <span style="color: #f59e0b;">Amanhã</span>`;
                    } else if (diffDias > 1 && diffDias <= 7) {
                        tempoInfo = `⏰ <span style="color: #f59e0b;">Faltam ${diffDias} dias</span>`;
                    } else if (diffDias > 7) {
                        tempoInfo = `⏰ <span style="color: #10b981;">Faltam ${diffDias} dias</span>`;
                    }
                }
                
                // CALCULAR STATUS DE HORÁRIO
                let horarioStatus = '';
                let horarioColor = '#6b7280';
                let horarioIcon = 'clock';
                let horarioText = '';
                
                if (prova.horarioInicio && prova.horarioTermino) {
                    const agora = new Date();
                    const hoje = agora.toISOString().split('T')[0];
                    const inicioProva = new Date(`${hoje}T${prova.horarioInicio}:00`);
                    const terminoProva = new Date(`${hoje}T${prova.horarioTermino}:00`);
                    
                    if (agora < inicioProva) {
                        const minutosRestantes = Math.floor((inicioProva - agora) / (1000 * 60));
                        horarioColor = '#f59e0b';
                        horarioIcon = 'hourglass-start';
                        
                        if (minutosRestantes > 60) {
                            const horas = Math.floor(minutosRestantes / 60);
                            horarioText = `Inicia em ${horas}h`;
                        } else {
                            horarioText = `Inicia em ${minutosRestantes}min`;
                        }
                    } else if (agora >= inicioProva && agora <= terminoProva) {
                        const minutosRestantes = Math.floor((terminoProva - agora) / (1000 * 60));
                        horarioColor = '#10b981';
                        horarioIcon = 'play-circle';
                        horarioText = `Disponível (${minutosRestantes}min restantes)`;
                    } else {
                        horarioColor = '#ef4444';
                        horarioIcon = 'ban';
                        horarioText = 'Horário encerrado';
                    }
                }

                
                // DETERMINAR SE A PROVA ESTÁ DISPONÍVEL PELO HORÁRIO
                const provaDisponivelPorHorario = !prova.horarioInicio || 
                    (new Date() >= new Date(`${new Date().toISOString().split('T')[0]}T${prova.horarioInicio}:00`) && 
                    new Date() <= new Date(`${new Date().toISOString().split('T')[0]}T${prova.horarioTermino}:00`));

                // DETERMINAR SE A PROVA FOI CANCELADA
                // Verifica se tem campo cancelada: true OU motivoCancelamento
                const provaCancelada = prova.cancelada === true || prova.motivoCancelamento || 
                                    prova.status === 'cancelada' || 
                                    (prova.status === 'finalizada' && prova.nota === 0 && prova.motivoCancelamento);
                
                // Determinar classe e status com base no tipo e status da prova
                let statusClass = 'pendente';
                let statusText = 'PENDENTE';
                let statusColor = '#f59e0b';
                
                if (tipo === 'concluida') {
                    if (provaCancelada) {
                        // PROVA CANCELADA - STATUS ESPECIAL
                        statusClass = 'cancelada';
                        statusText = 'CANCELADA';
                        statusColor = '#ef4444';
                    } else if (prova.status === 'aguardando_correcao') {
                        statusClass = 'pendente';
                        statusText = 'AGUARDANDO CORREÇÃO';
                        statusColor = '#f59e0b';
                    } else if (prova.status === 'concluida' || prova.status === 'finalizada' || prova.status === 'corrigida') {
                        statusClass = 'concluida';
                        statusText = 'CONCLUÍDA';
                        statusColor = '#6b7280';
                    }
                } else if (tipo === 'pendente') {
                    if (provaCancelada) {
                        statusClass = 'cancelada';
                        statusText = 'CANCELADA';
                        statusColor = '#ef4444';
                    } else {
                        statusClass = 'pendente';
                        statusText = 'PENDENTE';
                        statusColor = '#f59e0b';
                    }
                }

                let horarioInfo = '';
                if (prova.horarioInicio && prova.horarioTermino) {
                    const agora = new Date();
                    const dataHoje = agora.toISOString().split('T')[0];
                    const inicioProva = new Date(`${dataHoje}T${prova.horarioInicio}:00`);
                    const terminoProva = new Date(`${dataHoje}T${prova.horarioTermino}:00`);
                    
                    // Verificar se está dentro do horário
                    if (agora >= inicioProva && agora <= terminoProva) {
                        const minutosRestantes = Math.floor((terminoProva - agora) / (1000 * 60));
                        horarioInfo = `<span style="color: #10b981; font-size: 0.9rem;">
                            ⏰ Disponível agora (termina em ${minutosRestantes} min)
                        </span>`;
                    } else if (agora < inicioProva) {
                        const minutosRestantes = Math.floor((inicioProva - agora) / (1000 * 60));
                        horarioInfo = `<span style="color: #f59e0b; font-size: 0.9rem;">
                            ⏰ Disponível às ${prova.horarioInicio} (${minutosRestantes > 60 ? 
                                Math.floor(minutosRestantes/60) + 'h' : 
                                minutosRestantes + 'min'})
                        </span>`;
                    } else {
                        horarioInfo = `<span style="color: #ef4444; font-size: 0.9rem;">
                            ⏰ Horário encerrado
                        </span>`;
                    }
                }
                
                // BOTÃO DE AÇÃO - CORREÇÃO PRINCIPAL
                // Botão de ação
                let botaoAcao = '';
                
                if (tipo === 'pendente') {
                    // Verificar disponibilidade por horário
                    if (!provaDisponivelPorHorario && prova.horarioInicio) {
                        const inicioProva = new Date(`${new Date().toISOString().split('T')[0]}T${prova.horarioInicio}:00`);
                        const minutosRestantes = Math.floor((inicioProva - new Date()) / (1000 * 60));
                        
                        if (minutosRestantes > 0) {
                            let mensagemTempo = '';
                            if (minutosRestantes > 60) {
                                const horas = Math.floor(minutosRestantes / 60);
                                mensagemTempo = `Disponível em ${horas}h`;
                            } else {
                                mensagemTempo = `Disponível em ${minutosRestantes}min`;
                            }
                            
                            botaoAcao = `
                                <button class="btn-iniciar-prova" style="background: #6b7280;" disabled>
                                    <i class="fas fa-${horarioIcon}"></i> ${mensagemTempo}
                                </button>
                            `;
                        } else {
                            botaoAcao = `
                                <button class="btn-iniciar-prova" style="background: #6b7280;" disabled>
                                    <i class="fas fa-ban"></i> Horário encerrado
                                </button>
                            `;
                        }
                    } else if (prova.cancelada) {
                        botaoAcao = `
                            <button class="btn-iniciar-prova" style="background: #6b7280;" disabled>
                                <i class="fas fa-ban"></i> Cancelada
                            </button>
                        `;
                    } else {
                        botaoAcao = `
                            <button class="btn-iniciar-prova" onclick="selecionarProva('${prova._id}')">
                                <i class="fas fa-play"></i> Realizar Prova
                            </button>
                        `;
                    }
                } else if (tipo === 'concluida') {
                    // Para provas concluídas
                    if (provaCancelada) {
                        // PROVA CANCELADA
                        botaoAcao = `
                            <button class="btn-sair-prova" onclick="verDetalhesCancelamento('${prova._id || prova.id}')">
                                <i class="fas fa-info-circle"></i> Ver Detalhes
                            </button>
                            ${prova.nota !== undefined ? `
                            <div style="margin-top: 10px; padding: 8px; background: #fee2e2; border-radius: 6px; border-left: 3px solid #ef4444;">
                                <strong style="color: #ef4444;">Nota: ${prova.nota.toFixed(1)}</strong>

                    } else if (prova.status === 'aguardando_correcao') {

                            </button>

                    } else if (prova.nota !== null && prova.nota !== undefined) {
                        botaoAcao = `

                                <i class="fas fa-star"></i> Ver Nota: ${prova.nota.toFixed(1)}

                    } else {
                        botaoAcao = `
                            <button class="btn-iniciar-prova" style="background: #6b7280;" disabled>
                                <i class="fas fa-hourglass-half"></i> Sem nota disponível
                            </button>

                                    <i class="fas fa-${horarioIcon}"></i>

                                <div style="font-size: 0.9rem; color: ${horarioColor}; font-weight: 500;">
                                    ${horarioText}

        // Função para verificar e cancelar provas expiradas automaticamente
        async function verificarECancelarProvasExpiradas() {
            try {
                const token = localStorage.getItem('auth_token');
                const userData = localStorage.getItem('user_data');
                
                if (!token || !userData) return;
                
                const usuario = JSON.parse(userData);
                if (usuario.role !== 'aluno') return;
                
                // Buscar provas pendentes novamente para verificar expiração
                const response = await fetch(`${API_BASE_URL}/aluno/provas/pendentes`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                if (!data.success) return;
                
                const provasPendentes = data.provas || [];
                const hoje = new Date();
                
                // Para cada prova pendente, verificar se expirou
                for (const prova of provasPendentes) {
                    // Pular se já está cancelada ou finalizada
                    if (prova.status === 'cancelada' || prova.status === 'finalizada') continue;
                    
                    if (prova.dataLimite) {
                        const dataLimiteObj = new Date(prova.dataLimite);
                        const dataLimiteFimDia = new Date(dataLimiteObj);
                        dataLimiteFimDia.setHours(23, 59, 59, 999);
                        
                        // Se a prova expirou (hoje > data limite fim do dia)
                        if (hoje > dataLimiteFimDia) {
                            console.log(`⚠️ Prova "${prova.titulo}" expirou! Cancelando automaticamente...`);
                            
                            // CORREÇÃO: Garantir que respostas seja array vazio, não string
                            const respostasCorretas = [];
                            
                            // Chamar API para cancelar automaticamente
                            const cancelResponse = await fetch(`${API_BASE_URL}/provas/${prova._id}/cancelar`, {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    motivo: 'Prazo de entrega expirado - Cancelamento automático',
                                    estatisticas: {
                                        dataExpiracao: dataLimiteObj.toISOString(),
                                        dataCancelamento: hoje.toISOString(),
                                        motivo: 'prazo_expirado',
                                        acao: 'cancelamento_automatico'
                                    },
                                    respostasAtuais: respostasCorretas, // ARRAY VAZIO CORRETO
                                    tempoTotal: 0
                                })
                            });
                            
                            const cancelData = await cancelResponse.json();
                            
                            if (cancelData.success) {
                                console.log(`✅ Prova cancelada: ${cancelData.message}`);
                            } else {
                                console.error(`❌ Falha ao cancelar: ${cancelData.error}`);
                            }
                            
                            // Atualizar a interface após 2 segundos
                            setTimeout(() => {
                                carregarProvasPendentes();
                                carregarProvasConcluidas();
                            }, 2000);
                        }
                    }
                }
            } catch (error) {
                console.error('Erro ao verificar provas expiradas:', error);
            }
        }

                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {

                    if (data.success && data.prova) {
                        // Atualizar a prova no array local com os horários
                        const index = provasPendentes.findIndex(p => p._id === provaId);
                        if (index !== -1) {
                            provasPendentes[index] = {

                                horarioInicio: data.prova.horarioInicio,
                                horarioTermino: data.prova.horarioTermino,
                                duracaoMinutos: data.prova.duracaoMinutos,
                                duracaoFormatada: data.prova.duracaoFormatada,
                                dataCriacao: data.prova.dataCriacao,

                            };

                            provaSelecionada = provasPendentes[index];

            }
            // ================================================
            
            // Verificar se a prova está disponível pelo horário
            if (provaSelecionada.horarioInicio && provaSelecionada.horarioTermino) {
                const agora = new Date();
                const hoje = agora.toISOString().split('T')[0];
                const inicioProva = new Date(`${hoje}T${provaSelecionada.horarioInicio}:00`);
                const terminoProva = new Date(`${hoje}T${provaSelecionada.horarioTermino}:00`);
                
                if (agora < inicioProva) {
                    const minutosRestantes = Math.floor((inicioProva - agora) / (1000 * 60));
                    let mensagem = `Esta prova só estará disponível a partir das ${provaSelecionada.horarioInicio}`;
                    
                    if (minutosRestantes > 0) {
                        if (minutosRestantes > 60) {
                            const horas = Math.floor(minutosRestantes / 60);
                            mensagem += ` (em ${horas} hora${horas > 1 ? 's' : ''})`;
                        } else {
                            mensagem += ` (em ${minutosRestantes} minuto${minutosRestantes > 1 ? 's' : ''})`;
                        }
                    }
                    
                    alert(mensagem);
                    return;

                if (agora > terminoProva) {
                    alert(`⏰ O horário para esta prova terminou às ${provaSelecionada.horarioTermino}`);

            // Verificar data limite

                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',

            document.getElementById('modalProvaInfo').innerHTML = `

                <!-- SEÇÃO DE HORÁRIOS (ATUALIZADA) -->
                ${provaSelecionada.horarioInicio && provaSelecionada.horarioTermino ? `
                    <div style="background: linear-gradient(135deg, #f0f9ff, #e0f2fe); padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #bae6fd;">
                        <p style="margin: 0 0 10px 0; color: #0369a1; font-weight: bold; display: flex; align-items: center; gap: 8px;">
                            <i class="far fa-clock"></i>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">

                                <div style="font-size: 1.2rem; font-weight: bold; color: #10b981;">
                                    ${provaSelecionada.horarioInicio}
                                </div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 0.85rem; color: #6b7280; margin-bottom: 5px;">Término</div>
                                <div style="font-size: 1.2rem; font-weight: bold; color: #ef4444;">
                                    ${provaSelecionada.horarioTermino}
                                </div>

                        <div style="text-align: center; margin-top: 10px;">
                            <div style="font-size: 0.85rem; color: #6b7280; margin-bottom: 5px;">Duração Total</div>
                            <div style="font-size: 1.3rem; font-weight: bold; color: #4f46e5;">

                            </div>

                    </div>
                ` : `

                        <p style="margin: 0 0 10px 0; color: #92400e; font-weight: bold; display: flex; align-items: center; gap: 8px;">

        // Função principal para iniciar prova - VERSÃO CORRIGIDA
        async function iniciarProva(provaId) {
        console.log('🚀 Iniciando prova com ID:', provaId);
        
        try {
            // 1. Verificar se está autenticado
            const token = localStorage.getItem('auth_token');
            if (!token) {
            alert('Você precisa estar logado para acessar a prova');
            window.location.href = '/login.html';
            return;
            }
            
            // 2. Verificar dados do usuário
            const userData = localStorage.getItem('user_data');
            if (!userData) {
            alert('Dados do usuário não encontrados');
            window.location.href = '/login.html';
            return;
            }
            
            const usuario = JSON.parse(userData);
            if (usuario.role !== 'aluno') {
            alert('Apenas alunos podem acessar provas');
            window.location.href = usuario.role === 'professor' ? '/index.html' : '/login.html';
            return;
            }
            
            // 3. Limpar tokens antigos de prova
            localStorage.removeItem('provaToken');
            localStorage.removeItem('provaAtual');
            localStorage.removeItem('provaData');
            
            console.log('🔄 Solicitando acesso à prova...');
            
            // 4. Mostrar loading
            mostrarLoading('Validando acesso à prova...');
            
            // 5. Chamar endpoint de acesso
            const response = await fetch(`${API_BASE_URL}/provas/${provaId}/acesso`, {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
            });
            
            const data = await response.json();
            
            // 6. Verificar resposta
            if (!response.ok || !data.success) {
            throw new Error(data.error || 'Erro ao acessar a prova');
            }
            
            console.log('✅ Acesso autorizado:', data);
            
            // 7. Armazenar tokens corretamente
            if (data.provaToken) {
            localStorage.setItem('provaToken', data.provaToken);
            localStorage.setItem('provaAtual', provaId);
            
            // Armazenar dados da prova para usar na página de realização
            if (data.prova) {
                localStorage.setItem('provaData', JSON.stringify(data.prova));
            }
            }
            
            // 8. Redirecionar
            if (data.redirectTo) {
            console.log('🔄 Redirecionando para:', data.redirectTo);
            window.location.href = data.redirectTo;
            } else if (data.provaToken) {
            window.location.href = `/realizar-prova.html?token=${data.provaToken}`;
            } else {
            throw new Error('Não foi possível redirecionar para a prova');
            }
            
        } catch (error) {
            console.error('❌ Erro ao iniciar prova:', error);
            esconderLoading();
            
            // Mensagens de erro amigáveis
            let mensagem = 'Erro ao acessar a prova. ';
            
            if (error.message.includes('401') || error.message.includes('token')) {
            mensagem += 'Sua sessão expirou. Faça login novamente.';
            localStorage.clear();
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 2000);
            } else if (error.message.includes('403')) {
            mensagem += 'Você não tem permissão para acessar esta prova.';
            } else if (error.message.includes('404')) {
            mensagem += 'Prova não encontrada.';
            } else if (error.message.includes('já realizou')) {
            mensagem += 'Você já completou esta prova.';
            } else if (error.message.includes('data limite')) {
            mensagem += 'O prazo para esta prova já expirou.';
            } else {
            mensagem += error.message || 'Tente novamente.';
            }
            
            alert(mensagem);
        }
        }

        // Adicionar esta função no início do código
        function verificarAutenticacao() {
        const token = localStorage.getItem('auth_token');
        const userData = localStorage.getItem('user_data');
        
        if (!token || !userData) {
            window.location.href = '/login.html';
            return false;
        }
        
        try {
            const user = JSON.parse(userData);
            if (user.role !== 'aluno') {
            window.location.href = user.role === 'professor' ? '/index.html' : '/login.html';
            return false;
            }
            return true;
        } catch (e) {
            window.location.href = '/login.html';
            return false;
        }
        }

        // Modificar o carregarDadosAluno para usar verificação
        async function carregarDadosAluno() {
        // Verificar autenticação primeiro
        if (!verificarAutenticacao()) {
            return;
        }
        
        try {
            const token = localStorage.getItem('auth_token');
            const userData = localStorage.getItem('user_data');
            
            // Usar dados do localStorage primeiro (mais rápido)
            if (userData) {
            usuario = JSON.parse(userData);
            atualizarInfoAluno(usuario);
            }
            
            // Buscar dados atualizados da API
            const response = await fetch(`${API_BASE_URL}/auth/me`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
            });
            
            if (response.status === 401) {
            localStorage.clear();
            window.location.href = '/login.html';
            return;
            }
            
            const data = await response.json();
            
            if (data.success) {
            usuario = data.user;
            localStorage.setItem('user_data', JSON.stringify(usuario));
            atualizarInfoAluno(usuario);
            
            // Carregar dados das provas e turmas
            await carregarProvasPendentes();
            await carregarTurmasAluno();
            } else {
            throw new Error(data.error || 'Erro ao carregar dados');
            }
            
        } catch (error) {
            console.error('Erro ao carregar dados:', error);
            mostrarErro('Erro ao carregar dados. Tente recarregar a página.');
        }
        }

        function atualizarInfoAluno(user) {
        document.getElementById('alunoDetails').innerHTML = `
            <p><strong>${user.nome}</strong></p>
            <p>${user.curso ? user.curso + ' | ' : ''}${user.matricula || 'Sem matrícula'}</p>
            <p>${user.email}</p>
        `;
        }
        
        // Ver resultado da prova
        function verResultado(provaId) {
            console.log('🔍 Prova ID recebido:', provaId);
            
            if (!provaId || provaId === 'undefined' || provaId === 'null') {
                alert('Erro: ID da prova não encontrado. Tente recarregar a página.');
                return;
            }
            
            // Verificar se é um ObjectId válido (24 caracteres hex)
            if (provaId.length !== 24 || !/^[0-9a-fA-F]{24}$/.test(provaId)) {
                console.error('❌ ID da prova inválido:', provaId);
                alert('ID da prova inválido. Contate o administrador.');
                return;
            }
            
            // Primeiro verificar se já pode ver o resultado
            const token = localStorage.getItem('auth_token');
            
            // Verificar status da prova
            fetch(`${API_BASE_URL}/aluno/provas/${provaId}/resultado`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    if (data.status === 'corrigida' && data.nota !== null) {
                        // Redirecionar para página de resultados
                        window.location.href = `resultado-aluno.html?provaId=${provaId}`;
                    } else if (data.status === 'pendente') {
                        // Mostrar mensagem amigável
                        alert('⌛ Sua prova ainda está sendo corrigida pelo professor. Você receberá uma notificação quando a correção estiver disponível.');
                    } else {
                        alert('ℹ️ ' + (data.mensagem || 'Status da prova não disponível.'));
                    }
                } else {
                    alert('❌ ' + data.error);
                }
            })
            .catch(error => {
                console.error('Erro ao verificar status:', error);
                alert('Erro ao verificar status da prova. Tente novamente.');
            });
        }
        // Função para verificar atualizações de status periodicamente
        function verificarAtualizacoesStatus() {
            if (!usuario || usuario.role !== 'aluno') return;
            
            const token = localStorage.getItem('auth_token');
            if (!token) return;
            
            // Verificar a cada 30 segundos

                    headers: {
                        'Authorization': `Bearer ${token}`

                })
                .then(response => response.json())
                .then(data => {

                        }
                    }
                })
                .catch(error => console.error('Erro ao verificar atualizações:', error));

                        for (const prova of provasPendentes) {
                            // Só buscar se não tiver horários ainda
                            if (!prova.horarioInicio && prova._id) {
                                try {
                                    const response = await fetch(`${API_BASE_URL}/provas/${prova._id}`, {
                                        headers: {
                                            'Authorization': `Bearer ${token}`,
                                            'Content-Type': 'application/json'
                                        }
                                    });
                                    
                                    if (response.ok) {
                                        const data = await response.json();
                                        if (data.success && data.prova && data.prova.horarioInicio) {
                                            // Atualizar a prova com horários
                                            prova.horarioInicio = data.prova.horarioInicio;
                                            prova.horarioTermino = data.prova.horarioTermino;
                                            prova.duracaoMinutos = data.prova.duracaoMinutos;
                                            prova.duracaoFormatada = data.prova.duracaoFormatada;
                                            
                                            console.log(`✅ Horários carregados para: ${prova.titulo.substring(0, 30)}...`);
                                        }
                                    }
                                } catch (error) {
                                    // Ignorar erros no carregamento em background
                                }
                            }
                        }
                        
                        // Se a interface estiver mostrando provas, atualizar
                        if (document.getElementById('provasPendentes') && document.getElementById('provasPendentes').innerHTML.includes('prova-card')) {
                            console.log('🔄 Atualizando interface com horários...');
                            atualizarListaProvas('provasPendentes', provasPendentes, 'pendente');
                        }
                    }, 1500); // Delay de 1.5 segundos para não sobrecarregar
                }
            };
            
            console.log('✅ Patch para horários aplicado com sucesso!');
        })();
    </script>
</body>
</html>
