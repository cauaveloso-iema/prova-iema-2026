<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar Refeição - Cozinha IEMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .feedback-card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .feedback-header {
            margin-bottom: 25px;
        }
        .feedback-header i {
            font-size: 48px;
            color: #f59e0b;
            background: #fef3c7;
            padding: 15px;
            border-radius: 50%;
        }
        .feedback-header h1 {
            font-size: 1.8rem;
            margin-top: 15px;
            color: #1e293b;
        }
        .rating-stars {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }
        .star {
            font-size: 48px;
            cursor: pointer;
            color: #cbd5e1;
            transition: all 0.2s;
        }
        .star:hover, .star.active {
            color: #f59e0b;
            transform: scale(1.1);
        }
        .emoji-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .emoji-btn {
            background: #f8fafc;
            border: 2px solid #e5e7eb;
            border-radius: 60px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
        }
        .emoji-btn.selected {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }
        .emoji-btn:hover {
            transform: translateY(-2px);
        }
        .form-control, .form-select {
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            padding: 12px 15px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #1e3c72;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }
        .btn-enviar {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .btn-enviar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 60, 114, 0.3);
        }
        .success-message {
            text-align: center;
            padding: 20px;
        }
        .success-message i {
            font-size: 64px;
            color: #10b981;
            margin-bottom: 20px;
        }
        .refeicao-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .refeicao-manha { background: #fef3c7; color: #d97706; }
        .refeicao-almoco { background: #fee2e2; color: #dc2626; }
        .refeicao-tarde { background: #d1fae5; color: #059669; }
        .anonimo-check {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="feedbackForm" class="feedback-card">
            <div class="feedback-header">
                <i class="fas fa-utensils"></i>
                <h1>Avalie a Refeição</h1>
                <p class="text-muted">Sua opinião nos ajuda a melhorar!</p>
            </div>
            
            <div id="mensagemInfo" class="alert alert-info mb-3" style="display: none;"></div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Qual refeição você avaliou?</label>
                <select id="tipoRefeicao" class="form-select">
                    <option value="manha">🌅 Lanche da Manhã (8h-10h)</option>
                    <option value="almoco" selected>🍽️ Almoço (11h-13h)</option>
                    <option value="tarde">🌙 Lanche da Tarde (14h-16h)</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Sua avaliação (1 a 5 estrelas)</label>
                <div class="rating-stars" id="ratingStars">
                    <i class="fas fa-star star" data-value="1"></i>
                    <i class="fas fa-star star" data-value="2"></i>
                    <i class="fas fa-star star" data-value="3"></i>
                    <i class="fas fa-star star" data-value="4"></i>
                    <i class="fas fa-star star" data-value="5"></i>
                </div>
                <input type="hidden" id="nota" value="0">
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Você gostou da comida?</label>
                <div class="emoji-buttons">
                    <div class="emoji-btn" data-gostou="sim">
                        <i class="far fa-smile-wink"></i> Sim, adorei!
                    </div>
                    <div class="emoji-btn" data-gostou="mais_ou_menos">
                        <i class="far fa-meh"></i> Mais ou menos
                    </div>
                    <div class="emoji-btn" data-gostou="nao">
                        <i class="far fa-frown"></i> Não gostei
                    </div>
                </div>
                <input type="hidden" id="gostou" value="">
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Comentário (opcional)</label>
                <textarea id="comentario" class="form-control" rows="3" placeholder="O que você achou da comida? Como podemos melhorar?"></textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Sugestão (opcional)</label>
                <textarea id="sugestao" class="form-control" rows="2" placeholder="Sugira novos pratos, temperos, etc..."></textarea>
            </div>
            
            <div class="anonimo-check">
                <input type="checkbox" id="anonimo">
                <label for="anonimo">Enviar anonimamente</label>
            </div>
            
            <button class="btn-enviar" onclick="enviarFeedback()">
                <i class="fas fa-paper-plane"></i> Enviar Feedback
            </button>
            
            <div class="mt-3 text-center">
                <small class="text-muted">Obrigado por ajudar a melhorar nossa cozinha! 🍽️</small>
            </div>
        </div>
        
        <div id="successMessage" class="feedback-card" style="display: none;">
            <div class="success-message">
                <i class="fas fa-check-circle"></i>
                <h2>Feedback Enviado!</h2>
                <p class="text-muted">Obrigado por avaliar nossa refeição. Sua opinião é muito importante para nós!</p>
                <button class="btn-enviar mt-3" onclick="recarregarForm()">
                    <i class="fas fa-redo"></i> Nova Avaliação
                </button>
                <button class="btn-secondary mt-2" onclick="window.close()" style="background: #e2e8f0; border: none; padding: 10px 20px; border-radius: 30px;">
                    <i class="fas fa-times"></i> Fechar
                </button>
            </div>
        </div>
    </div>
    
    <script>
        let notaSelecionada = 0;
        let gostouSelecionado = '';
        let token = localStorage.getItem('auth_token');
        
        // Verificar autenticação
        if (!token) {
            window.location.href = '/login.html?redirect=feedback-cozinha.html';
        }
        
        // Inicializar estrelas
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function() {
                notaSelecionada = parseInt(this.dataset.value);
                document.getElementById('nota').value = notaSelecionada;
                
                document.querySelectorAll('.star').forEach(s => {
                    const valor = parseInt(s.dataset.value);
                    if (valor <= notaSelecionada) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
            });
        });
        
        // Inicializar emojis
        document.querySelectorAll('.emoji-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                gostouSelecionado = this.dataset.gostou;
                document.getElementById('gostou').value = gostouSelecionado;
                
                document.querySelectorAll('.emoji-btn').forEach(b => {
                    b.classList.remove('selected');
                });
                this.classList.add('selected');
            });
        });
        
        async function enviarFeedback() {
            const tipoRefeicao = document.getElementById('tipoRefeicao').value;
            const nota = parseInt(document.getElementById('nota').value);
            const comentario = document.getElementById('comentario').value;
            const sugestao = document.getElementById('sugestao').value;
            const anonimo = document.getElementById('anonimo').checked;
            
            // Validação
            if (nota === 0) {
                alert('Por favor, selecione uma avaliação de 1 a 5 estrelas');
                return;
            }
            
            const btn = document.querySelector('.btn-enviar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
            
            try {
                const response = await fetch('/api/feedback-cozinha/enviar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        tipoRefeicao,
                        nota,
                        comentario,
                        gostou: gostouSelecionado || null,
                        sugestao,
                        anonimo
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('feedbackForm').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                } else {
                    alert('Erro: ' + data.error);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao enviar feedback. Tente novamente.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Feedback';
            }
        }
        
        function recarregarForm() {
            document.getElementById('feedbackForm').style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
            
            // Resetar formulário
            document.getElementById('tipoRefeicao').value = 'almoco';
            document.getElementById('nota').value = 0;
            document.getElementById('comentario').value = '';
            document.getElementById('sugestao').value = '';
            document.getElementById('anonimo').checked = false;
            document.getElementById('gostou').value = '';
            
            notaSelecionada = 0;
            gostouSelecionado = '';
            
            document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
        }
        
        // Carregar dados do usuário
        async function carregarUsuario() {
            try {
                const response = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    const infoDiv = document.getElementById('mensagemInfo');
                    infoDiv.style.display = 'block';
                    infoDiv.innerHTML = `<i class="fas fa-user-circle"></i> Olá, ${data.user.nome}! Sua opinião é muito importante.`;
                }
            } catch (error) {
                console.error('Erro:', error);
            }
        }
        
        carregarUsuario();
    </script>

            <script>
        // ============================================
        // SISTEMA DE ESCALONAMENTO PROPORCIONAL - APENAS MOBILE
        // ============================================
        (function() {
            if (window.innerWidth > 768) {
                console.log('📐 Desktop detectado - escalonamento desativado');
                return;
            }
            
            console.log('📐 Inicializando sistema de escalonamento proporcional (mobile)...');
            
            function calcularEscalaMobile() {
                const width = window.innerWidth;
                const baseWidth = 768;
                let escala = Math.max(0.5, Math.min(1, width / baseWidth));
                
                if (width <= 320) escala = 0.55;
                else if (width <= 360) escala = 0.6;
                else if (width <= 400) escala = 0.65;
                else if (width <= 500) escala = 0.75;
                else if (width <= 600) escala = 0.85;
                else if (width <= 700) escala = 0.95;
                else escala = 1;
                
                return escala;
            }
            
            function aplicarEscalaMobile() {
                if (window.innerWidth > 768) return;
                const escala = calcularEscalaMobile();
                document.documentElement.style.setProperty('--scale-ratio', escala);
                document.documentElement.style.setProperty('--current-width', window.innerWidth);
                console.log(`📐 Mobile: escala ${escala.toFixed(2)} | largura: ${window.innerWidth}px`);
            }
            
            aplicarEscalaMobile();
            
            let timeout;
            window.addEventListener('resize', function() {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    if (window.innerWidth <= 768) {
                        aplicarEscalaMobile();
                    } else {
                        document.documentElement.style.setProperty('--scale-ratio', '1');
                        console.log('📐 Modo desktop - escala resetada');
                    }
                }, 100);
            });
            
            window.addEventListener('orientationchange', function() {
                setTimeout(() => {
                    if (window.innerWidth <= 768) {
                        aplicarEscalaMobile();
                    }
                }, 200);
            });
            
            console.log('✅ Sistema de escalonamento mobile ativo!');
        })();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('✅ Service Worker ativo'))
                    .catch(err => console.log('❌ Erro:', err));
            });
        }

        window.addEventListener('online', () => console.log('🌐 Online'));
        window.addEventListener('offline', () => console.log('📴 Offline'));
    </script>
    
</body>
</html>
