<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sistema de Provas">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Correção de Prova - Sistema IEMA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: white; border-radius: 24px; padding: 25px; margin-bottom: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
        .header h1 { color: #4f46e5; margin-bottom: 8px; font-size: 1.8rem; }
        
        .btn-voltar { 
            background: #f3f4f6; 
            color: #4b5563; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: 600; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 20px; 
            transition: all 0.3s; 
        }
        .btn-voltar:hover { background: #e5e7eb; transform: translateX(-3px); }
        
        .prova-info { background: linear-gradient(135deg, #f8fafc, #f1f5f9); padding: 20px; border-radius: 16px; margin-bottom: 25px; border-left: 4px solid #4f46e5; }
        .gabarito-oficial { background: #f8fafc; border-radius: 16px; padding: 15px; margin-bottom: 20px; }
        .gabarito-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .gabarito-item { background: white; padding: 6px 12px; border-radius: 20px; border: 1px solid #e5e7eb; font-weight: 500; }
        .gabarito-item.correta { background: #d1fae5; border-color: #10b981; color: #065f46; }
        
        .selecao-aluno { background: #f8fafc; border-radius: 16px; padding: 15px; margin-bottom: 20px; }
        .selecao-aluno select { width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 1rem; margin-top: 8px; cursor: pointer; }
        
        .camera-container { background: #f8fafc; border-radius: 16px; padding: 20px; text-align: center; position: relative; }
        .camera-preview { position: relative; display: inline-block; border-radius: 12px; overflow: hidden; width: 100%; margin: 0 auto; background: #000; }
        
        video, canvas { width: 100%; border-radius: 12px; border: 2px solid #e5e7eb; background: #000; display: block; }
        video { max-height: 60vh; object-fit: contain; }
        
        /* Guias de enquadramento */
        .guia-enquadramento { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 10; }
        .guia-canto { position: absolute; width: 50px; height: 50px; border: 3px solid #10b981; transition: all 0.2s; }
        .guia-canto-top-left { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .guia-canto-top-right { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .guia-canto-bottom-left { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .guia-canto-bottom-right { bottom: 15px; right: 15px; border-left: none; border-top: none; }
        
        .guia-canto.detectado { border-color: #10b981; box-shadow: 0 0 10px #10b981; }
        .guia-canto.parcial { border-color: #f59e0b; }
        .guia-canto.nao-detectado { border-color: #ef4444; }
        
        .feedback-proximidade {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 20;
            white-space: nowrap;
            font-weight: 500;
            transition: all 0.3s;
        }
        .feedback-proximidade.bom { background: #10b981; }
        .feedback-proximidade.medio { background: #f59e0b; }
        .feedback-proximidade.ruim { background: #ef4444; }
        
        .guia-texto { 
            position: absolute; 
            bottom: 20px; 
            left: 0; 
            right: 0; 
            text-align: center; 
            background: rgba(0,0,0,0.85); 
            color: white; 
            padding: 10px; 
            font-size: 13px; 
            border-radius: 30px; 
            width: 90%; 
            margin: 0 auto; 
            left: 5%; 
            z-index: 20;
        }
        
        .contador-automatico {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 20;
            font-family: monospace;
        }
        
        .btn-camera, .btn-capturar { padding: 12px 24px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin: 10px 5px; border: none; transition: all 0.3s; }
        .btn-camera { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; }
        .btn-capturar { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-capturar:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .resultado-correcao { background: #f8fafc; border-radius: 16px; padding: 20px; margin-top: 20px; }
        .respostas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin: 15px 0; }
        .resposta-card { text-align: center; padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; background: white; cursor: pointer; transition: all 0.2s; }
        .resposta-card.correta { background: #d1fae5; border-color: #10b981; }
        .resposta-card.incorreta { background: #fee2e2; border-color: #ef4444; }
        .resposta-card:hover { transform: scale(1.02); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-opcao { width: 36px; padding: 6px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; margin: 2px; }
        .btn-opcao:hover { background: #e0e7ff; }
        
        .nota-final { text-align: center; padding: 15px; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; border-radius: 12px; margin: 15px 0; }
        .nota-valor { font-size: 2rem; font-weight: bold; }
        .btn-salvar { width: 100%; padding: 12px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 15px; }
        
        .loading { text-align: center; padding: 30px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .alert { padding: 10px 15px; border-radius: 10px; margin-bottom: 15px; display: none; }
        .alert-success { background: #d1fae5; color: #065f46; border-left: 4px solid #10b981; }
        .alert-error { background: #fee2e2; color: #7f1d1d; border-left: 4px solid #ef4444; }
        .alert-info { background: #dbeafe; color: #1e40af; border-left: 4px solid #3b82f6; }
        
        .progress-bar { width: 100%; height: 4px; background: #e5e7eb; border-radius: 2px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.3s; }
        
        .omr-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1f2937;
            color: white;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
        }
        .omr-status.online { background: #10b981; }
        .omr-status.offline { background: #ef4444; }
        
        @media (orientation: landscape) {
            .guia-canto { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <button class="btn-voltar" id="btnVoltar">
                <i class="fas fa-arrow-left"></i> Voltar
            </button>
            
            <div class="header">
                <h1><i class="fas fa-camera"></i> Correção Automática de Prova</h1>
                <p>Posicione o cartão-resposta dentro das guias verdes - a captura será automática</p>
            </div>
            
            <div id="alert" class="alert"></div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Carregando dados da prova...</p>
            </div>
            
            <div id="conteudo" style="display: none;">
                <div class="prova-info" id="provaInfo"></div>
                <div class="gabarito-oficial" id="gabaritoOficial"></div>
                
                <div class="selecao-aluno">
                    <label><i class="fas fa-user-graduate"></i> Selecione o Aluno:</label>
                    <select id="selectAluno">
                        <option value="">Carregando alunos...</option>
                    </select>
                </div>
                
                <div class="camera-container">
                    <div class="camera-preview" id="cameraPreview">
                        <video id="video" autoplay playsinline></video>
                        <canvas id="canvas" style="display: none;"></canvas>
                        <div class="guia-enquadramento">
                            <div class="guia-canto guia-canto-top-left" id="cantoTL"></div>
                            <div class="guia-canto guia-canto-top-right" id="cantoTR"></div>
                            <div class="guia-canto guia-canto-bottom-left" id="cantoBL"></div>
                            <div class="guia-canto guia-canto-bottom-right" id="cantoBR"></div>
                            <div class="feedback-proximidade" id="feedbackProximidade">📏 Aguardando cartão</div>
                            <div class="guia-texto" id="guiaTexto">🔍 Alinhe o cartão dentro das guias verdes</div>
                            <div class="contador-automatico" id="contadorAuto">⏱️ Aguardando posição</div>
                        </div>
                    </div>
                    <div>
                        <button class="btn-camera" id="btnIniciarCamera"><i class="fas fa-camera"></i> Iniciar Câmera</button>
                        <button class="btn-capturar" id="btnCapturar" disabled><i class="fas fa-camera-retro"></i> Capturar Manual</button>
                    </div>
                </div>
                
                <div id="processando" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p id="processandoTexto">📸 Processando imagem...</p>
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                </div>
                
                <div id="resultado" style="display: none;">
                    <div class="resultado-correcao">
                        <h3><i class="fas fa-chart-line"></i> Resultado da Correção</h3>
                        <div id="respostasGrid" class="respostas-grid"></div>
                        <div id="notaFinal" class="nota-final"></div>
                        <button class="btn-salvar" id="btnSalvarNota"><i class="fas fa-save"></i> Salvar Nota</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Status do servidor OMR -->
    <div class="omr-status offline" id="omrStatus">
        <i class="fas fa-microchip"></i>
        <span>OMR: Verificando...</span>
    </div>
    
    <script>
        // ========== CONFIGURAÇÃO ==========
        const urlParams = new URLSearchParams(window.location.search);
        let provaId = urlParams.get('prova');
        let urlToken = urlParams.get('token');
        
        let authToken = urlToken || localStorage.getItem('auth_token');
        
        if (!authToken) {
            const redirectUrl = encodeURIComponent(`/corrigir-prova?prova=${provaId || ''}`);
            window.location.href = `/login.html?redirect=${redirectUrl}`;
        }
        
        if (urlToken && !localStorage.getItem('auth_token')) {
            localStorage.setItem('auth_token', urlToken);
        }
        
        if (!provaId) {
            alert('❌ ID da prova não encontrado!');
            window.location.href = '/admin.html';
        }
        
        // URL do servidor OMR via proxy do Node.js
        const OMR_SERVER_URL = '/api/omr';
        
        // ========== FUNÇÃO DE VOLTAR ==========
        function voltarPagina() {
            if (document.referrer && document.referrer.includes(window.location.hostname)) {
                window.history.back();
            } else {
                const userData = JSON.parse(localStorage.getItem('user_data') || '{}');
                const role = userData.role || window.USUARIO_ROLE;
                if (role === 'professor') window.location.href = '/index.html';
                else window.location.href = '/admin.html';
            }
        }
        document.getElementById('btnVoltar')?.addEventListener('click', voltarPagina);
        
        // ========== VERIFICAR STATUS DO SERVIDOR OMR ==========
        async function verificarStatusOMR() {
            try {
                const response = await fetch(`${OMR_SERVER_URL}/status`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const statusEl = document.getElementById('omrStatus');
                    if (data.running) {
                        statusEl.className = 'omr-status online';
                        statusEl.innerHTML = '<i class="fas fa-microchip"></i><span>OMR: Online</span>';
                        console.log('✅ Servidor OMR online');
                        return true;
                    } else {
                        statusEl.className = 'omr-status offline';
                        statusEl.innerHTML = '<i class="fas fa-microchip"></i><span>OMR: Iniciando...</span>';
                        return false;
                    }
                }
            } catch (error) {
                const statusEl = document.getElementById('omrStatus');
                statusEl.className = 'omr-status offline';
                statusEl.innerHTML = '<i class="fas fa-microchip"></i><span>OMR: Aguardando...</span>';
                console.warn('⚠️ Servidor OMR não disponível:', error.message);
            }
            return false;
        }
        
        verificarStatusOMR();
        setInterval(verificarStatusOMR, 10000);
        
        // ========== ENVIAR IMAGEM PARA SERVIDOR OMR ==========
        async function enviarParaOMR(imagemBase64) {
            try {
                console.log('📤 Enviando imagem para servidor OMR...');
                
                // Preparar gabarito para envio
                const gabaritoArray = gabarito.map(g => g.respostaCorreta);
                
                const response = await fetch(`${OMR_SERVER_URL}/detect`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        image: imagemBase64,
                        questions: totalQuestoes,
                        choices: 5,
                        gabarito: gabaritoArray,
                        threshold: 0.18  // Threshold mais sensível
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    console.log('✅ Respostas detectadas:', data.answers);
                    if (data.nota !== null) {
                        console.log('📊 Nota calculada:', data.nota);
                    }
                    return data.answers;
                } else {
                    console.error('❌ Erro na detecção:', data.error);
                    mostrarAlerta(`⚠️ ${data.error || 'Erro na detecção'}`, 'error');
                    return null;
                }
                
            } catch (error) {
                console.error('❌ Erro ao conectar com servidor OMR:', error);
                mostrarAlerta('⚠️ Servidor OMR não disponível. Tente novamente.', 'error');
                return null;
            }
        }
        
        let dadosProva = null;
        let alunos = [];
        let gabarito = [];
        let totalQuestoes = 0;
        let respostasDetectadas = [];
        let notaCalculada = 0;
        let alunoSelecionadoId = null;
        let imagemCapturadaUrl = null;
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnIniciar = document.getElementById('btnIniciarCamera');
        const btnCapturar = document.getElementById('btnCapturar');
        const processando = document.getElementById('processando');
        const resultado = document.getElementById('resultado');
        const guiaTexto = document.getElementById('guiaTexto');
        const feedbackProximidade = document.getElementById('feedbackProximidade');
        const contadorAuto = document.getElementById('contadorAuto');
        const cantoTL = document.getElementById('cantoTL');
        const cantoTR = document.getElementById('cantoTR');
        const cantoBL = document.getElementById('cantoBL');
        const cantoBR = document.getElementById('cantoBR');
        
        let stream = null;
        let analiseFrameInterval = null;
        let contadorPosicaoOk = 0;
        let capturandoAutomaticamente = false;
        
        async function fetchWithAuth(url, options = {}) {
            const token = authToken || localStorage.getItem('auth_token');
            const response = await fetch(url, {
                ...options,
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            });
            
            if (response.status === 401) {
                alert('Sua sessão expirou. Faça login novamente.');
                const redirectUrl = encodeURIComponent(`/corrigir-prova?prova=${provaId}`);
                window.location.href = `/login.html?redirect=${redirectUrl}`;
                return null;
            }
            return response;
        }
        
        function mostrarAlerta(mensagem, tipo = 'info') {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${tipo}`;
            alert.innerHTML = `<i class="fas fa-${tipo === 'success' ? 'check-circle' : tipo === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${mensagem}`;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 5000);
        }
        
        // ========== DETECÇÃO DAS MARCAS PRETAS NOS CANTOS (BUSCA ADAPTATIVA E RIGOROSA) ==========
        function detectarMarcasCantos(ctx, width, height) {
            // 🔥 ESTRATÉGIA: Busca adaptativa - varre toda a imagem para encontrar os cantos
            // não assume posições fixas, mas busca onde estão os pontos pretos
            
            // Passo 1: Encontrar todos os pontos pretos significativos na imagem
            const pontosPretos = [];
            const step = Math.max(8, Math.floor(Math.min(width, height) / 100)); // Amostragem adaptativa
            
            for (let y = step; y < height - step; y += step) {
                for (let x = step; x < width - step; x += step) {
                    // Analisar uma pequena área ao redor do ponto
                    const raio = Math.max(10, Math.floor(step * 0.8));
                    const x1 = Math.max(0, x - raio);
                    const y1 = Math.max(0, y - raio);
                    const x2 = Math.min(width, x + raio);
                    const y2 = Math.min(height, y + raio);
                    
                    const areaImg = ctx.getImageData(x1, y1, x2 - x1, y2 - y1);
                    let pixelsEscuros = 0;
                    let totalArea = areaImg.width * areaImg.height;
                    
                    for (let i = 0; i < areaImg.data.length; i += 4) {
                        const r = areaImg.data[i];
                        const g = areaImg.data[i+1];
                        const b = areaImg.data[i+2];
                        const brilho = (r + g + b) / 3;
                        
                        // Pixel escuro (pretos)
                        if (brilho < 70) {
                            pixelsEscuros++;
                        }
                    }
                    
                    const percentualEscuro = (pixelsEscuros / totalArea) * 100;
                    
                    // Se tiver mais de 30% de pixels escuros, é um candidato a marca preta
                    if (percentualEscuro > 30) {
                        pontosPretos.push({ x, y, percentual: percentualEscuro });
                    }
                }
            }
            
            console.log(`🔍 Encontrados ${pontosPretos.length} pontos candidatos a marca preta`);
            
            if (pontosPretos.length < 4) {
                return { marcas: { tl: false, tr: false, bl: false, br: false }, brilhoMedio: 100 };
            }
            
            // Passo 2: Agrupar pontos próximos (clusterização)
            const clusters = [];
            const distanciaMax = Math.min(width, height) * 0.1; // 10% da dimensão menor
            
            for (const ponto of pontosPretos) {
                let encontrouCluster = false;
                for (const cluster of clusters) {
                    // Calcular distância média para os pontos do cluster
                    let distanciaTotal = 0;
                    for (const p of cluster.pontos) {
                        const dist = Math.hypot(ponto.x - p.x, ponto.y - p.y);
                        distanciaTotal += dist;
                    }
                    const distanciaMedia = distanciaTotal / cluster.pontos.length;
                    
                    if (distanciaMedia < distanciaMax) {
                        cluster.pontos.push(ponto);
                        cluster.centroX = (cluster.centroX * (cluster.pontos.length - 1) + ponto.x) / cluster.pontos.length;
                        cluster.centroY = (cluster.centroY * (cluster.pontos.length - 1) + ponto.y) / cluster.pontos.length;
                        encontrouCluster = true;
                        break;
                    }
                }
                
                if (!encontrouCluster) {
                    clusters.push({
                        pontos: [ponto],
                        centroX: ponto.x,
                        centroY: ponto.y
                    });
                }
            }
            
            console.log(`📦 Formados ${clusters.length} clusters de pontos`);
            
            // Passo 3: Selecionar os 4 clusters mais prováveis (maiores e mais escuros)
            clusters.forEach(cluster => {
                cluster.tamanho = cluster.pontos.length;
                cluster.escuridaoMedia = cluster.pontos.reduce((sum, p) => sum + p.percentual, 0) / cluster.pontos.length;
                cluster.score = cluster.tamanho * (cluster.escuridaoMedia / 100);
            });
            
            clusters.sort((a, b) => b.score - a.score);
            const top4Clusters = clusters.slice(0, 4);
            
            if (top4Clusters.length < 4) {
                return { marcas: { tl: false, tr: false, bl: false, br: false }, brilhoMedio: 100 };
            }
            
            // Passo 4: Determinar qual cluster é cada canto com base na posição
            const cantos = {
                tl: { x: width, y: height, distancia: Infinity },
                tr: { x: 0, y: height, distancia: Infinity },
                bl: { x: width, y: 0, distancia: Infinity },
                br: { x: 0, y: 0, distancia: Infinity }
            };
            
            for (const cluster of top4Clusters) {
                const x = cluster.centroX;
                const y = cluster.centroY;
                
                // Distância para cada canto ideal
                const distTL = Math.hypot(x - 0, y - 0);
                const distTR = Math.hypot(x - width, y - 0);
                const distBL = Math.hypot(x - 0, y - height);
                const distBR = Math.hypot(x - width, y - height);
                
                // Atribuir ao canto mais próximo
                const distancias = [
                    { canto: 'tl', dist: distTL },
                    { canto: 'tr', dist: distTR },
                    { canto: 'bl', dist: distBL },
                    { canto: 'br', dist: distBR }
                ];
                distancias.sort((a, b) => a.dist - b.dist);
                
                const melhorCanto = distancias[0].canto;
                if (distancias[0].dist < cantos[melhorCanto].distancia) {
                    cantos[melhorCanto] = {
                        x: x, y: y, distancia: distancias[0].dist,
                        cluster: cluster
                    };
                }
            }
            
            // Passo 5: Verificar se todos os 4 cantos foram encontrados
            const marcas = {
                tl: cantos.tl.distancia !== Infinity,
                tr: cantos.tr.distancia !== Infinity,
                bl: cantos.bl.distancia !== Infinity,
                br: cantos.br.distancia !== Infinity
            };
            
            // Passo 6: Calcular brilho médio da imagem
            let brilhoTotal = 0;
            let amostras = 0;
            for (let y = 0; y < height; y += 50) {
                for (let x = 0; x < width; x += 50) {
                    try {
                        const pixel = ctx.getImageData(x, y, 1, 1);
                        const brilho = (pixel.data[0] + pixel.data[1] + pixel.data[2]) / 3;
                        brilhoTotal += brilho;
                        amostras++;
                    } catch(e) {}
                }
            }
            const brilhoMedio = amostras > 0 ? brilhoTotal / amostras : 100;
            
            // 🔥 Atualizar visualmente a posição dos cantos detectados
            if (marcas.tl && marcas.tr && marcas.bl && marcas.br) {
                // Calcular a região do cartão com base nos 4 cantos
                const xMin = Math.min(cantos.tl.x, cantos.bl.x);
                const xMax = Math.max(cantos.tr.x, cantos.br.x);
                const yMin = Math.min(cantos.tl.y, cantos.tr.y);
                const yMax = Math.max(cantos.bl.y, cantos.br.y);
                
                // Atualizar visual das guias para a região do cartão
                atualizarGuiasParaRegiao(xMin, yMin, xMax, yMax, width, height);
            }
            
            console.log(`📍 Cantos detectados: TL:${marcas.tl} TR:${marcas.tr} BL:${marcas.bl} BR:${marcas.br} | Brilho: ${brilhoMedio.toFixed(0)}`);
            
            return { marcas, brilhoMedio, cantos: marcas.tl && marcas.tr && marcas.bl && marcas.br ? { tl: cantos.tl, tr: cantos.tr, bl: cantos.bl, br: cantos.br } : null };
        }

        // ========== ATUALIZAR GUIAS PARA A REGIÃO DO CARTÃO ==========
        function atualizarGuiasParaRegiao(xMin, yMin, xMax, yMax, width, height) {
            const preview = document.getElementById('cameraPreview');
            const previewRect = preview.getBoundingClientRect();
            const videoRect = video.getBoundingClientRect();
            
            // Calcular posição relativa das guias
            const escalaX = previewRect.width / width;
            const escalaY = previewRect.height / height;
            
            // Margem de segurança
            const margem = 5;
            
            // Atualizar posição das guias
            const guias = {
                tl: document.getElementById('cantoTL'),
                tr: document.getElementById('cantoTR'),
                bl: document.getElementById('cantoBL'),
                br: document.getElementById('cantoBR')
            };
            
            if (guias.tl) {
                guias.tl.style.left = `${(xMin - margem) * escalaX}px`;
                guias.tl.style.top = `${(yMin - margem) * escalaY}px`;
                guias.tl.style.width = `${(xMax - xMin + margem * 2) * escalaX}px`;
                guias.tl.style.height = `${(yMax - yMin + margem * 2) * escalaY}px`;
                guias.tl.style.position = 'absolute';
            }
            
            // As outras guias serão atualizadas individualmente
            if (guias.tr) {
                guias.tr.style.left = `${(xMax - 30) * escalaX}px`;
                guias.tr.style.top = `${(yMin - margem) * escalaY}px`;
                guias.tr.style.width = '30px';
                guias.tr.style.height = '30px';
            }
            if (guias.bl) {
                guias.bl.style.left = `${(xMin - margem) * escalaX}px`;
                guias.bl.style.top = `${(yMax - 30) * escalaY}px`;
                guias.bl.style.width = '30px';
                guias.bl.style.height = '30px';
            }
            if (guias.br) {
                guias.br.style.left = `${(xMax - 30) * escalaX}px`;
                guias.br.style.top = `${(yMax - 30) * escalaY}px`;
                guias.br.style.width = '30px';
                guias.br.style.height = '30px';
            }
        }

        // ========== ANÁLISE DE POSIÇÃO EM TEMPO REAL (VERSÃO CORRIGIDA) ==========
        function analisarPosicao() {
            if (!video.videoWidth || !video.videoHeight) return;
            
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const { marcas, brilhoMedio, cantos } = detectarMarcasCantos(ctx, canvas.width, canvas.height);
            
            // Atualizar visual das guias
            const cantosElements = {
                tl: cantoTL,
                tr: cantoTR,
                bl: cantoBL,
                br: cantoBR
            };
            
            let cantosDetectados = 0;
            for (const [canto, detectado] of Object.entries(marcas)) {
                if (detectado) {
                    cantosElements[canto].classList.add('detectado');
                    cantosElements[canto].classList.remove('parcial', 'nao-detectado');
                    cantosDetectados++;
                } else {
                    cantosElements[canto].classList.remove('detectado');
                    cantosElements[canto].classList.add('nao-detectado');
                }
            }
            
            // 🔥 Se todos os 4 cantos foram detectados, mostrar a região
            if (cantosDetectados === 4 && cantos) {
                const xMin = Math.min(cantos.tl.x, cantos.bl.x);
                const xMax = Math.max(cantos.tr.x, cantos.br.x);
                const yMin = Math.min(cantos.tl.y, cantos.tr.y);
                const yMax = Math.max(cantos.bl.y, cantos.br.y);
                
                // Desenhar retângulo ao redor do cartão
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 3;
                ctx.strokeRect(xMin, yMin, xMax - xMin, yMax - yMin);
                
                // Atualizar posição das guias
                atualizarGuiasParaRegiao(xMin, yMin, xMax, yMax, canvas.width, canvas.height);
            }
            
            // Verificar iluminação
            const iluminacaoOk = brilhoMedio > 50 && brilhoMedio < 230;
            
            // Determinar qualidade do enquadramento
            let qualidade = 'ruim';
            let mensagem = '';
            let cor = '#ef4444';
            
            if (!iluminacaoOk) {
                if (brilhoMedio <= 50) {
                    mensagem = '🔴 MUITO ESCURO! Ligue uma luz ou aproxime o cartão da luz';
                    cor = '#ef4444';
                } else if (brilhoMedio >= 230) {
                    mensagem = '🔴 MUITO CLARO! Evite reflexos ou luz direta';
                    cor = '#ef4444';
                }
                qualidade = 'ruim';
                contadorPosicaoOk = 0;
                contadorAuto.innerHTML = '💡 Ajuste a iluminação';
                guiaTexto.innerHTML = '💡 Iluminação inadequada - ajuste a luz';
            } 
            else if (cantosDetectados === 4) {
                qualidade = 'bom';
                mensagem = '✅ TODOS OS 4 CANTOS DETECTADOS! Capturando automaticamente...';
                cor = '#10b981';
                
                contadorPosicaoOk++;
                const segundosRestantes = Math.max(0, Math.ceil((30 - contadorPosicaoOk) / 10));
                contadorAuto.innerHTML = `⏱️ Capturando em ${segundosRestantes}s`;
                guiaTexto.innerHTML = `✅ ${segundosRestantes > 0 ? `Mantenha firme por ${segundosRestantes}s` : 'Capturando...'}`;
                
                if (contadorPosicaoOk >= 30 && !capturandoAutomaticamente) {
                    contadorAuto.innerHTML = '📸 Capturando...';
                    capturarAutomaticamente();
                }
            } 
            else if (cantosDetectados >= 2) {
                qualidade = 'medio';
                const faltam = 4 - cantosDetectados;
                mensagem = `🟡 ${cantosDetectados}/4 cantos detectados - ${faltam} cantos faltando`;
                cor = '#f59e0b';
                contadorPosicaoOk = Math.max(0, contadorPosicaoOk - 2);
                contadorAuto.innerHTML = `⏱️ ${cantosDetectados}/4 cantos alinhados`;
                
                // Dica específica de qual canto está faltando
                let cantosFaltando = [];
                if (!marcas.tl) cantosFaltando.push('canto superior esquerdo');
                if (!marcas.tr) cantosFaltando.push('canto superior direito');
                if (!marcas.bl) cantosFaltando.push('canto inferior esquerdo');
                if (!marcas.br) cantosFaltando.push('canto inferior direito');
                
                guiaTexto.innerHTML = `🟡 Ajuste o ${cantosFaltando.join(' e ')}`;
            } 
            else {
                qualidade = 'ruim';
                mensagem = '🔴 Nenhum canto detectado! Posicione o cartão com os 4 cantos pretos visíveis';
                cor = '#ef4444';
                contadorPosicaoOk = 0;
                contadorAuto.innerHTML = '⏱️ Aguardando posição correta';
                guiaTexto.innerHTML = '🔴 Alinhe os 4 cantos pretos do cartão - mova a câmera lentamente';
            }
            
            // Atualizar feedback visual
            feedbackProximidade.textContent = mensagem;
            feedbackProximidade.className = `feedback-proximidade ${qualidade}`;
            
            // Atualizar cor das guias
            document.querySelectorAll('.guia-canto').forEach(c => {
                c.style.borderColor = cor;
            });
            
            // Atualizar info de brilho
            const brilhoInfo = document.getElementById('brilhoInfo');
            if (!brilhoInfo) {
                const div = document.createElement('div');
                div.id = 'brilhoInfo';
                div.style.cssText = 'position:absolute;top:5px;left:5px;background:rgba(0,0,0,0.6);color:white;padding:2px 6px;border-radius:10px;font-size:10px;z-index:20;';
                document.querySelector('.camera-preview').appendChild(div);
            }
            const brilhoEl = document.getElementById('brilhoInfo');
            if (brilhoEl) {
                brilhoEl.innerHTML = `💡 ${Math.round(brilhoMedio)} lux | Cantos: ${cantosDetectados}/4`;
                brilhoEl.style.backgroundColor = brilhoMedio > 200 ? 'rgba(0,0,0,0.8)' : 'rgba(0,0,0,0.6)';
            }
        }
        
        // ========== CAPTURA AUTOMÁTICA ==========
        async function capturarAutomaticamente() {
            if (capturandoAutomaticamente) return;
            capturandoAutomaticamente = true;
            
            mostrarAlerta('📸 Cartão bem posicionado! Capturando automaticamente...', 'success');
            contadorAuto.innerHTML = '📸 Capturando...';
            
            await new Promise(r => setTimeout(r, 300));
            
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            imagemCapturadaUrl = canvas.toDataURL('image/jpeg', 0.95);

            flash.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:white;opacity:0.8;z-index:9999;pointer-events:none;';

            setTimeout(() => flash.remove(), 200);

        // ========== CAPTURA MANUAL ==========

            }

        async function processarImagemEAnalisar() {
            if (!imagemCapturadaUrl) return;
            
            processando.style.display = 'block';
            resultado.style.display = 'none';
            document.getElementById('progressFill').style.width = '0%';
            
            try {
                document.getElementById('processandoTexto').innerHTML = '📤 Enviando para servidor OMR...';
                for (let i = 0; i <= 30; i += 10) {
                    document.getElementById('progressFill').style.width = `${i}%`;
                    await new Promise(r => setTimeout(r, 50));
                }
                
                const respostasDetectadasOCR = await enviarParaOMR(imagemCapturadaUrl);
                
                for (let i = 30; i <= 100; i += 10) {
                    document.getElementById('progressFill').style.width = `${i}%`;
                    await new Promise(r => setTimeout(r, 30));
                }
                
                if (respostasDetectadasOCR && respostasDetectadasOCR.length > 0) {
                    criarInterfaceComRespostas(respostasDetectadasOCR);
                    processando.style.display = 'none';
                    resultado.style.display = 'block';
                    
                    const detectadas = respostasDetectadasOCR.filter(r => r !== null).length;
                    mostrarAlerta(`✅ ${detectadas} de ${totalQuestoes} questões detectadas! Confirme as respostas.`, 'success');
                } else {
                    throw new Error('Falha na detecção - nenhuma resposta encontrada');
                }
                
            } catch (error) {
                console.error('Erro:', error);
                mostrarAlerta('⚠️ Erro na detecção automática. Usando modo manual.', 'error');
                criarInterfaceManual();
                processando.style.display = 'none';
                resultado.style.display = 'block';
            }
        }

        async function carregarDados() {
            try {
                const response = await fetchWithAuth(`/api/provas/${provaId}/resultados`);
                if (!response) return;
                const data = await response.json();
                
                if (data.success) {
                    dadosProva = data;
                    alunos = data.resultados || [];
                    totalQuestoes = data.prova?.quantidadeQuestoes || 0;
                    
                    const provaResponse = await fetchWithAuth(`/api/provas/${provaId}`);
                    if (!provaResponse) return;
                    const provaData = await provaResponse.json();
                    
                    if (provaData.success && provaData.questoes) {
                        const letras = ['A', 'B', 'C', 'D', 'E'];
                        gabarito = provaData.questoes.map((q, idx) => ({
                            numero: idx + 1,
                            respostaCorreta: letras[q.respostaCorreta]
                        }));
                    }
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('conteudo').style.display = 'block';
                    
                    document.getElementById('provaInfo').innerHTML = `
                        <h3><i class="fas fa-file-alt"></i> ${data.prova?.titulo || 'Prova'}</h3>
                        <div><span>📊 ${totalQuestoes} questões | 👥 ${alunos.length} alunos</span></div>
                    `;
                    
                    document.getElementById('gabaritoOficial').innerHTML = `
                        <h4><i class="fas fa-check-circle"></i> Gabarito Oficial</h4>
                        <div class="gabarito-grid">
                            ${gabarito.map(g => `<div class="gabarito-item correta">${g.numero}: ${g.respostaCorreta}</div>`).join('')}
                        </div>
                    `;
                    
                    const selectAluno = document.getElementById('selectAluno');
                    selectAluno.innerHTML = '<option value="">Selecione um aluno...</option>';
                    alunos.forEach(aluno => {
                        selectAluno.innerHTML += `<option value="${aluno.alunoId}">${aluno.alunoNome}</option>`;
                    });
                    selectAluno.addEventListener('change', (e) => { 
                        alunoSelecionadoId = e.target.value;
                        resultado.style.display = 'none';
                        respostasDetectadas = [];
                        notaCalculada = 0;
                        contadorPosicaoOk = 0;
                        capturandoAutomaticamente = false;
                    });
                    
                    mostrarAlerta('✅ Dados carregados! Posicione o cartão - a captura será automática.', 'success');
                }
            } catch (error) { 
                console.error('Erro:', error); 
                mostrarAlerta('Erro ao carregar dados', 'error'); 
            }
        }
        
        // ========== INICIAR CÂMERA COM ANÁLISE CONTÍNUA ==========
        async function iniciarCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } 
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
                
                video.srcObject = stream;
                await video.play();
                btnCapturar.disabled = false;
                btnIniciar.disabled = true;
                
                if (analiseFrameInterval) clearInterval(analiseFrameInterval);
                analiseFrameInterval = setInterval(() => analisarPosicao(), 200);
                
                mostrarAlerta('✅ Câmera iniciada! Posicione o cartão com os 4 cantos dentro das guias.', 'success');
            } catch (error) {
                mostrarAlerta('❌ Não foi possível acessar a câmera.', 'error');
            }
        }
        
        function pararCamera() {
            if (analiseFrameInterval) clearInterval(analiseFrameInterval);
            if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
            video.srcObject = null;
            btnCapturar.disabled = true;
            btnIniciar.disabled = false;
            contadorPosicaoOk = 0;
            capturandoAutomaticamente = false;
        }
        
        async function salvarNotaManual() {
            if (!alunoSelecionadoId) { mostrarAlerta('Selecione um aluno!', 'error'); return; }
            if (respostasDetectadas.length === 0) { mostrarAlerta('Corrija a prova primeiro!', 'error'); return; }
            
            const aluno = alunos.find(a => a.alunoId === alunoSelecionadoId);
            if (!aluno) { mostrarAlerta('Aluno não encontrado', 'error'); return; }
            if (!confirm(`Salvar nota ${notaCalculada.toFixed(1)} para ${aluno.alunoNome}?`)) return;
            
            try {
                const response = await fetchWithAuth(`/api/professor/provas/${provaId}/nota-manual`, {
                    method: 'POST',
                    body: JSON.stringify({
                        alunoId: alunoSelecionadoId,
                        nota: notaCalculada,
                        observacao: `Corrigido em ${new Date().toLocaleString('pt-BR')}. Respostas: ${respostasDetectadas.map(r => `${r.numero}:${r.respostaAluno}`).join(', ')}`
                    })
                });
                if (!response) return;
                const data = await response.json();
                if (data.success) {
                    mostrarAlerta(`✅ Nota ${notaCalculada.toFixed(1)} salva!`, 'success');
                    setTimeout(() => window.location.href = `/resultados.html?provaId=${provaId}`, 1500);
                } else throw new Error(data.error);
            } catch (error) { mostrarAlerta(`❌ Erro: ${error.message}`, 'error'); }
        }
        
        btnIniciar.addEventListener('click', iniciarCamera);
        btnCapturar.addEventListener('click', () => { capturarECorrigirManual(); });
        document.getElementById('btnSalvarNota')?.addEventListener('click', salvarNotaManual);
        window.addEventListener('beforeunload', () => pararCamera());
        
        carregarDados();
    </script>
</body>
</html>
