<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Correção de Prova - Modo Simplificado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #4f46e5; font-size: 1.5rem; }
        
        .btn-voltar {
            background: #f3f4f6;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        .camera-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            margin: 15px 0;
        }
        
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }
        
        .canto {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #10b981;
            transition: all 0.2s;
        }
        .canto.top-left { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .canto.top-right { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .canto.bottom-left { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .canto.bottom-right { bottom: 10px; right: 10px; border-left: none; border-top: none; }
        .canto.detectado { border-color: #10b981; box-shadow: 0 0 10px #10b981; }
        .canto.nao-detectado { border-color: #ef4444; }
        
        .feedback {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 20;
        }
        
        .btn-camera, .btn-capturar {
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
            border: none;
        }
        .btn-camera { background: #4f46e5; color: white; }
        .btn-capturar { background: #10b981; color: white; }
        
        .respostas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        .resposta-card {
            text-align: center;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: white;
        }
        .btn-opcao {
            width: 32px;
            padding: 4px;
            background: #f3f4f6;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            margin: 2px;
        }
        .nota-final {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-radius: 12px;
        }
        .btn-salvar {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }
        .loading { text-align: center; padding: 30px; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            margin-top: 8px;
        }
        
        .info-bar {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-family: monospace;
            z-index: 1000;
        }
        
        .log-panel {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 9px;
            font-family: monospace;
            max-width: 300px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <button class="btn-voltar" onclick="window.history.back()">
                <i class="fas fa-arrow-left"></i> Voltar
            </button>
            
            <div class="header">
                <h1><i class="fas fa-camera"></i> Correção de Prova</h1>
                <p>Posicione o cartão com os 4 cantos pretos visíveis</p>
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Carregando prova...</p>
            </div>
            
            <div id="conteudo" style="display: none;">
                <div id="provaInfo" style="background:#f8fafc;padding:15px;border-radius:12px;margin-bottom:15px"></div>
                <div id="gabaritoInfo" style="background:#f8fafc;padding:15px;border-radius:12px;margin-bottom:15px"></div>
                
                <select id="selectAluno">
                    <option value="">Selecione o aluno</option>
                </select>
                
                <div class="camera-container" id="cameraContainer">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <div class="overlay">
                        <div class="canto top-left" id="cantoTL"></div>
                        <div class="canto top-right" id="cantoTR"></div>
                        <div class="canto bottom-left" id="cantoBL"></div>
                        <div class="canto bottom-right" id="cantoBR"></div>
                        <div class="feedback" id="feedback">📏 Aguardando cartão</div>
                    </div>
                </div>
                
                <div style="text-align: center; margin: 10px 0;">
                    <button class="btn-camera" id="btnIniciar"><i class="fas fa-camera"></i> Iniciar Câmera</button>
                    <button class="btn-capturar" id="btnCapturar" disabled><i class="fas fa-camera-retro"></i> Capturar</button>
                </div>
                
                <div id="processando" style="display: none; text-align: center; padding: 20px;">
                    <div class="spinner"></div>
                    <p id="processandoMsg">Processando...</p>
                </div>
                
                <div id="resultado" style="display: none;">
                    <div id="respostasGrid" class="respostas-grid"></div>
                    <div id="notaFinal" class="nota-final"></div>
                    <button class="btn-salvar" id="btnSalvar"><i class="fas fa-save"></i> Salvar Nota</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="info-bar" id="infoBar">🔍 Aguardando</div>
    <div class="log-panel" id="logPanel">
        <strong>📋 LOG:</strong><br>
        <div id="logContent"></div>
    </div>
    
    <script>
        // ============================================
        // FUNÇÃO DE LOG
        // ============================================
        function addLog(msg) {
            console.log(msg);
            const logDiv = document.getElementById('logContent');
            if (logDiv) {
                const time = new Date().toLocaleTimeString();
                logDiv.innerHTML = `<div>[${time}] ${msg}</div>` + logDiv.innerHTML;
                if (logDiv.children.length > 20) {
                    logDiv.removeChild(logDiv.lastChild);
                }
            }
        }
        
        // Mostrar painel de log em caso de erro
        function mostrarLogPanel() {
            const panel = document.getElementById('logPanel');
            if (panel) panel.style.display = 'block';
        }
        
        // ============================================
        // CONFIGURAÇÃO SIMPLIFICADA
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const provaId = urlParams.get('prova');
        const urlToken = urlParams.get('token');
        let authToken = urlToken || localStorage.getItem('auth_token');
        
        addLog(`🔑 Token: ${authToken ? 'Presente' : 'Ausente'}`);
        addLog(`📝 Prova ID: ${provaId || 'Não informado'}`);
        
        if (!authToken) {
            window.location.href = `/login.html?redirect=${encodeURIComponent(window.location.href)}`;
        }
        
        if (urlToken && !localStorage.getItem('auth_token')) {
            localStorage.setItem('auth_token', urlToken);
            addLog('✅ Token salvo no localStorage');
        }
        
        // ============================================
        // DETECTOR SIMPLES DOS 4 CANTOS PRETOS
        // ============================================
        class DetectorSimples {
            constructor() {
                this.cantos = { tl: false, tr: false, bl: false, br: false };
                this.estavel = 0;
            }
            
            detectar(ctx, width, height) {
                const margem = Math.min(width, height) * 0.08;
                const tamanho = Math.min(50, width * 0.1);
                
                const areas = {
                    tl: { x: margem, y: margem, w: tamanho, h: tamanho },
                    tr: { x: width - margem - tamanho, y: margem, w: tamanho, h: tamanho },
                    bl: { x: margem, y: height - margem - tamanho, w: tamanho, h: tamanho },
                    br: { x: width - margem - tamanho, y: height - margem - tamanho, w: tamanho, h: tamanho }
                };
                
                const resultados = {};
                let brilhoMedio = 0;
                let amostras = 0;
                
                for (const [canto, area] of Object.entries(areas)) {
                    try {
                        const imgData = ctx.getImageData(area.x, area.y, area.w, area.h);
                        let pixelsEscuros = 0;
                        let totalPixels = area.w * area.h;
                        let somaBrilho = 0;
                        
                        for (let i = 0; i < imgData.data.length; i += 4) {
                            const brilho = (imgData.data[i] + imgData.data[i+1] + imgData.data[i+2]) / 3;
                            somaBrilho += brilho;
                            if (brilho < 70) pixelsEscuros++;
                        }
                        
                        const percentualEscuro = (pixelsEscuros / totalPixels) * 100;
                        const brilhoArea = somaBrilho / totalPixels;
                        brilhoMedio += brilhoArea;
                        amostras++;
                        
                        resultados[canto] = percentualEscuro > 8;
                        
                    } catch(e) {
                        resultados[canto] = false;
                    }
                }
                
                brilhoMedio = amostras > 0 ? brilhoMedio / amostras : 100;
                const todosDetectados = resultados.tl && resultados.tr && resultados.bl && resultados.br;
                
                if (todosDetectados) {
                    this.estavel++;
                } else {
                    this.estavel = Math.max(0, this.estavel - 1);
                }
                
                return {
                    sucesso: todosDetectados,
                    cantos: resultados,
                    estabilidade: this.estavel,
                    iluminacaoOk: brilhoMedio > 50 && brilhoMedio < 220,
                    brilho: Math.round(brilhoMedio)
                };
            }
            
            reset() {
                this.estavel = 0;
                this.cantos = { tl: false, tr: false, bl: false, br: false };
            }
        }
        
        // ============================================
        // VARIÁVEIS
        // ============================================
        let detector = new DetectorSimples();
        let gabarito = [];
        let totalQuestoes = 0;
        let alunos = [];
        let alunoSelecionadoId = null;
        let respostasAtuais = [];
        let notaCalculada = 0;
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let stream = null;
        let analiseInterval = null;
        let capturando = false;
        
        // ============================================
        // FUNÇÕES AUXILIARES
        // ============================================
        async function fetchAuth(url, options = {}) {
            addLog(`🌐 Fetch: ${url}`);
            try {
                const res = await fetch(url, {
                    ...options,
                    headers: { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json', ...options.headers }
                });
                if (res.status === 401) {
                    addLog('❌ Sessão expirada (401)');
                    alert('Sessão expirada');
                    window.location.href = '/login.html';
                    return null;
                }
                addLog(`✅ Resposta ${res.status}`);
                return res;
            } catch (err) {
                addLog(`❌ Erro fetch: ${err.message}`);
                throw err;
            }
        }
        
        function mostrarAlerta(msg, tipo) {
            addLog(`📢 ${tipo}: ${msg}`);
            const alertDiv = document.createElement('div');
            alertDiv.style.cssText = `position:fixed;bottom:20px;left:20px;right:20px;background:${tipo === 'success' ? '#10b981' : '#ef4444'};color:white;padding:12px;border-radius:12px;text-align:center;z-index:10000;`;
            alertDiv.innerHTML = msg;
            document.body.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }
        
        // ============================================
        // ANÁLISE EM TEMPO REAL
        // ============================================
        function analisarFrame() {
            if (!video.videoWidth || !video.videoHeight) return;
            
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const resultado = detector.detectar(ctx, canvas.width, canvas.height);
            
            const cantosEl = {
                tl: document.getElementById('cantoTL'),
                tr: document.getElementById('cantoTR'),
                bl: document.getElementById('cantoBL'),
                br: document.getElementById('cantoBR')
            };
            
            for (const [canto, detectado] of Object.entries(resultado.cantos)) {
                if (detectado) {
                    cantosEl[canto].classList.add('detectado');
                    cantosEl[canto].classList.remove('nao-detectado');
                } else {
                    cantosEl[canto].classList.remove('detectado');
                    cantosEl[canto].classList.add('nao-detectado');
                }
            }
            
            const feedback = document.getElementById('feedback');
            const infoBar = document.getElementById('infoBar');
            
            if (!resultado.iluminacaoOk) {
                feedback.textContent = resultado.brilho < 50 ? '💡 MUITO ESCURO! Aumente a luz' : '☀️ MUITO CLARO! Evite reflexos';
                feedback.style.background = '#ef4444';
                infoBar.innerHTML = `💡 Iluminação: ${resultado.brilho} | Cantos: 0/4`;
            }
            else if (resultado.sucesso) {
                const segundos = Math.ceil((20 - resultado.estabilidade) / 5);
                feedback.textContent = `✅ TODOS OS 4 CANTOS DETECTADOS! ${segundos > 0 ? `Estabilizando ${segundos}s` : 'Capturando...'}`;
                feedback.style.background = '#10b981';
                infoBar.innerHTML = `✅ 4/4 cantos | Estável: ${resultado.estabilidade}/20`;
                
                if (resultado.estabilidade >= 20 && !capturando) {
                    addLog('🎯 Estabilização completa! Iniciando captura...');
                    capturarImagem();
                }
            }
            else {
                const detectados = Object.values(resultado.cantos).filter(Boolean).length;
                feedback.textContent = `🔍 ${detectados}/4 cantos detectados - Ajuste o cartão`;
                feedback.style.background = '#f59e0b';
                infoBar.innerHTML = `🎯 Cantos: ${detectados}/4 | Ilum: ${resultado.brilho}`;
            }
        }
        
        // ============================================
        // CAPTURAR E PROCESSAR
        // ============================================
        async function capturarImagem() {
            if (capturando) {
                addLog('⚠️ Captura já em andamento');
                return;
            }
            if (!alunoSelecionadoId) {
                addLog('❌ Nenhum aluno selecionado');
                mostrarAlerta('Selecione um aluno primeiro!', 'error');
                return;
            }
            
            capturando = true;
            addLog('📸 Iniciando captura de imagem...');
            mostrarAlerta('📸 Capturando imagem...', 'success');
            
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imgData = canvas.toDataURL('image/jpeg', 0.85);
            addLog(`📸 Imagem capturada: ${Math.round(imgData.length / 1024)} KB | ${canvas.width}x${canvas.height}`);
            
            document.getElementById('processando').style.display = 'block';
            document.getElementById('resultado').style.display = 'none';
            document.getElementById('processandoMsg').innerHTML = '📤 Enviando para servidor OMR...';
            
            try {
                const dadosEnvio = {
                    image: imgData,
                    questions: totalQuestoes,
                    choices: 5,
                    gabarito: gabarito.map(g => g.respostaCorreta),
                    threshold: 0.12
                };
                addLog(`📤 Enviando para OMR: ${totalQuestoes} questões, gabarito: ${gabarito.map(g => g.respostaCorreta).join(',')}`);
                
                const response = await fetchAuth('/api/omr/detect', {
                    method: 'POST',
                    body: JSON.stringify(dadosEnvio)
                });
                
                if (!response) {
                    throw new Error('Falha na requisição');
                }
                
                const text = await response.text();
                addLog(`📥 Resposta bruta (primeiros 200 chars): ${text.substring(0, 200)}`);
                
                let data;
                try {
                    data = JSON.parse(text);
                } catch(e) {
                    addLog(`❌ Erro ao parsear JSON: ${e.message}`);
                    throw new Error(`Resposta não é JSON válido: ${text.substring(0, 100)}`);
                }
                
                addLog(`📥 Resposta OMR: success=${data.success}, answers=${data.answers ? data.answers.length : 0}`);
                
                document.getElementById('processando').style.display = 'none';
                
                if (data.success && data.answers && data.answers.length > 0) {
                    addLog(`✅ Respostas detectadas: ${JSON.stringify(data.answers)}`);
                    criarInterfaceRespostas(data.answers);
                    document.getElementById('resultado').style.display = 'block';
                    const detectadas = data.answers.filter(a => a).length;
                    mostrarAlerta(`✅ ${detectadas} de ${totalQuestoes} questões detectadas!`, 'success');
                } else {
                    addLog(`❌ Falha na detecção: ${data.error || 'Erro desconhecido'}`);
                    throw new Error(data.error || 'Falha na detecção');
                }
                
            } catch (error) {
                addLog(`❌ Erro capturarImagem: ${error.message}`);
                mostrarLogPanel();
                document.getElementById('processando').style.display = 'none';
                criarInterfaceManual();
                document.getElementById('resultado').style.display = 'block';
                mostrarAlerta(`⚠️ Erro: ${error.message.substring(0, 100)}. Usando modo manual.`, 'error');
            }
            
            detector.reset();
            capturando = false;
        }
        
        // ============================================
        // INTERFACE DE RESPOSTAS
        // ============================================
        function criarInterfaceRespostas(sugestoes) {
            addLog('🎨 Criando interface com respostas');
            respostasAtuais = [...sugestoes];
            const letras = ['A', 'B', 'C', 'D', 'E'];
            const grid = document.getElementById('respostasGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < totalQuestoes; i++) {
                const div = document.createElement('div');
                div.className = 'resposta-card';
                div.innerHTML = `
                    <strong>Q${i+1}</strong>
                    <div id="resp-${i}" style="font-size:1.5rem;font-weight:bold;margin:5px 0">${sugestoes[i] || '—'}</div>
                    <div>
                        ${letras.map(l => `<button class="btn-opcao" onclick="setResposta(${i}, '${l}')">${l}</button>`).join('')}
                        <button class="btn-opcao" onclick="setResposta(${i}, null)">✗</button>
                    </div>
                    <small>✓ ${gabarito[i]?.respostaCorreta || '?'}</small>
                `;
                grid.appendChild(div);
            }
            atualizarNota();
        }
        
        function criarInterfaceManual() {
            addLog('🎨 Criando interface manual');
            respostasAtuais = new Array(totalQuestoes).fill(null);
            const letras = ['A', 'B', 'C', 'D', 'E'];
            const grid = document.getElementById('respostasGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < totalQuestoes; i++) {
                const div = document.createElement('div');
                div.className = 'resposta-card';
                div.innerHTML = `
                    <strong>Q${i+1}</strong>
                    <div id="resp-${i}" style="font-size:1.5rem;font-weight:bold;margin:5px 0">—</div>
                    <div>
                        ${letras.map(l => `<button class="btn-opcao" onclick="setResposta(${i}, '${l}')">${l}</button>`).join('')}
                        <button class="btn-opcao" onclick="setResposta(${i}, null)">✗</button>
                    </div>
                    <small>✓ ${gabarito[i]?.respostaCorreta || '?'}</small>
                `;
                grid.appendChild(div);
            }
            atualizarNota();
        }
        
        window.setResposta = function(questao, letra) {
            const el = document.getElementById(`resp-${questao}`);
            respostasAtuais[questao] = letra;
            el.innerHTML = letra || '—';
            atualizarNota();
        };
        
        function atualizarNota() {
            let acertos = 0;
            for (let i = 0; i < totalQuestoes; i++) {
                if (respostasAtuais[i] && respostasAtuais[i] === gabarito[i]?.respostaCorreta) {
                    acertos++;
                }
            }
            notaCalculada = (acertos / totalQuestoes) * 10;
            
            document.getElementById('notaFinal').innerHTML = `
                <div style="font-size:2rem;font-weight:bold">${notaCalculada.toFixed(1)} / 10</div>
                <div>${acertos} acertos de ${totalQuestoes} questões</div>
                <div>${notaCalculada >= 6 ? '✅ APROVADO' : '⚠️ REPROVADO'}</div>
            `;
        }
        
        // ============================================
        // SALVAR NOTA
        // ============================================
        async function salvarNota() {
            if (!alunoSelecionadoId) {
                mostrarAlerta('Selecione um aluno!', 'error');
                return;
            }
            
            if (!confirm(`Salvar nota ${notaCalculada.toFixed(1)}?`)) return;
            
            try {
                addLog(`💾 Salvando nota ${notaCalculada.toFixed(1)} para aluno ${alunoSelecionadoId}`);
                const response = await fetchAuth(`/api/professor/provas/${provaId}/nota-manual`, {
                    method: 'POST',
                    body: JSON.stringify({
                        alunoId: alunoSelecionadoId,
                        nota: notaCalculada,
                        observacao: `Corrigido em ${new Date().toLocaleString()}`
                    })
                });
                
                if (response && (await response.json()).success) {
                    addLog('✅ Nota salva com sucesso!');
                    mostrarAlerta('✅ Nota salva!', 'success');
                    setTimeout(() => window.location.reload(), 1500);
                }
            } catch (error) {
                addLog(`❌ Erro ao salvar: ${error.message}`);
                mostrarAlerta('❌ Erro ao salvar', 'error');
            }
        }
        
        // ============================================
        // CARREGAR DADOS DA PROVA
        // ============================================
        async function carregarDados() {
            addLog('📂 Carregando dados da prova...');
            try {
                const res = await fetchAuth(`/api/provas/${provaId}/resultados`);
                if (!res) return;
                const data = await res.json();
                addLog(`📦 Dados recebidos: success=${data.success}`);
                
                if (data.success) {
                    alunos = data.resultados || [];
                    totalQuestoes = data.prova?.quantidadeQuestoes || 0;
                    addLog(`📊 Total de questões: ${totalQuestoes}, Alunos: ${alunos.length}`);
                    
                    const provaRes = await fetchAuth(`/api/provas/${provaId}`);
                    if (provaRes) {
                        const provaData = await provaRes.json();
                        if (provaData.success && provaData.questoes) {
                            const letras = ['A', 'B', 'C', 'D', 'E'];
                            gabarito = provaData.questoes.map((q, i) => ({
                                numero: i + 1,
                                respostaCorreta: letras[q.respostaCorreta]
                            }));
                            addLog(`📋 Gabarito carregado: ${gabarito.map(g => g.respostaCorreta).join(',')}`);
                        }
                    }
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('conteudo').style.display = 'block';
                    
                    document.getElementById('provaInfo').innerHTML = `
                        <strong>📄 ${data.prova?.titulo || 'Prova'}</strong><br>
                        ${totalQuestoes} questões | ${alunos.length} alunos
                    `;
                    
                    document.getElementById('gabaritoInfo').innerHTML = `
                        <strong>📋 Gabarito:</strong><br>
                        ${gabarito.map(g => `${g.numero}:${g.respostaCorreta}`).join(' • ')}
                    `;
                    
                    const select = document.getElementById('selectAluno');
                    select.innerHTML = '<option value="">Selecione o aluno...</option>';
                    alunos.forEach(a => {
                        select.innerHTML += `<option value="${a.alunoId}">${a.alunoNome}</option>`;
                    });
                    select.addEventListener('change', e => {
                        alunoSelecionadoId = e.target.value;
                        addLog(`👤 Aluno selecionado: ${alunoSelecionadoId}`);
                        document.getElementById('resultado').style.display = 'none';
                        detector.reset();
                    });
                    
                    addLog('✅ Dados carregados com sucesso!');
                    mostrarAlerta('✅ Dados carregados! Posicione o cartão', 'success');
                }
            } catch (error) {
                addLog(`❌ Erro carregarDados: ${error.message}`);
                console.error(error);
                document.getElementById('loading').innerHTML = '<p>❌ Erro ao carregar</p>';
            }
        }
        
        // ============================================
        // CÂMERA
        // ============================================
        async function iniciarCamera() {
            addLog('📷 Iniciando câmera...');
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
                
                video.srcObject = stream;
                await video.play();
                addLog(`✅ Câmera iniciada: ${video.videoWidth}x${video.videoHeight}`);
                
                document.getElementById('btnIniciar').disabled = true;
                document.getElementById('btnCapturar').disabled = false;
                
                if (analiseInterval) clearInterval(analiseInterval);
                analiseInterval = setInterval(analisarFrame, 200);
                addLog('🔄 Análise de posição iniciada');
                
            } catch (error) {
                addLog(`❌ Erro ao acessar câmera: ${error.message}`);
                mostrarAlerta('❌ Erro ao acessar câmera', 'error');
            }
        }
        
        function pararCamera() {
            addLog('🛑 Parando câmera...');
            if (analiseInterval) clearInterval(analiseInterval);
            if (stream) stream.getTracks().forEach(t => t.stop());
        }
        
        // ============================================
        // EVENTOS
        // ============================================
        document.getElementById('btnIniciar').addEventListener('click', iniciarCamera);
        document.getElementById('btnCapturar').addEventListener('click', () => {
            addLog('🖱️ Captura manual solicitada');
            if (!alunoSelecionadoId) {
                mostrarAlerta('Selecione um aluno primeiro!', 'error');
                return;
            }
            capturarImagem();
        });
        document.getElementById('btnSalvar').addEventListener('click', salvarNota);
        window.addEventListener('beforeunload', pararCamera);
        
        carregarDados();
    </script>
</body>
</html>
