<!DOCTYPE html>
<html lang="pt-BR">
<head>

        <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sistema de Provas">

    <!-- 🔥 FAVICON LOCAL (NÃO DEPENDE DE INTERNET) -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Correção de Prova OMR - Sistema de Provas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 10px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Modo tela cheia para mobile - INTERFACE MÍNIMA COM ROLAGEM PERMITIDA */
        body.fullscreen-mode {
            padding: 0;
            overflow-y: auto;
            position: relative;
            background: #000;
        }
        body.fullscreen-mode .container {
            max-width: 100%;
            min-height: 100%;
            margin: 0;
        }
        body.fullscreen-mode .card {
            min-height: 100%;
            border-radius: 0;
            padding: 0;
            margin: 0;
            background: #000;
        }
        body.fullscreen-mode .camera-container {
            margin: 0;
            min-height: 100vh;
            border-radius: 0;
            aspect-ratio: 16 / 9;
            width: 100%;
            height: auto;
            min-height: 100vh;
        }
        body.fullscreen-mode .button-group,
        body.fullscreen-mode .header,
        body.fullscreen-mode .modo-selector,
        body.fullscreen-mode .dica,
        body.fullscreen-mode .prova-info,
        body.fullscreen-mode .gabarito-display,
        body.fullscreen-mode .qr-selecionado,
        body.fullscreen-mode .info-bar {
            display: none;
        }
        body.fullscreen-mode .camera-container {
            display: block !important;
        }
        body.fullscreen-mode .feedback {
            display: block !important;
            bottom: 30px;
            font-size: 14px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.7);
            position: fixed;
        }
        body.fullscreen-mode .status-encaixe {
            display: block !important;
            top: 20px;
            font-size: 14px;
            padding: 6px 14px;
            background: rgba(0,0,0,0.7);
            position: fixed;
        }
        body.fullscreen-mode .auto-status {
            display: block !important;
            font-size: 16px;
            padding: 8px 20px;
            position: fixed;
        }
        
        .container { max-width: 950px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { 
            color: #1e3c72; 
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header h1 i { color: #10b981; }
        .header p { font-size: 11px; }
        
        .modo-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 10px 0;
            background: #f1f5f9;
            padding: 5px;
            border-radius: 40px;
        }
        .modo-btn {
            flex: 1;
            padding: 8px 16px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: #64748b;
            font-size: 13px;
        }
        .modo-btn.active {
            background: #1e3c72;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .modo-btn i { margin-right: 6px; }
        
        .qr-scanner-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin: 10px 0;
            position: relative;
            min-height: 250px;
        }
        #qr-reader { width: 100%; border: none; }
        #qr-reader__scan_region { background: #000; min-height: 250px; position: relative; }
        #qr-reader video { width: 100%; height: auto; }
        #qr-alternative-container { width: 100%; min-height: 250px; background: #000; display: none; position: relative; }
        #qr-alternative-video { width: 100%; height: auto; object-fit: cover; }
        #qr-zxing-video { width: 100%; min-height: 250px; background: #000; display: none; object-fit: cover; }
        #quagga-container { width: 100%; min-height: 250px; background: #000; display: none; position: relative; }
        #quagga-canvas { width: 100%; height: auto; }
        .qr-overlay {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px;
            font-size: 10px;
            z-index: 5;
        }
        
        .camera-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            margin: 10px auto;
            width: 100%;
            aspect-ratio: 16 / 9;
            display: none;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(1);
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }
        
        .guia-quadrado {
            position: absolute;
            border: 3px solid #ff4444;
            transition: all 0.2s;
            background: rgba(255,68,68,0.2);
            border-radius: 6px;
            box-sizing: border-box;
            z-index: 10;
        }
        .guia-quadrado.encaixado {
            border-color: #00ff00;
            background: rgba(0,255,0,0.4);
            box-shadow: 0 0 15px #00ff00;
            animation: pulse 0.2s ease-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        
        .retangulo-enquadramento {
            position: absolute;
            border: 3px solid #00ff00;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,255,0,0.5);
            background: rgba(0,255,0,0.1);
        }
        
        .feedback {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            z-index: 20;
            font-family: monospace;
            backdrop-filter: blur(4px);
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.02); opacity: 0.95; }
        .btn-primary { background: #1e3c72; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-secondary { background: #6b7280; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .respostas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 8px;
            margin: 15px 0;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
        }
        .resposta-card {
            text-align: center;
            padding: 8px 4px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            background: white;
            transition: all 0.2s;
        }
        .resposta-card.correta { border-color: #10b981; background: linear-gradient(135deg, #f0fdf4, #dcfce7); }
        .resposta-card.incorreta { border-color: #ef4444; background: linear-gradient(135deg, #fef2f2, #fee2e2); }
        .resposta-card.anulada { border-color: #f59e0b; background: linear-gradient(135deg, #fffbeb, #fef3c7); }
        .resposta-card .questao-num { font-size: 10px; color: #6b7280; margin-bottom: 4px; }
        .resposta-card .resposta-valor { font-size: 1.4rem; font-weight: bold; margin: 4px 0; }
        .resposta-card .resposta-valor.anulada { color: #f59e0b; font-size: 1rem; }
        .btn-opcao {
            width: 30px;
            padding: 4px;
            background: #f3f4f6;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            margin: 1px;
            font-weight: bold;
            font-size: 10px;
        }
        .btn-opcao:hover { background: #e5e7eb; transform: scale(1.05); }
        .nota-final {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border-radius: 16px;
            margin-top: 15px;
        }
        .nota-final h2 { font-size: 2rem; margin-bottom: 5px; }
        .nota-final .aprovado { color: #10b981; }
        .nota-final .reprovado { color: #f97316; }
        .loading { text-align: center; padding: 30px; }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #e5e7eb;
            border-top-color: #1e3c72;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 13px;
            margin: 10px 0;
            background: white;
            cursor: pointer;
        }
        
        .info-bar {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #10b981;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 9px;
            font-family: monospace;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        
        .gabarito-display {
            background: #f8fafc;
            padding: 8px;
            border-radius: 10px;
            margin: 8px 0;
            font-family: monospace;
            font-size: 10px;
            overflow-x: auto;
            text-align: center;
            border: 1px solid #e5e7eb;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0 8px;
            flex-wrap: wrap;
        }
        
        .dica {
            background: linear-gradient(135deg, #e8f0fe, #d9e6f5);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 11px;
            text-align: center;
            margin-top: 10px;
            color: #1e3c72;
        }
        
        .status-encaixe {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: bold;
            font-family: monospace;
            z-index: 20;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
        }
        
        .prova-info {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }
        .prova-info h3 { font-size: 14px; margin-bottom: 5px; }
        .prova-info p { font-size: 11px; }
        
        .btn-salvar {
            background: linear-gradient(135deg, #10b981, #059669);
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            font-size: 14px;
        }
        
        .btn-tentar-novamente {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            font-size: 13px;
        }
        
        .aluno-selector { margin: 10px 0; }
        .aluno-selector label { font-weight: 600; color: #374151; margin-bottom: 5px; display: block; font-size: 12px; }
        
        .auto-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 6px 15px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
            color: #ffaa00;
            z-index: 25;
            white-space: nowrap;
            font-family: monospace;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        
        .qr-selecionado {
            background: linear-gradient(135deg, #10b981, #059669);
            padding: 8px 12px;
            border-radius: 10px;
            margin: 8px 0;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
            font-size: 12px;
        }
        .qr-selecionado.ja-corrigido {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        
        .btn-limpar-qr {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
        }
        
        .modo-indicador {
            position: fixed;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 9px;
            font-family: monospace;
            z-index: 10000;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        
        /* Dica de rolagem */
        .scroll-dica {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #ffaa00;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-family: monospace;
            z-index: 1000;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        /* Modal de confirmação */
        .modal-confirmacao {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 300px;
            text-align: center;
            animation: modalSlide 0.3s ease-out;
        }
        @keyframes modalSlide {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-content h3 { margin-bottom: 10px; color: #f59e0b; }
        .modal-content p { margin-bottom: 20px; font-size: 14px; color: #374151; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .modal-buttons button {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-confirmar { background: #10b981; color: white; }
        .btn-cancelar { background: #ef4444; color: white; }
        
        @media (max-width: 768px) {
            .btn { padding: 8px 14px; font-size: 12px; }
            .feedback { font-size: 10px; padding: 4px 10px; }
            .status-encaixe { font-size: 10px; padding: 3px 8px; letter-spacing: 1px; }
            .guia-quadrado { border-width: 2px !important; }
            .header h1 { font-size: 1.1rem; }
            .card { padding: 12px; }
        }
        
        @media (max-width: 480px) {
            .respostas-grid { grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); }
            .btn-opcao { width: 28px; font-size: 9px; }
            .resposta-card .resposta-valor { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1><i class="fas fa-robot"></i> Correção</h1>
                <p><strong style="color:#ff4444;">🔴 Alinhe os 4 quadrados vermelhos</strong></p>
            </div>
            
            <div class="modo-selector">
                <button class="modo-btn active" id="modoQRCodeBtn">
                    <i class="fas fa-qrcode"></i> QR
                </button>
                <button class="modo-btn" id="modoManualBtn">
                    <i class="fas fa-hand-pointer"></i> Manual
                </button>
            </div>
            
            <div class="dica" id="dicaModo">
                <i class="fas fa-qrcode"></i> Escaneie o QR Code
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Carregando...</p>
            </div>
            
            <div id="conteudo" style="display: none;">
                <div id="provaInfo" class="prova-info"></div>
                <div id="gabaritoInfo" class="gabarito-display"></div>
                
                <div id="qrScannerArea" style="display: block;">
                    <div class="qr-scanner-container" id="qrContainer">
                        <div id="qr-reader" style="width: 100%;"></div>
                        <div id="qr-alternative-container">
                            <video id="qr-alternative-video" autoplay playsinline muted></video>
                            <canvas id="qr-alternative-canvas" style="display: none;"></canvas>
                        </div>
                        <video id="qr-zxing-video" autoplay playsinline muted></video>
                        <div id="quagga-container">
                            <canvas id="quagga-canvas"></canvas>
                        </div>
                        <div class="qr-overlay">
                            <i class="fas fa-qrcode"></i> Aponte para o QR Code
                        </div>
                    </div>
                </div>
                
                <div id="manualSelectArea" style="display: none;">
                    <div class="aluno-selector">
                        <label><i class="fas fa-user-graduate"></i> Aluno:</label>
                        <select id="selectAluno">
                            <option value="">— Selecione —</option>
                        </select>
                    </div>
                </div>
                
                <div id="qrSelecionado" style="display: none;" class="qr-selecionado">
                    <div>
                        <i class="fas fa-check-circle"></i>
                        <strong id="qrAlunoNome">Aluno</strong>
                        <span id="qrAlunoMatricula" style="font-size: 10px;"></span>
                    </div>
                    <button class="btn-limpar-qr" id="btnLimparQR">
                        <i class="fas fa-times"></i> Trocar
                    </button>
                </div>
                
                <div class="camera-container" id="cameraContainer">
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <div class="overlay" id="overlay">
                        <div class="guia-quadrado" id="guiaTL"></div>
                        <div class="guia-quadrado" id="guiaTR"></div>
                        <div class="guia-quadrado" id="guiaBL"></div>
                        <div class="guia-quadrado" id="guiaBR"></div>
                        <div class="feedback" id="feedback">🎯 Alinhe</div>
                        <div class="status-encaixe" id="statusEncaixe">⬜ ⬜ ⬜ ⬜</div>
                        <div id="autoStatus" class="auto-status" style="display: none;"></div>
                    </div>
                </div>
                
                <div class="button-group">
                    <button class="btn btn-primary" id="btnIniciarCamera" disabled><i class="fas fa-camera"></i> Iniciar</button>
                    <button class="btn btn-success" id="btnCapturar" disabled><i class="fas fa-camera-retro"></i> Corrigir</button>
                </div>
                
                <div id="processando" style="display: none; text-align: center; padding: 15px;">
                    <div class="spinner"></div>
                    <p style="font-size:12px; color:#1e3c72; margin-top:8px;">Processando...</p>
                </div>
                
                <div id="resultado" style="display: none;">
                    <h3 style="font-size:16px; margin:10px 0 8px; color:#1e3c72; text-align:center;">
                        <i class="fas fa-check-circle" style="color:#10b981;"></i> Resultado
                    </h3>
                    <div id="respostasGrid" class="respostas-grid"></div>
                    <div id="notaFinal" class="nota-final"></div>
                    <button class="btn btn-salvar" id="btnSalvar"><i class="fas fa-save"></i> Salvar</button>
                    <button class="btn btn-warning btn-tentar-novamente" id="btnTentarNovamente">
                        <i class="fas fa-redo-alt"></i> Nova tentativa
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="info-bar" id="infoBar">
        <i class="fas fa-circle" style="color:#10b981; font-size:8px;"></i> Aguardando
    </div>
    
    <div id="modoIndicador" class="modo-indicador">🔍 CARREGANDO...</div>
    
    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const modoIndicador = document.getElementById('modoIndicador');
        
        let modoFullscreen = false;
        let dicaScroll = null;
        
        if (isMobile) {
            modoIndicador.className = 'modo-indicador mobile';
            modoIndicador.innerHTML = '📱 MOBILE';
        } else {
            modoIndicador.className = 'modo-indicador desktop';
            modoIndicador.innerHTML = '💻 DESKTOP';
        }
        
        // Mostrar dica de rolagem
        function mostrarDicaScroll() {
            if (dicaScroll) dicaScroll.remove();
            dicaScroll = document.createElement('div');
            dicaScroll.className = 'scroll-dica';
            dicaScroll.innerHTML = '<i class="fas fa-arrows-alt-v"></i> Deslize para alinhar o cartão';
            document.body.appendChild(dicaScroll);
            setTimeout(() => {
                if (dicaScroll) dicaScroll.style.opacity = '0';
                setTimeout(() => { if (dicaScroll) dicaScroll.remove(); }, 500);
            }, 4000);
        }

        async function iniciarScannerHtml5QrCode() {
            return new Promise(async (resolve, reject) => {

                    if (qrScanner) { try { await qrScanner.stop(); } catch(e) {} }
                    const container = document.getElementById('qr-reader');

                    const html5QrCode = new Html5Qrcode("qr-reader");
                    qrScanner = html5QrCode;
                    const timeout = setTimeout(() => { reject(new Error('Timeout')); }, 15000);
                    await html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 280, height: 280 }, aspectRatio: 1.0, videoConstraints: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } }, (decodedText) => { clearTimeout(timeout); console.log('✅ QR Code:', decodedText); processarQRCode(decodedText); resolve(); }, (errorMessage) => {});
                    clearTimeout(timeout);
                    resolve();
                } catch (err) { reject(err); }
            });
        }
        
        async function iniciarScannerJsQR() {
            return new Promise(async (resolve, reject) => {
                try {
                    if (qrScanner && scannerIniciado) { try { await qrScanner.stop(); } catch(e) {} }
                    const container = document.getElementById('qr-reader');
                    const altContainer = document.getElementById('qr-alternative-container');
                    const zxingVideo = document.getElementById('qr-zxing-video');
                    const quaggaContainer = document.getElementById('quagga-container');
                    container.style.display = 'none';
                    altContainer.style.display = 'block';
                    if (zxingVideo) zxingVideo.style.display = 'none';
                    if (quaggaContainer) quaggaContainer.style.display = 'none';
                    const altVideo = document.getElementById('qr-alternative-video');
                    const altCanvas = document.getElementById('qr-alternative-canvas');
                    const ctx = altCanvas.getContext('2d');
                    alternativeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    altVideo.srcObject = alternativeStream;
                    await new Promise((resolveVideo) => { altVideo.onloadedmetadata = () => { altVideo.play(); altCanvas.width = altVideo.videoWidth; altCanvas.height = altVideo.videoHeight; resolveVideo(); }; });
                    scannerAlternativoAtivo = true;
                    const timeout = setTimeout(() => { if (scannerAlternativoAtivo) reject(new Error('Timeout')); }, 30000);
                    function scanFrame() {
                        if (!scannerAlternativoAtivo) return;
                        if (altVideo.readyState === altVideo.HAVE_ENOUGH_DATA) {
                            ctx.drawImage(altVideo, 0, 0, altCanvas.width, altCanvas.height);
                            const imageData = ctx.getImageData(0, 0, altCanvas.width, altCanvas.height);
                            const code = window.jsQR(imageData.data, altCanvas.width, altCanvas.height, { inversionAttempts: "dontInvert" });
                            if (code) { clearTimeout(timeout); console.log('✅ QR Code (jsQR):', code.data); processarQRCode(code.data); pararScannerJsQR(); resolve(); return; }
                        }
                        requestAnimationFrame(scanFrame);
                    }
                    scanFrame();
                } catch (err) { reject(err); }
            });
        }
        
        async function iniciarScannerZXing() {
            return new Promise(async (resolve, reject) => {
                try {
                    if (qrScanner && scannerIniciado) { try { await qrScanner.stop(); } catch(e) {} }
                    pararScannerJsQR();
                    const container = document.getElementById('qr-reader');
                    const altContainer = document.getElementById('qr-alternative-container');

                    zxingVideo.style.display = 'block';
                    if (quaggaContainer) quaggaContainer.style.display = 'none';
                    if (!window.ZXing) { reject(new Error('ZXing não carregado')); return; }
                    const codeReader = new ZXing.BrowserQRCodeReader();
                    zxingReader = codeReader;
                    const timeout = setTimeout(() => { reject(new Error('Timeout')); }, 30000);
                    codeReader.decodeFromVideoDevice(null, 'qr-zxing-video', (result, err) => { if (result) { clearTimeout(timeout); console.log('✅ QR Code (ZXing):', result.text); processarQRCode(result.text); codeReader.reset(); resolve(); } });
                } catch (err) { reject(err); }
            });
        }
        
        async function iniciarScannerQuagga() {
            return new Promise(async (resolve, reject) => {
                try {
                    if (qrScanner && scannerIniciado) { try { await qrScanner.stop(); } catch(e) {} }
                    pararScannerJsQR();
                    if (zxingReader) { try { zxingReader.reset(); } catch(e) {} }
                    const container = document.getElementById('qr-reader');
                    const altContainer = document.getElementById('qr-alternative-container');
                    const zxingVideo = document.getElementById('qr-zxing-video');
                    const quaggaContainer = document.getElementById('quagga-container');
                    container.style.display = 'none';
                    if (altContainer) altContainer.style.display = 'none';
                    if (zxingVideo) zxingVideo.style.display = 'none';
                    quaggaContainer.style.display = 'block';
                    if (!window.Quagga) { reject(new Error('Quagga não carregado')); return; }
                    const canvas = document.getElementById('quagga-canvas');
                    canvas.width = 640; canvas.height = 480;
                    const timeout = setTimeout(() => { reject(new Error('Timeout')); }, 30000);

        function atualizarPosicaoGuias(containerWidth, containerHeight, imageWidth, imageHeight) {
            let margemHorPx = Math.min(containerWidth, containerHeight) * margemHorizontal;
            let margemVerPx = Math.min(containerWidth, containerHeight) * margemVertical;
            let tamanhoPx = Math.min(containerWidth, containerHeight) * tamanhoGuia;
            
            const guias = [
                { id: 'guiaTL', left: margemHorPx, top: margemVerPx },
                { id: 'guiaTR', left: containerWidth - margemHorPx - tamanhoPx, top: margemVerPx },
                { id: 'guiaBL', left: margemHorPx, top: containerHeight - margemVerPx - tamanhoPx },
                { id: 'guiaBR', left: containerWidth - margemHorPx - tamanhoPx, top: containerHeight - margemVerPx - tamanhoPx }
            ];
            
            for (const guia of guias) {
                const el = document.getElementById(guia.id);
                if (el) {
                    el.style.left = guia.left + 'px';
                    el.style.top = guia.top + 'px';
                    el.style.width = tamanhoPx + 'px';
                    el.style.height = tamanhoPx + 'px';
                }
            }
        }
        
        function detectarQuadradosPretos(ctx, width, height) {
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;
            let sensibilidadeAjustada = sensibilidade;
            let brilhoMaxAjustado = BRILHO_MAX_PRETO;
            
            let margemHorPx = Math.min(width, height) * margemHorizontal;
            let margemVerPx = Math.min(width, height) * margemVertical;
            let tamanhoPx = Math.min(width, height) * tamanhoGuia;
            
            const areas = [
                { nome: 'TL', x: margemHorPx, y: margemVerPx, w: tamanhoPx, h: tamanhoPx, elemento: document.getElementById('guiaTL'), posicao: 0 },
                { nome: 'TR', x: width - margemHorPx - tamanhoPx, y: margemVerPx, w: tamanhoPx, h: tamanhoPx, elemento: document.getElementById('guiaTR'), posicao: 1 },
                { nome: 'BL', x: margemHorPx, y: height - margemVerPx - tamanhoPx, w: tamanhoPx, h: tamanhoPx, elemento: document.getElementById('guiaBL'), posicao: 2 },
                { nome: 'BR', x: width - margemHorPx - tamanhoPx, y: height - margemVerPx - tamanhoPx, w: tamanhoPx, h: tamanhoPx, elemento: document.getElementById('guiaBR'), posicao: 3 }
            ];
            let todosDetectados = true;
            for (const area of areas) {
                try {
                    let pixelsEscuros = 0;
                    let totalPixels = area.w * area.h;
                    for (let y = 0; y < area.h; y++) { for (let x = 0; x < area.w; x++) { const px = Math.floor(area.x + x); const py = Math.floor(area.y + y); if (px >= 0 && px < width && py >= 0 && py < height) { const idx = (py * width + px) * 4; const brilho = (data[idx] + data[idx+1] + data[idx+2]) / 3; if (brilho < brilhoMaxAjustado) pixelsEscuros++; } } }
                    const percentualEscuro = (pixelsEscuros / totalPixels) * 100;
                    const detectado = percentualEscuro > sensibilidadeAjustada;
                    if (!detectado) todosDetectados = false;
                    if (detectado) { if (!area.elemento.classList.contains('encaixado')) area.elemento.classList.add('encaixado'); quadradosEncaixados[area.posicao] = true; } else { area.elemento.classList.remove('encaixado'); quadradosEncaixados[area.posicao] = false; }
                } catch(e) { todosDetectados = false; area.elemento?.classList.remove('encaixado'); quadradosEncaixados[area.posicao] = false; }
            }
            const statusEl = document.getElementById('statusEncaixe');
            const icons = quadradosEncaixados.map(e => e ? '⬛' : '⬜').join(' ');
            statusEl.innerHTML = icons;
            if (quadradosEncaixados.every(e => e === true)) { statusEl.style.background = 'rgba(0,255,0,0.9)'; statusEl.style.color = '#000'; } else { statusEl.style.background = 'rgba(0,0,0,0.8)'; statusEl.style.color = '#fff'; }
            const todosEncaixados = quadradosEncaixados.every(e => e === true);
            let retangulo = null;
            if (todosEncaixados) { 
                retangulo = { 
                    x: margemHorPx, 
                    y: margemVerPx, 
                    width: width - (margemHorPx * 2), 
                    height: height - (margemVerPx * 2) 
                }; 
            }
            return { sucesso: todosEncaixados, retangulo: retangulo, encaixados: [...quadradosEncaixados] };
        }
        
        function desenharRetanguloCartao(retangulo, overlayWidth, overlayHeight, canvasWidth, canvasHeight) {
            const rectGuide = document.getElementById('rectGuide');
            if (!retangulo) { if (rectGuide) rectGuide.style.display = 'none'; return; }
            const scaleX = overlayWidth / canvasWidth;
            const scaleY = overlayHeight / canvasHeight;
            let guide = rectGuide;
            if (!guide) { guide = document.createElement('div'); guide.id = 'rectGuide'; guide.className = 'retangulo-enquadramento'; document.getElementById('overlay').appendChild(guide); }
            guide.style.left = (retangulo.x * scaleX) + 'px';
            guide.style.top = (retangulo.y * scaleY) + 'px';
            guide.style.width = (retangulo.width * scaleX) + 'px';
            guide.style.height = (retangulo.height * scaleY) + 'px';
            guide.style.display = 'block';
        }
        
        let ultimoRetangulo = null;
        
        function iniciarCorrecaoAutomatica() {
            if (autoCorrectionTimer) return;
            if (capturaRealizada) return;
            autoCorrectionCountdown = 5;
            autoStatusDiv.style.display = 'block';
            autoStatusDiv.innerHTML = `📸 ${autoCorrectionCountdown}s`;
            autoCorrectionTimer = setInterval(() => {
                autoCorrectionCountdown--;
                if (autoCorrectionCountdown > 0) { autoStatusDiv.innerHTML = `📸 ${autoCorrectionCountdown}s`; } else { clearInterval(autoCorrectionTimer); autoCorrectionTimer = null; autoStatusDiv.style.display = 'none'; if (!capturaRealizada) { capturaRealizada = true; capturarImagem(); } }
            }, 1000);
        }
        
        function cancelarCorrecaoAutomatica() { if (autoCorrectionTimer) { clearInterval(autoCorrectionTimer); autoCorrectionTimer = null; } autoStatusDiv.style.display = 'none'; }
        
        function analisarFrame() {
            if (!video.videoWidth || !video.videoHeight) return;
            if (capturaRealizada) return;
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const container = document.getElementById('cameraContainer');
            const containerRect = container.getBoundingClientRect();
            atualizarPosicaoGuias(containerRect.width, containerRect.height, canvas.width, canvas.height);
            const resultado = detectarQuadradosPretos(ctx, canvas.width, canvas.height);
            const feedback = document.getElementById('feedback');
            const infoBar = document.getElementById('infoBar');
            const encaixadosCount = resultado.encaixados.filter(e => e).length;
            if (resultado.sucesso && resultado.retangulo) {
                if (ultimoRetangulo && Math.abs(ultimoRetangulo.x - resultado.retangulo.x) < 20 && Math.abs(ultimoRetangulo.y - resultado.retangulo.y) < 20) { estabilidade++; } else { estabilidade = Math.max(0, estabilidade - 1); cancelarCorrecaoAutomatica(); }
                ultimoRetangulo = resultado.retangulo;
                retanguloAtual = resultado.retangulo;
                const containerRect2 = document.getElementById('cameraContainer').getBoundingClientRect();
                desenharRetanguloCartao(resultado.retangulo, containerRect2.width, containerRect2.height, canvas.width, canvas.height);
                const estabilidadeMinima = 8;
                if (estabilidade >= estabilidadeMinima && !capturaRealizada) {
                    feedback.innerHTML = `✅ ${encaixadosCount}/4`;
                    feedback.style.background = '#10b981';
                    if (!autoCorrectionTimer && !capturando && !capturaRealizada) { iniciarCorrecaoAutomatica(); }
                } else { feedback.innerHTML = `🎯 ${encaixadosCount}/4`; feedback.style.background = '#f59e0b'; cancelarCorrecaoAutomatica(); }
                infoBar.innerHTML = `<i class="fas fa-check-circle"></i> ${encaixadosCount}/4`;
            } else { desenharRetanguloCartao(null); retanguloAtual = null; estabilidade = Math.max(0, estabilidade - 2); ultimoRetangulo = null; cancelarCorrecaoAutomatica(); feedback.innerHTML = `🎯 ${encaixadosCount}/4`; feedback.style.background = '#f59e0b'; infoBar.innerHTML = `<i class="fas fa-camera"></i> ${encaixadosCount}/4`; btnCapturar.disabled = true; }
        }
        
        async function capturarImagem() {
            console.log('📸 Iniciando captura...');
            
            if (capturando) {
                console.log('⚠️ Já está capturando, ignorando...');
                return;
            }
            
            if (!alunoSelecionado) {
                mostrarAlerta('Selecione um aluno primeiro!', 'error');
                capturaRealizada = false;
                return;
            }
            
            if (!retanguloAtual) {
                console.log('⚠️ Nenhum retângulo detectado! Tentando detectar novamente...');
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const resultado = detectarQuadradosPretos(ctx, canvas.width, canvas.height);
                
                if (resultado.sucesso && resultado.retangulo) {
                    retanguloAtual = resultado.retangulo;
                    quadradosEncaixados = resultado.encaixados;
                    estabilidade = 10;
                    console.log('✅ Retângulo detectado na segunda tentativa!', retanguloAtual);
                } else {
                    console.log('❌ Não foi possível detectar o cartão.');
                    mostrarAlerta('Posicione o cartão nos 4 quadrados vermelhos!', 'warning');
                    capturaRealizada = false;
                    return;
                }
            }
            
            const estabilidadeMinima = 8;
            if (estabilidade < estabilidadeMinima) {
                console.log(`⚠️ Estabilidade insuficiente: ${estabilidade}/${estabilidadeMinima}`);
                mostrarAlerta(`Aguarde o cartão estabilizar! (${estabilidade}/${estabilidadeMinima})`, 'warning');
                capturaRealizada = false;
                return;
            }
            
            const quadradosVerdes = quadradosEncaixados.filter(q => q === true).length;
            if (quadradosVerdes < 4) {
                console.log(`⚠️ Apenas ${quadradosVerdes}/4 quadrados estão alinhados`);
                mostrarAlerta(`Alinhe os 4 quadrados! (${quadradosVerdes}/4)`, 'warning');
                capturaRealizada = false;
                return;
            }
            
            capturando = true;
            
            try {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                console.log('📐 Retângulo detectado:', retanguloAtual);
                console.log(`📐 Tamanho original do frame: ${canvas.width}x${canvas.height}`);
                
                let cartaoX = Math.max(0, retanguloAtual.x);
                let cartaoY = Math.max(0, retanguloAtual.y);
                let cartaoW = retanguloAtual.width;
                let cartaoH = retanguloAtual.height;
                
                if (cartaoX + cartaoW > canvas.width) {
                    cartaoW = canvas.width - cartaoX;
                }
                if (cartaoY + cartaoH > canvas.height) {
                    cartaoH = canvas.height - cartaoY;
                }
                
                console.log(`📐 Recorte calculado: x=${cartaoX}, y=${cartaoY}, w=${cartaoW}, h=${cartaoH}`);
                
                if (cartaoW <= 0 || cartaoH <= 0) {
                    console.error('❌ Erro no recorte: dimensões inválidas');
                    mostrarAlerta('Erro ao recortar. Tente aproximar mais o cartão.', 'error');
                    capturando = false;
                    capturaRealizada = false;
                    return;
                }
                
                if (cartaoW < 100 || cartaoH < 100) {
                    console.warn(`⚠️ Recorte muito pequeno: ${cartaoW}x${cartaoH} pixels`);
                    mostrarAlerta('Aproxime mais o cartão da câmera!', 'warning');
                    capturando = false;
                    capturaRealizada = false;
                    return;
                }
                
                console.log('✂️ Executando recorte...');
                const imagemCartao = ctx.getImageData(cartaoX, cartaoY, cartaoW, cartaoH);
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = cartaoW;
                tempCanvas.height = cartaoH;
                tempCanvas.getContext('2d').putImageData(imagemCartao, 0, 0);
                const imgData = tempCanvas.toDataURL('image/jpeg', 0.9);
                
                console.log(`✅ Imagem recortada com sucesso: ${cartaoW}x${cartaoH} pixels`);
                console.log(`📊 Tamanho da imagem base64: ${Math.round(imgData.length / 1024)} KB`);
                
                // OCULTAR A CÂMERA
                pararCamera();
                cameraContainer.style.display = 'none';
                
                if (isMobile && modoFullscreen) {
                    sairTelaCheia();
                }
                
                document.getElementById('processando').style.display = 'block';
                document.getElementById('resultado').style.display = 'none';
                
                const dadosEnvio = {
                    image: imgData,
                    questions: totalQuestoes,
                    choices: 5,
                    gabarito: gabarito.map(g => g.respostaCorreta)
                };
                
                console.log('📤 Enviando imagem recortada para API OMR...');
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                const omrResponse = await fetch(OMR_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosEnvio),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const data = await omrResponse.json();
                
                console.log('📥 Resposta da API:', data);
                
                document.getElementById('processando').style.display = 'none';
                
                if (data.success && data.answers) {
                    criarInterfaceRespostas(data.answers);
                    document.getElementById('resultado').style.display = 'block';
                    btnTentarNovamente.style.display = 'block';
                    mostrarAlerta(`✅ Correção concluída!`, 'success');
                } else {
                    throw new Error(data.error || 'Falha na detecção das respostas');
                }
                
            } catch (error) {
                console.error('❌ Erro na captura:', error);
                document.getElementById('processando').style.display = 'none';
                
                pararCamera();
                cameraContainer.style.display = 'none';
                
                if (isMobile && modoFullscreen) {
                    sairTelaCheia();
                }
                
                if (error.name === 'AbortError') {
                    mostrarAlerta(`⚠️ Tempo limite excedido. Tente novamente.`, 'warning');
                } else {
                    mostrarAlerta(`⚠️ Erro: ${error.message}. Usando modo manual.`, 'warning');
                }
                
                criarInterfaceManual();
                document.getElementById('resultado').style.display = 'block';
                btnTentarNovamente.style.display = 'block';
                
            } finally {
                capturando = false;
                capturaRealizada = true;
                console.log('🏁 Captura finalizada');
            }
        }
        
        // NOVA FUNÇÃO MODIFICADA: Criar interface com suporte a questões anuladas

        // NOVA FUNÇÃO MODIFICADA: Set resposta com suporte a anulação
        function setResposta(questao, letra) {

            if (cards[questao]) {
                const respostaDiv = cards[questao].querySelector('.resposta-valor');

                    if (letra === null) {
                        respostaDiv.innerHTML = '🚫 ANULADA';
                        respostaDiv.classList.add('anulada');
                    } else {
                        respostaDiv.innerHTML = letra || '—';
                        respostaDiv.classList.remove('anulada');
                    }
                }
                const respostaGabarito = gabarito[questao]?.respostaCorreta;
                const isAnulada = letra === null;
                const isCorreta = !isAnulada && letra && letra === respostaGabarito;
                
                if (isAnulada) {
                    cards[questao].className = 'resposta-card anulada';
                } else if (isCorreta) {
                    cards[questao].className = 'resposta-card correta';
                } else if (letra) {
                    cards[questao].className = 'resposta-card incorreta';
                } else {
                    cards[questao].className = 'resposta-card';
                }
            }
            atualizarNota();
        }
        
        // NOVA FUNÇÃO MODIFICADA: Atualizar nota considerando questões anuladas como erradas
        function atualizarNota() {
            let acertos = 0;
            for (let i = 0; i < totalQuestoes; i++) { 
                const resposta = respostasAtuais[i];
                const gab = gabarito[i]?.respostaCorreta;
                // Questão anulada (null) ou vazia conta como errada
                if (resposta && resposta !== null && resposta === gab) {
                    acertos++;
                }
            }
            notaCalculada = (acertos / totalQuestoes) * 10;
            const status = notaCalculada >= 6 ? '✅ APROVADO' : '⚠️ REPROVADO';
            const statusClass = notaCalculada >= 6 ? 'aprovado' : 'reprovado';
            document.getElementById('notaFinal').innerHTML = `<h2>${notaCalculada.toFixed(1)} / 10</h2><p>${acertos} acertos de ${totalQuestoes} questões</p><p class="${statusClass}">${status}</p>`;
        }
        
        async function salvarNota() {
            if (!alunoSelecionado) { mostrarAlerta('Selecione um aluno!', 'error'); return; }
            if (!confirm(`Salvar nota ${notaCalculada.toFixed(1)} para ${alunoSelecionado.nome}?`)) return;
            try {
                const response = await fazerRequisicao(`/api/professor/provas/${provaId}/nota-manual`, { method: 'POST', body: JSON.stringify({ alunoId: alunoSelecionado.id, nota: notaCalculada, observacao: `Corrigido em ${new Date().toLocaleString()}` }) });
                const data = await response.json();
                if (data.success) { 
                    // Marcar que este aluno já foi corrigido
                    resultadosSalvos.set(alunoSelecionado.id, true);
                    qrSelecionadoDiv.classList.add('ja-corrigido');
                    mostrarAlerta(`✅ Nota salva!`, 'success'); 
                    setTimeout(() => { voltarParaScannerQR(); }, 1500);
                } else { 
                    throw new Error(data.error || 'Erro'); 
                }
            } catch (error) { mostrarAlerta(`❌ Erro: ${error.message}`, 'error'); }
        }
        
        function mostrarAlerta(msg, tipo) { const cores = { success: '#10b981', error: '#ef4444', info: '#3b82f6', warning: '#f59e0b' }; const alertDiv = document.createElement('div'); alertDiv.style.cssText = `position:fixed;bottom:20px;left:20px;right:20px;background:${cores[tipo]};color:white;padding:12px;border-radius:16px;text-align:center;z-index:10000;font-weight:bold;font-size:12px;`; alertDiv.innerHTML = `<i class="fas ${tipo === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`; document.body.appendChild(alertDiv); setTimeout(() => alertDiv.remove(), 3000); }
        
        async function fazerRequisicao(url, options = {}) {
            if (!authToken) throw new Error('Token não fornecido');
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000);
            try {
                const response = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`, ...options.headers }, signal: controller.signal });
                clearTimeout(timeoutId);
                if (response.status === 401) throw new Error('Token expirado');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response;
            } catch (error) { clearTimeout(timeoutId); if (error.name === 'AbortError') throw new Error('Tempo limite'); throw error; }
        }
        
        async function carregarDados() {
            if (!provaId) { document.getElementById('loading').innerHTML = '<p style="color:red;">❌ ID da prova não informado</p>'; return; }
            authToken = urlToken || localStorage.getItem('auth_token');
            if (!authToken) { document.getElementById('loading').innerHTML = '<p style="color:red;">❌ Token não informado</p>'; return; }
            try {
                const provaRes = await fazerRequisicao(`/api/provas/${provaId}`);
                const provaData = await provaRes.json();
                if (provaData.success && provaData.prova) {
                    provaInfo = provaData.prova;
                    totalQuestoes = provaInfo.quantidadeQuestoes || 10;
                    if (provaData.questoes) { const letras = ['A', 'B', 'C', 'D', 'E']; gabarito = provaData.questoes.map((q, i) => ({ numero: i+1, respostaCorreta: letras[q.respostaCorreta] })); }
                    let alunosCarregados = false;
                    if (provaInfo.turmaId) { const turmaId = provaInfo.turmaId.$oid || provaInfo.turmaId; alunosCarregados = await carregarAlunosDaTurma(turmaId); }
                    if (!alunosCarregados || alunos.length === 0) alunosCarregados = await carregarAlunosDosResultados();
                    if (!alunosCarregados || alunos.length === 0) alunosCarregados = await carregarAlunosDaProva(provaData);
                    
                    // 🔥 CORREÇÃO: Limpar resultadosSalvos ANTES de recarregar
                    resultadosSalvos.clear();
                    
                    // 🔥 CORREÇÃO: Carregar resultados APENAS da ProvaRealizada (notas manuais)
                    try {
                        const resultadosRes = await fazerRequisicao(`/api/provas/${provaId}/resultados`);
                        const resultadosData = await resultadosRes.json();
                        if (resultadosData.success && resultadosData.resultados) {
                            // 🔥 FILTRAR APENAS resultados com nota MANUAL (ProvaRealizada)
                            const resultadosManuais = resultadosData.resultados.filter(r => 
                                r.origem === 'prova_realizada' || 
                                r.tipoNota === 'manual' ||
                                (r.notaManual !== null && r.notaManual !== undefined)
                            );
                            
                            resultadosManuais.forEach(r => {
                                const alunoId = r.alunoId || r.userId;
                                if (alunoId) {
                                    resultadosSalvos.set(alunoId.toString(), {
                                        temNotaManual: true,
                                        notaManual: r.notaManual,
                                        data: r.notaManualData || r.dataRealizacao
                                    });
                                }
                            });
                            console.log(`📊 ${resultadosSalvos.size} alunos com correção MANUAL (ProvaRealizada)`);
                            console.log('   Alunos:', Array.from(resultadosSalvos.keys()));
                        }
                    } catch (e) { 
                        console.warn('Não foi possível carregar resultados:', e); 
                    }
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('conteudo').style.display = 'block';
                    document.getElementById('provaInfo').innerHTML = `<h3><i class="fas fa-graduation-cap"></i> ${provaInfo.titulo || 'Prova'}</h3><p>${totalQuestoes} questões | ${alunos.length} alunos</p>`;
                    document.getElementById('gabaritoInfo').innerHTML = `<strong><i class="fas fa-key"></i> Gabarito:</strong> ${gabarito.map(g => `${g.numero}:${g.respostaCorreta}`).join(' • ')}`;
                    const select = document.getElementById('selectAluno');
                    select.innerHTML = '<option value="">— Selecione —</option>';
                    alunos.forEach(a => { select.innerHTML += `<option value="${a.alunoId}">${a.alunoNome} ${a.alunoMatricula ? `(${a.alunoMatricula})` : ''}</option>`; });
                    
                    // 🔥 CORREÇÃO: Evento do select com verificação correta
                    select.addEventListener('change', async (e) => {
                        if (e.target.value) { 
                            const aluno = alunos.find(a => a.alunoId === e.target.value); 
                            if (aluno) { 
                                // Verificar se aluno tem correção MANUAL
                                const temCorrecaoManual = resultadosSalvos.has(aluno.alunoId.toString());
                                
                                if (temCorrecaoManual) {
                                    const dadosCorrecao = resultadosSalvos.get(aluno.alunoId.toString());
                                    console.log(`⚠️ Aluno ${aluno.alunoNome} JÁ TEM correção manual: nota ${dadosCorrecao.notaManual}`);
                                    
                                    // Mostrar modal perguntando se deseja prosseguir
                                    mostrarModalConfirmacao(aluno.alunoNome, 
                                        async () => {
                                            // Confirmou - prosseguir com a correção
                                            await continuarSelecaoManual(aluno);
                                        },
                                        () => {
                                            // Cancelou - voltar ao select
                                            mostrarAlerta('Correção cancelada', 'info');
                                            document.getElementById('selectAluno').value = '';
                                            alunoSelecionado = null;
                                            qrSelecionadoDiv.style.display = 'none';
                                            manualSelectArea.style.display = 'block';
                                            btnIniciarCamera.disabled = true;
                                        }
                                    );
                                } else {
                                    // Aluno sem correção manual - prosseguir normalmente
                                    console.log(`✅ Aluno ${aluno.alunoNome} SEM correção manual`);
                                    await continuarSelecaoManual(aluno);
                                }
                            } 
                        } else { 
                            alunoSelecionado = null; 
                            qrSelecionadoDiv.style.display = 'none'; 
                            manualSelectArea.style.display = 'block'; 
                            btnIniciarCamera.disabled = true; 
                        } 
                        document.getElementById('resultado').style.display = 'none'; 
                        btnTentarNovamente.style.display = 'none';
                    });
                    
                    mostrarAlerta(`✅ ${alunos.length} alunos carregados!`, 'success');
                    
                    // URL com aluno específico
                    if (urlAlunoId) { 
                        const alunoPorUrl = alunosMap.get(urlAlunoId); 
                        if (alunoPorUrl) { 
                            alunoSelecionado = { id: alunoPorUrl.alunoId, nome: alunoPorUrl.alunoNome, matricula: alunoPorUrl.alunoMatricula }; 
                            if (qrScanner && scannerIniciado) { try { await qrScanner.stop(); scannerIniciado = false; } catch(e) {} } 
                            qrScannerArea.style.display = 'none'; 
                            qrSelecionadoDiv.style.display = 'flex'; 
                            document.getElementById('qrAlunoNome').textContent = alunoSelecionado.nome; 
                            document.getElementById('qrAlunoMatricula').textContent = alunoSelecionado.matricula ? `Mat: ${alunoSelecionado.matricula}` : ''; 
                            btnIniciarCamera.disabled = false; 
                            
                            // Verificar se já tem correção manual
                            const temCorrecaoManual = resultadosSalvos.has(alunoSelecionado.id);
                            if (temCorrecaoManual) {
                                qrSelecionadoDiv.classList.add('ja-corrigido');
                                mostrarAlerta(`⚠️ ${alunoSelecionado.nome} já possui correção manual!`, 'warning');
                            } else {
                                qrSelecionadoDiv.classList.remove('ja-corrigido');
                                mostrarAlerta(`✅ ${alunoSelecionado.nome}`, 'success');
                            }
                            
                            document.getElementById('infoBar').innerHTML = `<i class="fas fa-user-check"></i> ${alunoSelecionado.nome}`; 
                            setTimeout(() => { if (alunoSelecionado && !stream) { if (isMobile) { entrarTelaCheia(); iniciarCamera(); } else { iniciarCamera(); } } }, 500); 
                        } else { 
                            mostrarAlerta(`⚠️ Aluno não encontrado`, 'warning'); 
                        } 
                    }
                    iniciarQRScanner();
                } else { throw new Error('Erro ao carregar'); }
            } catch (error) { document.getElementById('loading').innerHTML = `<p style="color:red;">❌ Erro: ${error.message}</p>`; console.error('Erro:', error); }
        }
        
        function getVideoConstraints() {
            // Detectar orientação
            const isPortrait = window.innerHeight > window.innerWidth;
            
            // 🔥 CONFIGURAÇÃO FINAL OTIMIZADA PARA MOBILE
            if (isMobile) {
                return {
                    video: { 
                        facingMode: { exact: "environment" }, // Câmera TRASEIRA
                        width: { ideal: 800, max: 1280 },    // Resolução controlada
                        height: { ideal: 600, max: 720 }
                    }
                };
            } else {
                // Desktop
                return {
                    video: { 
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };
            }
        }
        
        async function iniciarCamera() {
            if (!alunoSelecionado) { 
                mostrarAlerta('Selecione um aluno primeiro!', 'error'); 
                return; 
            }
            
            try {
                if (qrScanner && scannerIniciado) { 
                    try { await qrScanner.stop(); scannerIniciado = false; } catch(e) {} 
                }
                
                capturaRealizada = false;
                estabilidade = 0;
                quadradosEncaixados = [false, false, false, false];
                
                const constraints = getVideoConstraints();
                console.log('📷 Iniciando câmera com constraints:', constraints);
                
                stream = await navigator.mediaDevices.getUserMedia(constraints)
                    .catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
                
                video.srcObject = stream;
                await video.play();
                
                // 🔥 ADICIONAR ESTA LINHA - AJUSTE AUTOMÁTICO
                await ajustarCameraMobile();
                
                // 🔥 ADICIONAR ESTA LINHA - FORÇAR ORIENTAÇÃO PAISAGEM
                if (isMobile && window.innerWidth > window.innerHeight) {
                    video.style.width = '100%';
                    video.style.height = '100%';
                    video.style.objectFit = 'cover';
                }
                
                btnIniciarCamera.disabled = true;
                btnIniciarCamera.innerHTML = '<i class="fas fa-camera"></i> Ativa';
                cameraContainer.style.display = 'block';
                
                if (analiseInterval) clearInterval(analiseInterval);
                analiseInterval = setInterval(analisarFrame, 100);
                
                mostrarAlerta('📷 Câmera iniciada! Aponte para o cartão.', 'info');
                
            } catch (error) { 
                console.error('❌ Erro ao acessar câmera:', error);
                mostrarAlerta('❌ Erro ao acessar câmera: ' + error.message, 'error'); 
            }
        }

        // Função para ajustar a câmera automaticamente (chamar após iniciar)
        async function ajustarCameraMobile() {
            if (!isMobile) return;
            
            // Aguardar câmera estabilizar
            await new Promise(r => setTimeout(r, 500));
            
            if (!stream) return;
            
            const track = stream.getVideoTracks()[0];
            if (!track) return;
            
            try {
                // Forçar resolução otimizada
                await track.applyConstraints({
                    width: { ideal: 800, max: 1280 },
                    height: { ideal: 600, max: 720 }
                });
                console.log('✅ Resolução ajustada para 800x600');
            } catch(e) {
                console.log('⚠️ Não foi possível ajustar resolução:', e.message);
            }
            
            // Ajustar zoom se disponível
            const capabilities = track.getCapabilities();
            if (capabilities.zoom) {
                try {
                    await track.applyConstraints({ advanced: [{ zoom: 1.0 }] });
                    console.log('✅ Zoom ajustado para 1.0');
                } catch(e) {}
            }
        }
        
        function pararCamera() { if (analiseInterval) { clearInterval(analiseInterval); analiseInterval = null; } if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } if (autoCorrectionTimer) { clearInterval(autoCorrectionTimer); autoCorrectionTimer = null; } cancelarCorrecaoAutomatica(); }
        
        // 🔥 ADICIONAR EVENTOS DE DUPLO CLIQUE AQUI (DEPOIS QUE TODAS AS VARIÁVEIS FORAM DECLARADAS)
        document.body.addEventListener('dblclick', function(e) {
            // Verificar se está em modo desktop (não mobile)
            if (!isMobile) {
                // Verificar se já tem aluno selecionado
                if (alunoSelecionado) {
                    abrirCameraTelaCheia();
                } else {
                    mostrarAlerta('Selecione um aluno primeiro antes de abrir a câmera!', 'warning');
                }
            }
        });
        
        // 🔥 EVENTO PARA O CONTAINER DA CÂMERA
        cameraContainer.addEventListener('dblclick', function(e) {
            if (!isMobile && alunoSelecionado) {
                e.stopPropagation();
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
                document.body.classList.add('fullscreen-mode');
                mostrarAlerta('🎥 Modo tela cheia ativado!', 'success');
            }
        });

        // 🔥 FUNÇÃO ALTERNAR TELA CHEIA (entrar/sair)
        function alternarTelaCheia() {
            if (!alunoSelecionado) {
                mostrarAlerta('Selecione um aluno primeiro!', 'warning');
                return false;
            }
            
            const elem = document.documentElement;
            
            // Verificar se já está em tela cheia
            const isFullscreen = document.fullscreenElement || 
                                document.webkitFullscreenElement || 
                                document.mozFullScreenElement ||
                                document.msFullscreenElement;
            
            if (isFullscreen) {
                // SAIR da tela cheia
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                document.body.classList.remove('fullscreen-mode');
                mostrarAlerta('🔓 Modo tela cheia desativado', 'info');
                console.log('🖥️ Saindo do modo tela cheia');
            } else {
                // ENTRAR em tela cheia
                console.log('🖥️ Entrando em modo tela cheia');
                
                // Se a câmera não está aberta, inicia primeiro
                if (!stream || cameraContainer.style.display !== 'block') {
                    iniciarCamera().then(() => {
                        setTimeout(() => {
                            if (elem.requestFullscreen) {
                                elem.requestFullscreen();
                            } else if (elem.webkitRequestFullscreen) {
                                elem.webkitRequestFullscreen();
                            } else if (elem.msRequestFullscreen) {
                                elem.msRequestFullscreen();
                            }
                            document.body.classList.add('fullscreen-mode');
                            mostrarAlerta('🎥 Modo tela cheia ativado! (Clique duas vezes para sair)', 'success');
                        }, 500);
                    }).catch(err => {
                        console.error('Erro ao iniciar câmera:', err);
                        mostrarAlerta('❌ Erro ao iniciar câmera', 'error');
                    });
                } else {
                    // Câmera já está aberta, só entra em tela cheia
                    if (elem.requestFullscreen) {
                        elem.requestFullscreen();
                    } else if (elem.webkitRequestFullscreen) {
                        elem.webkitRequestFullscreen();
                    } else if (elem.msRequestFullscreen) {
                        elem.msRequestFullscreen();
                    }
                    document.body.classList.add('fullscreen-mode');
                    mostrarAlerta('🎥 Modo tela cheia ativado! (Clique duas vezes para sair)', 'success');
                }
            }
            return true;
        }
        
        // 🔥 EVENTO DE DUPLO CLIQUE NO CORPO (alterna tela cheia)
        document.body.addEventListener('dblclick', function(e) {
            // Verificar se está em modo desktop (não mobile)
            if (!isMobile) {
                e.preventDefault();
                alternarTelaCheia();
            }
        });
        
        // 🔥 EVENTO DE DUPLO CLIQUE NO CONTAINER DA CÂMERA (alterna tela cheia)
        cameraContainer.addEventListener('dblclick', function(e) {
            if (!isMobile && alunoSelecionado) {
                e.stopPropagation();
                alternarTelaCheia();
            }
        });
        
        // 🔥 ESCUTAR MUDANÇAS NO ESTADO DE TELA CHEIA (para sincronizar a classe)
        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                document.body.classList.remove('fullscreen-mode');
                console.log('🖥️ Tela cheia desativada pelo sistema');
            }
        });
        document.addEventListener('webkitfullscreenchange', function() {
            if (!document.webkitFullscreenElement) {
                document.body.classList.remove('fullscreen-mode');
            }
        });
        document.addEventListener('msfullscreenchange', function() {
            if (!document.msFullscreenElement) {
                document.body.classList.remove('fullscreen-mode');
            }
        });
        
        modoQRBtn.addEventListener('click', () => setModo(true));
        modoManualBtn.addEventListener('click', () => setModo(false));
        document.getElementById('btnIniciarCamera').addEventListener('click', iniciarCamera);
        document.getElementById('btnCapturar').addEventListener('click', () => capturarImagem());
        document.getElementById('btnSalvar').addEventListener('click', salvarNota);
        document.getElementById('btnLimparQR').addEventListener('click', limparQRSelecionado);
        document.getElementById('btnTentarNovamente').addEventListener('click', tentarNovamente);
        
        window.addEventListener('beforeunload', pararCamera);
        window.setResposta = setResposta;
        carregarDados();
    </script>

        <script>
        // ============================================
        // SISTEMA DE ESCALONAMENTO PROPORCIONAL - APENAS MOBILE
        // ============================================
        (function() {
            if (window.innerWidth > 768) {
                console.log('📐 Desktop detectado - escalonamento desativado');
                return;
            }
            
            console.log('📐 Inicializando sistema de escalonamento proporcional (mobile)...');
            
            function calcularEscalaMobile() {
                const width = window.innerWidth;
                const baseWidth = 768;
                let escala = Math.max(0.5, Math.min(1, width / baseWidth));
                
                if (width <= 320) escala = 0.55;
                else if (width <= 360) escala = 0.6;
                else if (width <= 400) escala = 0.65;
                else if (width <= 500) escala = 0.75;
                else if (width <= 600) escala = 0.85;
                else if (width <= 700) escala = 0.95;
                else escala = 1;
                
                return escala;
            }
            
            function aplicarEscalaMobile() {
                if (window.innerWidth > 768) return;
                const escala = calcularEscalaMobile();
                document.documentElement.style.setProperty('--scale-ratio', escala);
                document.documentElement.style.setProperty('--current-width', window.innerWidth);
                console.log(`📐 Mobile: escala ${escala.toFixed(2)} | largura: ${window.innerWidth}px`);
            }
            
            aplicarEscalaMobile();
            
            let timeout;
            window.addEventListener('resize', function() {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    if (window.innerWidth <= 768) {
                        aplicarEscalaMobile();
                    } else {
                        document.documentElement.style.setProperty('--scale-ratio', '1');
                        console.log('📐 Modo desktop - escala resetada');
                    }
                }, 100);
            });
            
            window.addEventListener('orientationchange', function() {
                setTimeout(() => {
                    if (window.innerWidth <= 768) {
                        aplicarEscalaMobile();
                    }
                }, 200);
            });
            
            console.log('✅ Sistema de escalonamento mobile ativo!');
        })();
    </script>
