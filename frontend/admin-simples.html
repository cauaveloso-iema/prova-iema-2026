            aplicarFiltros() {
                const filtros = {
                    busca: document.getElementById('filtroBusca')?.value || '',
                    status: document.getElementById('filtroStatus')?.value || 'todos',
                    tipo: document.getElementById('filtroTipo')?.value || 'todos',
                    professor: document.getElementById('filtroProfessor')?.value || 'todos'
                };
                
                console.log('🔍 Aplicando filtros:', filtros);
                
                // Filtrar as provas
                let filtradas = [...this.provas];
                const agora = new Date();
                
                // Filtro de busca
                if (filtros.busca) {
                    const busca = filtros.busca.toLowerCase();
                    filtradas = filtradas.filter(p => 
                        (p.titulo && p.titulo.toLowerCase().includes(busca)) ||
                        (p.conteudo && p.conteudo.toLowerCase().includes(busca))
                    );
                }
                
                // Filtro de status
                if (filtros.status !== 'todos') {
                    filtradas = filtradas.filter(p => {
                        if (filtros.status === 'rascunho') return !p.publicada && !p.cancelada;
                        if (filtros.status === 'ativa') return p.publicada && !p.cancelada && (!p.dataLimite || new Date(p.dataLimite) > agora);
                        if (filtros.status === 'expirada') return p.publicada && !p.cancelada && p.dataLimite && new Date(p.dataLimite) < agora;
                        if (filtros.status === 'cancelada') return p.cancelada === true;
                        return true;
                    });
                }
                
                // Filtro de tipo
                if (filtros.tipo !== 'todos') {
                    filtradas = filtradas.filter(p => {
                        if (filtros.tipo === 'simples') return !p.adaptada && (!p.tipoProva || p.tipoProva === 'simples');
                        if (filtros.tipo === 'enem') return p.tipoProva === 'enem';
                        if (filtros.tipo === 'adaptada') return p.adaptada === true;
                        return true;
                    });
                }
                
                // Filtro de professor
                if (filtros.professor !== 'todos') {
                    filtradas = filtradas.filter(p => {
                        // Verificar várias possibilidades
                        if (p.professor) {
                            if (typeof p.professor === 'object') {
                                return p.professor.id === filtros.professor || p.professor._id === filtros.professor;
                            }
                            return p.professor === filtros.professor;
                        }
                        if (p.professorId) {
                            return p.professorId === filtros.professor;
                        }
                        return false;
                    });
                }
                
                // Atualizar tabela
                const tabela = document.getElementById('tabelaProvas');
                if (tabela) {
                    tabela.innerHTML = this.gerarLinhasProvas(filtradas);
                }
                
                // Atualizar estatísticas
                this.atualizarStatsFiltros(filtradas);
            }

            // ============ ATUALIZAR ESTATÍSTICAS DOS FILTROS ============
            atualizarStatsFiltros(provas) {
                const agora = new Date();
                
                document.getElementById('statsTotal').textContent = provas.length;
                document.getElementById('statsRascunhos').textContent = provas.filter(p => !p.publicada).length;
                document.getElementById('statsAtivas').textContent = provas.filter(p => 
                    p.publicada && !p.cancelada && (!p.dataLimite || new Date(p.dataLimite) > agora)
                ).length;
                document.getElementById('statsExpiradas').textContent = provas.filter(p => 
                    p.publicada && p.dataLimite && new Date(p.dataLimite) < agora
                ).length;
            }

            // ============ LIMPAR FILTROS ============
            limparFiltros() {
                // Resetar campos
                document.getElementById('filtroBusca').value = '';
                document.getElementById('filtroStatus').value = 'todos';
                document.getElementById('filtroTipo').value = 'todos';
                document.getElementById('filtroProfessor').value = 'todos';
                
                // Recarregar provas
                this.carregarProvas();
            }

            // ============ GERAR LINHAS DA TABELA DE PROVAS ============
            gerarLinhasProvas(provas) {
                if (!provas || provas.length === 0) {
                    return '<tr><td colspan="8" class="empty-state">Nenhuma prova encontrada</td></tr>';
                }

                return provas.map(p => {
                    // Determinar se pode excluir
                    const podeExcluir = (!p.publicada || (p.publicada && p.dataLimite && new Date(p.dataLimite) < new Date())) && !p.cancelada;
                    
                    // Determinar cor e texto do status
                    let statusClass = '';
                    let statusText = '';
                    
                    if (p.cancelada) {
                        statusClass = 'inactive';
                        statusText = 'Cancelada';
                    } else if (!p.publicada) {
                        statusClass = 'pending';
                        statusText = 'Rascunho';
                    } else if (p.dataLimite && new Date(p.dataLimite) < new Date()) {
                        statusClass = 'inactive';
                        statusText = 'Expirada';
                    } else {
                        statusClass = 'active';
                        statusText = 'Ativa';
                    }
                    
                    // Tipo da prova
                    let tipoClass = 'primary';
                    let tipo = 'Simples';
                    
                    if (p.tipoProva === 'enem') {
                        tipoClass = 'info';
                        tipo = 'ENEM';
                    } else if (p.adaptada === true) {
                        tipoClass = 'warning';
                        tipo = 'Adaptada';
                    }

                    return `
                        <tr>
                            <td>
                                <strong>${p.titulo || 'Sem título'}</strong>
                                <br><small style="color: #666;">${p.conteudo?.substring(0, 50) || ''}</small>
                            </td>
                            <td>${this.obterNomeProfessor(p)}</td>
                            <td>${p.turma?.nome || p.turma || '-'}</td>
                            <td>
                                <span class="status-badge ${tipoClass}">${tipo}</span>
                            </td>
                            <td>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </td>
                            <td>${p.quantidadeQuestoes || 0}</td>
                            <td>
                                <div style="text-align: center;">
                                    <strong>${p.totalParticipantes || p.alunosRealizaram || 0}</strong>
                                    <br><small style="color: #666;">alunos</small>
                                </div>
                            </td>
                            <td>
                                <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                                    <!-- Botão Ver Detalhes -->
                                    <button class="btn-icon" style="background: #3498db; color: white;" 
                                            onclick="adminSimples.verDetalhesProva('${p.id}')" 
                                            title="Ver detalhes">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    
                                    <!-- Botão Ver Questões -->
                                    <button class="btn-icon" style="background: #9b59b6; color: white;" 
                                            onclick="adminSimples.visualizarQuestoes('${p.id}')" 
                                            title="Ver questões">
                                        <i class="fas fa-question-circle"></i>
                                    </button>
                                    
                                    <!-- Botão Ver Resultados (só para provas publicadas) -->
                                    ${p.publicada ? `
                                    <button class="btn-icon" style="background: #27ae60; color: white;" 
                                            onclick="adminSimples.verResultadosProva('${p.id}')" 
                                            title="Ver resultados">
                                        <i class="fas fa-chart-bar"></i>
                                    </button>
                                    ` : ''}
                                    
                                    <!-- Botão Publicar (só para rascunhos) -->
                                    ${!p.publicada && !p.cancelada ? `
                                    <button class="btn-icon" style="background: #f39c12; color: white;" 
                                            onclick="adminSimples.publicarProva('${p.id}')" 
                                            title="Publicar prova">
                                        <i class="fas fa-paper-plane"></i>
                                    </button>
                                    ` : ''}
                                    
                                    <!-- 🔥 NOVO BOTÃO EDITAR - ADICIONADO AQUI -->
                                    <button class="btn-icon" style="background: #f1c40f; color: white;" 
                                            onclick="adminSimples.editarProvaSimples('${p.id}')" 
                                            title="Editar prova">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    
                                    <!-- Botão Adiar (só para provas ativas) -->
                                    ${p.publicada && !p.cancelada && p.dataLimite && new Date(p.dataLimite) > new Date() ? `
                                    <button class="btn-icon" style="background: #e67e22; color: white;" 
                                            onclick="adminSimples.adiarProva('${p.id}')" 
                                            title="Adiar data">
                                        <i class="fas fa-calendar-plus"></i>
                                    </button>
                                    ` : ''}
                                    
                                    <!-- Botão Excluir -->
                                    ${podeExcluir ? `
                                    <button class="btn-icon" style="background: #e74c3c; color: white;" 
                                            onclick="adminSimples.excluirProva('${p.id}')" 
                                            title="Excluir prova">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                    ` : ''}
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

            // ============ OBTER NOME DO PROFESSOR ============
            obterNomeProfessor(prova) {
                // Verificar campo professor (objeto)
                if (prova.professor) {
                    if (typeof prova.professor === 'object') {
                        return prova.professor.nome || prova.professor.name || 'Não informado';
                    }
                    return prova.professor;
                }
                
                // Verificar campo professorNome (string direta)
                if (prova.professorNome) {
                    return prova.professorNome;
                }
                
                // Verificar professorId e buscar na lista de usuários
                if (prova.professorId && this.usuarios && this.usuarios.length > 0) {
                    const prof = this.usuarios.find(u => u._id === prova.professorId || u.id === prova.professorId);
                    if (prof) {
                        return prof.nome;
                    }
                }
                
                // Verificar userId (às vezes o professor está aqui)
                if (prova.userId) {
                    if (typeof prova.userId === 'object') {
                        return prova.userId.nome || 'Não informado';
                    }
                    if (this.usuarios && this.usuarios.length > 0) {
                        const prof = this.usuarios.find(u => u._id === prova.userId || u.id === prova.userId);
                        if (prof) {
                            return prof.nome;
                        }
                    }
                }
                
                return 'Não informado';
            }
            
            // ============ EXCLUIR PROVA ============
            async excluirProva(id) {
                console.log('🗑️ excluirProva chamado com ID:', id);
                
                const prova = this.provas.find(p => p.id === id);
                if (!prova) {
                    this.showToast('❌ Prova não encontrada', 'error');
                    return;
                }
                
                // Verificar se pode excluir
                if (prova.publicada && !prova.dataLimite || (prova.publicada && new Date(prova.dataLimite) > new Date())) {
                    this.showToast('❌ Não é possível excluir uma prova ativa', 'error');
                    return;
                }
                
                if (prova.cancelada) {
                    this.showToast('❌ Prova já está cancelada', 'error');
                    return;
                }
                
                // Verificar se tem participantes
                if (prova.totalParticipantes > 0) {
                    const confirmarForcar = await this.confirmar(
                        '⚠️ Prova com Resultados',
                        `Esta prova tem <strong>${prova.totalParticipantes} aluno(s)</strong> que já realizaram.<br><br>
                        Excluir a prova também removerá todos os resultados.<br><br>
                        Deseja continuar mesmo assim?`,
                        'Sim, excluir tudo', 'Cancelar'
                    );
                    
                    if (!confirmarForcar) return;
                } else {
                    // Confirmação simples
                    const confirmar = await this.confirmar(
                        '🗑️ Excluir Prova',
                        `Tem certeza que deseja excluir a prova <strong>${prova.titulo}</strong>?<br><br>
                        Esta ação não pode ser desfeita.`,
                        'Sim, excluir', 'Cancelar'
                    );
                    
                    if (!confirmar) return;
                }
                
                try {
                    this.showToast('🗑️ Excluindo prova...', 'info');
                    
                    const response = await fetch(`/api/professor/provas/${id}`, {
                        method: 'DELETE',
                        headers: { 
                            'Authorization': `Bearer ${localStorage.getItem('auth_token')}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.showToast('✅ Prova excluída com sucesso!', 'success');
                        
                        // Remover da lista local
                        this.provas = this.provas.filter(p => p.id !== id);
                        
                        // Recarregar a tabela
                        const tabela = document.getElementById('tabelaProvas');
                        if (tabela) {
                            tabela.innerHTML = this.gerarLinhasProvas(this.provas);
                        }
                        
                        // Atualizar contadores
                        this.atualizarContadoresProvas();
                        
                    } else {
                        throw new Error(data.error || 'Erro ao excluir prova');
                    }
                    
                } catch (error) {
                    console.error('❌ Erro ao excluir prova:', error);
                    this.showToast('❌ ' + error.message, 'error');
                }
            }

            // ============ ATUALIZAR CONTADORES DE PROVAS ============
            atualizarContadoresProvas() {
                const totalEl = document.getElementById('totalProvasCount');
                const ativasEl = document.getElementById('ativasCount');
                const rascunhosEl = document.getElementById('rascunhosCount');
                
                if (totalEl) {
                    totalEl.textContent = this.provas.length;
                }
                
                if (ativasEl) {
                    const ativas = this.provas.filter(p => 
                        p.publicada && !p.cancelada && (!p.dataLimite || new Date(p.dataLimite) > new Date())
                    ).length;
                    ativasEl.textContent = ativas;
                }
                
                if (rascunhosEl) {
                    const rascunhos = this.provas.filter(p => !p.publicada && !p.cancelada).length;
                    rascunhosEl.textContent = rascunhos;
                }
            }

            filtrarProvasLista() {
                const busca = document.getElementById('buscaProva')?.value.toLowerCase() || '';
                const status = document.getElementById('filtroStatusProva')?.value || 'todas';
                const tipo = document.getElementById('filtroTipoProva')?.value || 'todas';
                
                const agora = new Date();
                
                console.log('Filtrando provas. Total:', this.provas.length);
                
                const filtradas = this.provas.filter(p => {
                    // Nome do professor para busca
                    let nomeProfessor = '';
                    if (p.professor) {
                        if (typeof p.professor === 'object') {
                            nomeProfessor = p.professor.nome || '';
                        } else {
                            nomeProfessor = p.professor;
                        }
                    }
                    
                    // Nome da turma para busca
                    let nomeTurma = '';
                    if (p.turma) {
                        if (typeof p.turma === 'object') {
                            nomeTurma = p.turma.nome || '';
                        } else {
                            nomeTurma = p.turma;
                        }
                    }
                    
                    // Filtro de busca
                    const matchBusca = busca === '' || 
                        (p.titulo && p.titulo.toLowerCase().includes(busca)) ||
                        (nomeProfessor && nomeProfessor.toLowerCase().includes(busca)) ||
                        (nomeTurma && nomeTurma.toLowerCase().includes(busca));
                    
                    // Filtro de status
                    let matchStatus = true;
                    if (status === 'rascunho') {
                        matchStatus = (p.publicada === false || p.publicada === 'false') && p.cancelada !== true;
                    }
                    else if (status === 'ativa') {
                        const dataLimite = p.dataLimite ? new Date(p.dataLimite) : null;
                        matchStatus = (p.publicada === true || p.publicada === 'true') && p.cancelada !== true && (!dataLimite || dataLimite > agora);
                    }
                    else if (status === 'expirada') {
                        const dataLimite = p.dataLimite ? new Date(p.dataLimite) : null;
                        matchStatus = (p.publicada === true || p.publicada === 'true') && p.cancelada !== true && dataLimite && dataLimite < agora;
                    }
                    else if (status === 'cancelada') {
                        matchStatus = p.cancelada === true || p.status === 'cancelada';
                    }
                    
                    // Filtro de tipo
                    let matchTipo = true;
                    if (tipo === 'simples') {
                        matchTipo = (p.tipoProva === 'simples' || !p.tipoProva) && p.adaptada !== true;
                    }
                    else if (tipo === 'enem') {
                        matchTipo = p.tipoProva === 'enem';
                    }
                    else if (tipo === 'adaptada') {
                        matchTipo = p.adaptada === true || p.tipoProva === 'adaptada';
                    }
                    
                    return matchBusca && matchStatus && matchTipo;
                });
                
                console.log('Provas filtradas:', filtradas.length);
                
                document.getElementById('tabelaProvas').innerHTML = this.gerarLinhasProvas(filtradas);
                
                // Atualizar contadores
                document.getElementById('totalProvasCount').textContent = filtradas.length;
                document.getElementById('ativasCount').textContent = filtradas.filter(p => 
                    (p.publicada === true || p.publicada === 'true') && 
                    p.cancelada !== true && 
                    (!p.dataLimite || new Date(p.dataLimite) > new Date())
                ).length;
                document.getElementById('rascunhosCount').textContent = filtradas.filter(p => 
                    (p.publicada === false || p.publicada === 'false') && p.cancelada !== true
                ).length;
            }

            filtrarMinhasProvas() {
                if (!this.usuario?.id) return;
                
                const minhas = this.provas.filter(p => p.professor?.id === this.usuario.id);
                document.getElementById('tabelaProvas').innerHTML = this.gerarLinhasProvas(minhas);
                
                this.showToast(`📋 Mostrando ${minhas.length} provas suas`, 'info');
            }

            // ============ EDITAR PROVA (SIMPLES) - VERSÃO CORRIGIDA COM HORÁRIOS ============
            async editarProvaSimples(provaId) {
                console.log('✏️ Admin Simples editando prova:', provaId);
                
                const prova = this.provas.find(p => p.id === provaId);
                if (!prova) {
                    this.showToast('❌ Prova não encontrada', 'error');
                    return;
                }

                try {
                    this.showToast('📝 Carregando dados da prova...', 'info');
                    
                    const token = localStorage.getItem('auth_token');
                    const response = await fetch(`/api/provas/${provaId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    const data = await response.json();

                    if (!data.success) {
                        throw new Error(data.error || 'Erro ao carregar dados da prova');
                    }

                    const provaCompleta = data.prova || prova;
                    const questoes = data.questoes || [];

                    // Formatar data para o input date
                    let dataLimiteStr = '';
                    if (provaCompleta.dataLimite) {
                        const dataLimite = new Date(provaCompleta.dataLimite);
                        const ano = dataLimite.getFullYear();
                        const mes = String(dataLimite.getMonth() + 1).padStart(2, '0');
                        const dia = String(dataLimite.getDate()).padStart(2, '0');
                        dataLimiteStr = `${ano}-${mes}-${dia}`;
                    }

                    // Extrair horários
                    const horarioInicio = provaCompleta.horarioInicio || prova.horarioInicio || '08:00';
                    const horarioTermino = provaCompleta.horarioTermino || prova.horarioTermino || '09:30';

                    // Criar o modal de edição
                    this.criarModalEdicaoProvaSimples(provaId, provaCompleta, questoes, dataLimiteStr, horarioInicio, horarioTermino);

                } catch (error) {
                    console.error('❌ Erro ao carregar prova para edição:', error);
                    this.showToast('❌ Erro: ' + error.message, 'error');
                }
            }

            // ============ CALCULAR DURAÇÃO NO MODAL DE EDIÇÃO ============
            calcularDuracaoEditavel() {
                const inicio = document.getElementById('edit-horario-inicio')?.value;
                const termino = document.getElementById('edit-horario-termino')?.value;
                
                if (!inicio || !termino) return;
                
                const [h1, m1] = inicio.split(':').map(Number);
                const [h2, m2] = termino.split(':').map(Number);
                
                const totalMinutos = (h2 * 60 + m2) - (h1 * 60 + m1);
                
                const duracaoEl = document.getElementById('duracao-calculada-edit');
                if (!duracaoEl) return;
                
                if (totalMinutos <= 0) {
                    duracaoEl.innerHTML = '<span style="color: #ef4444;">Horário inválido</span>';
                    return;
                }
                
                const horas = Math.floor(totalMinutos / 60);
                const minutos = totalMinutos % 60;
                
                let duracaoTexto = '';
                if (horas > 0) duracaoTexto += `${horas} hora${horas > 1 ? 's' : ''}`;
                if (minutos > 0) {
                    if (horas > 0) duracaoTexto += ' e ';
                    duracaoTexto += `${minutos} minuto${minutos > 1 ? 's' : ''}`;
                }
                
                duracaoEl.innerHTML = `<strong>${duracaoTexto}</strong> (${totalMinutos} minutos)`;
            }

            // ============ SALVAR EDIÇÃO DA PROVA (SIMPLES) ============
            async salvarEdicaoProvaSimples(provaId) {
                try {
                    this.showToast('💾 Salvando alterações...', 'info');
                    
                    const token = localStorage.getItem('auth_token');
                    
                    // Coletar dados básicos
                    const dados = {
                        titulo: document.getElementById('edit-titulo')?.value,
                        conteudo: document.getElementById('edit-conteudo')?.value,
                        dataLimite: document.getElementById('edit-data-limite')?.value,
                        horarioInicio: document.getElementById('edit-horario-inicio')?.value,
                        horarioTermino: document.getElementById('edit-horario-termino')?.value,
                        questoes: []
                    };
                    
                    const totalQuestoes = parseInt(document.getElementById('questoes-count')?.value || '0');
                    
                    // Coletar questões
                    for (let i = 0; i < totalQuestoes; i++) {
                        const pergunta = document.getElementById(`edit-pergunta-${i}`)?.value;
                        const explicacao = document.getElementById(`edit-explicacao-${i}`)?.value;
                        
                        // Coletar opções
                        const opcoes = [];
                        let respostaCorreta = 0;
                        
                        // Descobrir qual opção está marcada como correta
                        const radios = document.getElementsByName(`resposta-correta-${i}`);
                        for (let r of radios) {
                            if (r.checked) {
                                respostaCorreta = parseInt(r.value);
                                break;
                            }
                        }
                        
                        // Coletar textos das opções
                        for (let j = 0; j < 5; j++) {
                            const opcao = document.getElementById(`edit-opcao-${i}-${j}`)?.value;
                            if (opcao) {
                                opcoes.push(opcao);
                            }
                        }
                        
                        dados.questoes.push({
                            pergunta,
                            opcoes,
                            respostaCorreta,
                            explicacao
                        });
                    }
                    
                    console.log('📤 Enviando dados para:', `/api/professor/provas/${provaId}`);
                    
                    const response = await fetch(`/api/professor/provas/${provaId}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(dados)
                    });
                    
                    // Verificar se a resposta é JSON
                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        const text = await response.text();
                        console.error('❌ Resposta não é JSON:', text.substring(0, 200));
                        throw new Error('Resposta do servidor não é JSON');
                    }
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.showToast('✅ Prova atualizada com sucesso!', 'success');
                        fecharModalEditarSimples();
                        
                        // Recarregar lista de provas
                        setTimeout(() => {
                            if (typeof this.carregarProvas === 'function') {
                                this.carregarProvas();
                            }
                        }, 1500);
                        
                    } else {
                        throw new Error(data.error || 'Erro ao salvar');
                    }
                    
                } catch (error) {
                    console.error('❌ Erro:', error);
                    this.showToast('❌ ' + error.message, 'error');
                }
            }

            async publicarProva(id) {
                const prova = this.provas.find(p => p.id === id);
                if (!prova) return;
                
                if (prova.publicada) {
                    this.showToast('❌ Esta prova já está publicada', 'error');
                    return;
                }
                
                if (prova.cancelada) {
                    this.showToast('❌ Não é possível publicar uma prova cancelada', 'error');
                    return;
                }
                
                const confirmar = await this.confirmar(
                    '📢 Publicar Prova',
                    `Deseja publicar a prova <strong>${prova.titulo}</strong>?<br><br>
                    Após publicada, os alunos poderão vê-la e realizá-la.`
                );
                
                if (!confirmar) return;
                
                try {
                    this.showToast('Publicando...', 'info');
                    
                    const token = localStorage.getItem('auth_token');
                    
                    // 🔥 BUSCAR DADOS COMPLETOS DA PROVA (para pegar turma e alunos)
                    const responseProva = await fetch(`/api/provas/${id}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    const dataProva = await responseProva.json();
                    const provaCompleta = dataProva.success ? dataProva.prova : null;
                    
                    const response = await fetch(`/api/professor/provas/${id}/publicar`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.showToast('✅ Prova publicada com sucesso!', 'success');
                        
                        // ===== NOTIFICAR ALUNOS SOBRE A NOVA PROVA =====
                        if (provaCompleta && provaCompleta.turmaId) {
                            try {
                                // Buscar a turma com os alunos
                                const turmaRes = await fetch(`/api/turmas/${provaCompleta.turmaId}`, {
                                    headers: { 'Authorization': `Bearer ${token}` }
                                });
                                
                                const turmaData = await turmaRes.json();
                                const turma = turmaData.success ? turmaData.turma : null;
                                
                                if (turma && turma.alunos && turma.alunos.length > 0) {
                                    const alunos = turma.alunos;
                                    console.log(`📢 Notificando ${alunos.length} alunos sobre nova prova...`);
                                    
                                    // Buscar configurações de push
                                    const configRes = await fetch('/api/admin/configuracoes', {
                                        headers: { 'Authorization': `Bearer ${token}` }
                                    }).catch(() => ({ json: () => ({ configuracoes: { notificacoes: { push: false } } }) }));
                                    
                                    const configData = await configRes.json();
                                    const pushAtivado = configData.configuracoes?.notificacoes?.push === true;
                                    
                                    let notificacoesEnviadas = 0;

            // ============ CONFIRMAR ADIAMENTO (COM NOTIFICAÇÕES) ============
            async confirmarAdiamento(provaId) {
                const novaData = document.getElementById('novaDataLimite')?.value;
                const novoHorario = document.getElementById('novoHorarioTermino')?.value;
                const justificativa = document.getElementById('justificativaAdiamento')?.value;
                
                if (!novaData) {
                    this.showToast('❌ Selecione uma nova data', 'error');
                    return;
                }
                
                try {
                    this.showToast('📅 Adiando prova...', 'info');
                    
                    // Buscar dados completos da prova
                    const token = localStorage.getItem('auth_token');
                    
                    const responseProva = await fetch(`/api/provas/${provaId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    const dataProva = await responseProva.json();
                    const prova = dataProva.success ? dataProva.prova : null;
                    
                    if (!prova) {
                        throw new Error('Prova não encontrada');
                    }
                    
                    // Construir nova data com horário
                    const novaDataLimite = `${novaData}T${novoHorario || '23:59'}:00`;
                    const dataFormatada = new Date(novaDataLimite).toLocaleString('pt-BR', {
                        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                    
                    // Atualizar a prova via API
                    const response = await fetch(`/api/admin/provas/${provaId}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            dataLimite: novaDataLimite,
                            horarioTermino: novoHorario,
                            justificativaAdiamento: justificativa
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // ===== NOTIFICAR PROFESSOR =====
                        if (prova.userId) {
                            const professorNome = prova.professor?.nome || 'Professor';
                            
                            // Notificação no sistema para o professor
                            await fetch('/api/notificacoes', {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    usuarioId: prova.userId,
                                    tipo: 'sistema',
                                    titulo: '📅 Prova Adiada',
                                    mensagem: `A prova "${prova.titulo}" foi adiada para ${dataFormatada}. ${justificativa ? `Motivo: ${justificativa}` : ''}`,
                                    icone: '📅',
                                    cor: '#e67e22',
                                    link: `/admin-simples.html?prova=${provaId}`,
                                    prioridade: 3,
                                    dados: {
                                        provaId: provaId,
                                        provaTitulo: prova.titulo,
                                        novaData: novaDataLimite,
                                        justificativa: justificativa,
                                        tipo: 'adiamento'
                                    }
                                })
                            });
                            
                            // Push para o professor
                            await this.enviarPushParaUsuario(
                                prova.userId,
                                '📅 Prova Adiada',
                                `A prova "${prova.titulo}" foi adiada para ${dataFormatada}`,
                                {
                                    tipo: 'adiamento',
                                    provaId: provaId,
                                    novaData: novaDataLimite
                                }
                            );
                            
                            console.log('✅ Professor notificado sobre adiamento');
                        }
                        
                        // ===== NOTIFICAR ALUNOS DA TURMA =====
                        if (prova.turmaId && prova.turmaId.alunos && prova.turmaId.alunos.length > 0) {
                            const alunos = prova.turmaId.alunos;
                            console.log(`📢 Notificando ${alunos.length} alunos sobre adiamento...`);
                            
                            let notificacoesEnviadas = 0;
                            
                            for (const alunoId of alunos) {
                                try {
                                    // Notificação no sistema para cada aluno
                                    await fetch('/api/notificacoes', {
                                        method: 'POST',
                                        headers: {
                                            'Authorization': `Bearer ${token}`,
                                            'Content-Type': 'application/json'
                                        },
                                        body: JSON.stringify({
                                            usuarioId: alunoId,
                                            tipo: 'sistema',
                                            titulo: '📅 Prova Adiada',
                                            mensagem: `A prova "${prova.titulo}" foi adiada para ${dataFormatada}. ${justificativa ? `Motivo: ${justificativa}` : 'Verifique o novo prazo.'}`,
                                            icone: '📅',
                                            cor: '#e67e22',
                                            link: `/aluno.html`,
                                            prioridade: 3,
                                            dados: {
                                                provaId: provaId,
                                                provaTitulo: prova.titulo,
                                                novaData: novaDataLimite,
                                                tipo: 'adiamento'
                                            }
                                        })
                                    });
                                    
                                    // Push para o aluno
                                    await this.enviarPushParaUsuario(
                                        alunoId,
                                        '📅 Prova Adiada',
                                        `A prova "${prova.titulo}" foi adiada para ${dataFormatada}`,
                                        {
                                            tipo: 'adiamento',
                                            provaId: provaId,
                                            novaData: novaDataLimite
                                        }
                                    );
                                    
                                    notificacoesEnviadas++;
                                    
                                } catch (alunoError) {
                                    console.error(`Erro ao notificar aluno ${alunoId}:`, alunoError);
                                }
                            }
                            
                            console.log(`✅ ${notificacoesEnviadas} alunos notificados sobre adiamento`);
                        }
                        
                        this.showToast('✅ Data limite atualizada com sucesso!', 'success');
                        this.fecharModal();
                        
                        // Recarregar a lista de provas
                        await this.carregarProvas();
                        
                        // Mostrar mensagem detalhada
                        setTimeout(() => {
                            this.showToast(`📅 Nova data: ${dataFormatada}`, 'info');
                        }, 1500);
                        
                    } else {
                        throw new Error(data.error || 'Erro ao adiar prova');
                    }
                    
                } catch (error) {
                    console.error('❌ Erro ao adiar prova:', error);
                    this.showToast('❌ ' + error.message, 'error');
                }
            }

            exportarProvasCSV() {
                if (!this.provas || this.provas.length === 0) {
                    this.showToast('❌ Nenhuma prova para exportar', 'error');
                    return;
                }
                
                const headers = ['Título', 'Professor', 'Turma', 'Tipo', 'Questões', 'Status', 'Realizações', 'Data Criação'];
                let csvContent = headers.join(',') + '\n';
                
                this.provas.forEach(p => {
                    const tipo = p.tipoProva === 'enem' ? 'ENEM' : (p.adaptada ? 'Adaptada' : 'Simples');
                    
                    let status = '';
                    if (p.cancelada) status = 'Cancelada';
                    else if (!p.publicada) status = 'Rascunho';
                    else if (p.dataLimite && new Date(p.dataLimite) < new Date()) status = 'Expirada';
                    else status = 'Ativa';
                    
                    const data = new Date(p.dataCriacao).toLocaleDateString('pt-BR');
                    
                    const linha = [
                        `"${p.titulo || ''}"`,
                        `"${p.professor?.nome || p.professor || ''}"`,
                        `"${p.turma?.nome || p.turma || ''}"`,
                        `"${tipo}"`,
                        p.quantidadeQuestoes || 0,
                        `"${status}"`,
                        p.totalParticipantes || 0,
                        `"${data}"`
                    ].join(',');
                    
                    csvContent += linha + '\n';
                });
                
                const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `provas-${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
                
                this.showToast('✅ Provas exportadas!', 'success');
            }

            // ============ RESULTADOS ============
            // ============ CARREGAR RESULTADOS ============
            async carregarResultados() {
                const contentArea = document.getElementById('contentArea');
                
                contentArea.innerHTML = `
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p>Carregando resultados...</p>
                    </div>
                    <style>
                        .loading-spinner { text-align: center; padding: 60px; background: white; border-radius: 12px; }
                        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #0d6efd; border-radius: 50%; margin: 0 auto 15px; animation: spin 1s linear infinite; }
                        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                    </style>
                `;

                try {
                    const token = localStorage.getItem('auth_token');
                    
                    // Buscar TODOS os resultados
                    const response = await fetch('/api/admin/todos-resultados', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    const data = await response.json();
                    
                    console.log('📊 Todos os resultados:', data);

                    if (!data.success) {
                        throw new Error(data.error || 'Erro ao carregar resultados');
                    }

                    if (data.resultados.length === 0) {
                        contentArea.innerHTML = this.renderSemResultados();
                        return;
                    }

                    // Usar os resultados e estatísticas diretamente da API
                    const resultados = data.resultados;
                    const estatisticas = data.estatisticas || {
                        total: resultados.length,
                        comNota: resultados.filter(r => r.nota !== null && r.nota !== undefined).length,
                        semNota: resultados.filter(r => r.nota === null || r.nota === undefined).length,
                        aprovados: resultados.filter(r => r.nota && r.nota >= 7).length,
                        reprovados: resultados.filter(r => r.nota && r.nota < 7).length,
                        cancelados: resultados.filter(r => r.cancelada === true).length,
                        pendentes: resultados.filter(r => !r.nota).length,
                        totalAlunos: new Set(resultados.map(r => r.alunoId)).size,
                        totalProvas: new Set(resultados.map(r => r.provaId)).size,
                        mediaGeral: (resultados.filter(r => r.nota).reduce((acc, r) => acc + r.nota, 0) / (resultados.filter(r => r.nota).length || 1)).toFixed(2),
                        taxaAprovacao: ((resultados.filter(r => r.nota && r.nota >= 7).length / (resultados.filter(r => r.nota).length || 1)) * 100).toFixed(1)
                    };

                    // ARMAZENAR OS DADOS NO OBJETO
                    this.resultadosCompletos = resultados;
                    this.resultadosFiltrados = resultados;
                    this.paginaAtualResultados = 1;

                    // Renderizar a página com os resultados
                    contentArea.innerHTML = this.renderResultadosCompleto(resultados, estatisticas);

                    // Renderizar a tabela
                    setTimeout(() => {
                        this.atualizarTabelaResultadosPaginada();
                        this.configurarEventosResultados();
                    }, 100);

                } catch (error) {
                    console.error('❌ Erro ao carregar resultados:', error);
                    contentArea.innerHTML = this.renderErroResultados(error.message);
                }
            }

                    this.showToast('❌ Resultados cancelados não podem ser editados', 'error');
                    return;
                }

                const modalBody = document.getElementById('modalBody');
                const modalTitle = document.getElementById('modalTitle');
                const modalSaveBtn = document.getElementById('modalSaveBtn');
                
                modalBody.innerHTML = `
                    <div style="padding: 25px;">

            // ============ SALVAR EDIÇÃO DO RESULTADO (CORRIGIDO) ============
            async salvarEdicaoResultado(resultadoId) {
                try {
                    const resultado = this.resultadosCompletos?.find(r => r.id === resultadoId || r._id === resultadoId);
                    if (!resultado) {
                        this.showToast('❌ Resultado não encontrado', 'error');
                        return;
                    }

                    const novaNota = parseFloat(document.getElementById('editNota')?.value);
                    const novoTotal = parseInt(document.getElementById('editTotal')?.value);
                    const novoTempo = parseInt(document.getElementById('editTempo')?.value) * 60;
                    const novasObservacoes = document.getElementById('editObservacoes')?.value;
                    const liberarNota = document.getElementById('editLiberarNota')?.checked || true;

                    // Validar nota
                    if (isNaN(novaNota) || novaNota < 0 || novaNota > 10) {
                        this.showToast('❌ Nota inválida. Deve ser entre 0 e 10', 'error');
                        return;
                    }

                    // Validar total
                    if (isNaN(novoTotal) || novoTotal < 1) {
                        this.showToast('❌ Total de questões inválido', 'error');
                        return;
                    }

                    // Calcular acertos baseado na nota (arredondado)
                    const novosAcertos = Math.round((novaNota / 10) * novoTotal);

                    this.showToast('💾 Salvando alterações...', 'info');

                    const token = localStorage.getItem('auth_token');
                    
                    const response = await fetch(`/api/admin/resultados/${resultadoId}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            nota: novaNota,
                            acertos: novosAcertos,
                            total: novoTotal,
                            tempoGasto: novoTempo,
                            observacoes: novasObservacoes,
                            notaLiberada: liberarNota
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        this.showToast('✅ Resultado atualizado com sucesso!', 'success');
                        this.closeModal();
                        
                        // Atualizar o resultado na lista local
                        resultado.nota = novaNota;
                        resultado.acertos = novosAcertos;
                        resultado.total = novoTotal;
                        resultado.tempoGasto = novoTempo;
                        resultado.observacoes = novasObservacoes;
                        resultado.notaLiberada = liberarNota;
                        
                        // Recarregar a tabela
                        this.atualizarTabelaResultadosPaginada();
                    } else {
                        throw new Error(data.error || 'Erro ao salvar');
                    }

                } catch (error) {
                    console.error('❌ Erro:', error);
                    this.showToast('❌ ' + error.message, 'error');
                }
            }

            // ============ LIBERAR NOTA ============
            async liberarNota(resultadoId) {
                const resultado = this.resultadosCompletos?.find(r => r.id === resultadoId);
                if (!resultado) {
                    this.showToast('❌ Resultado não encontrado', 'error');
                    return;
                }

                const confirmar = await this.confirmar(
                    '✅ Liberar Nota',
                    `Deseja realmente liberar a nota <strong>${resultado.nota}</strong> para o aluno <strong>${resultado.alunoNome}</strong>?`
                );

                if (!confirmar) return;

                try {
                    this.showToast('🔄 Liberando nota...', 'info');

                    const token = localStorage.getItem('auth_token');
                    
                    const response = await fetch(`/api/admin/resultados/${resultadoId}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            nota: resultado.nota,
                            acertos: resultado.acertos,
                            total: resultado.total,
                            tempoGasto: resultado.tempoGasto,
                            observacoes: resultado.observacoes,
                            notaLiberada: true
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        resultado.notaLiberada = true;
                        this.showToast('✅ Nota liberada com sucesso!', 'success');
                        this.carregarResultados(); // Recarregar lista
                    } else {
                        throw new Error(data.error || 'Erro ao liberar nota');
                    }

                } catch (error) {
                    console.error('❌ Erro:', error);
                    this.showToast('❌ ' + error.message, 'error');
                }
            }

            // ============ ENVIAR NOTIFICAÇÃO ============
            async enviarNotificacao(resultadoId) {

                );

                if (!confirmar) return;

                try {
                    this.showToast('📧 Enviando notificação...', 'info');

                    const token = localStorage.getItem('auth_token');
                    
                    const response = await fetch('/api/notificacoes', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            usuarioId: resultado.alunoId,
                            tipo: 'sistema',
                            titulo: '📝 Lembrete de Prova',
                            mensagem: `Administrador enviou um lembrete sobre a prova "${resultado.provaTitulo}".`,
                            icone: '📧',
                            cor: '#3b82f6',
                            link: `/aluno.html?prova=${resultado.provaId}`,
                            prioridade: 1,
                            dados: {
                                tipo: 'lembrete',
                                provaId: resultado.provaId,
                                provaTitulo: resultado.provaTitulo,
                                resultadoId: resultado.id
                            }
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        this.showToast('✅ Notificação enviada com sucesso!', 'success');
                        
                        // Enviar push se disponível
                        await this.enviarPushParaUsuario(
                            resultado.alunoId,
                            '📝 Lembrete de Prova',
                            `Administrador enviou lembrete: ${resultado.provaTitulo}`,
                            {
                                tipo: 'lembrete',
                                provaId: resultado.provaId
                            }
                        );
                    } else {
                        throw new Error(data.error || 'Erro ao enviar notificação');
                    }

                } catch (error) {
                    console.error('❌ Erro:', error);
                    this.showToast('❌ ' + error.message, 'error');
                }
            }

            // ============ ENVIAR PUSH PARA USUÁRIO ============
            async enviarPushParaUsuario(usuarioId, titulo, mensagem, dados = {}) {
                try {
                    const token = localStorage.getItem('auth_token');
                    
                    const response = await fetch('/api/usuario/enviar-push', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            usuarioId,
                            titulo,
                            mensagem,
                            dados
                        })
                    });
                    
                    const data = await response.json();
                    return data.success;
                } catch (error) {
                    console.error('Erro ao enviar push:', error);
                    return false;
                }
            }

            // ============ LIBERAR TODAS AS NOTAS ============
            async liberarTodasNotas() {
                const pendentes = this.resultadosCompletos?.filter(r => 
                    !r.cancelada && 
                    r.nota !== null && 
                    r.notaLiberada === false
                );

                if (!pendentes || pendentes.length === 0) {
                    this.showToast('ℹ️ Nenhuma nota pendente para liberar', 'info');
                    return;
                }

                const confirmar = await this.confirmar(
                    '📢 Liberar Todas as Notas',
                    `Deseja liberar <strong>${pendentes.length} nota(s)</strong> pendente(s)?`
                );

                if (!confirmar) return;

                this.showToast(`🔄 Liberando ${pendentes.length} notas...`, 'info');

                let sucessos = 0;
                let erros = 0;

                for (const resultado of pendentes) {
                    try {
                        const token = localStorage.getItem('auth_token');
                        
                        const response = await fetch(`/api/admin/resultados/${resultado.id}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                nota: resultado.nota,
                                acertos: resultado.acertos,
                                total: resultado.total,
                                tempoGasto: resultado.tempoGasto,
                                observacoes: resultado.observacoes,
                                notaLiberada: true
                            })
                        });

                        const data = await response.json();

                        if (data.success) {
                            resultado.notaLiberada = true;
                            sucessos++;
                        } else {
                            erros++;
                        }
                    } catch (error) {
                        erros++;
                    }
                }

                this.showToast(`✅ ${sucessos} notas liberadas, ${erros} erros`, 'success');
                this.carregarResultados(); // Recarregar lista
            }

            // ============ EXCLUIR RESULTADO ============
            async excluirResultado(resultadoId) {
                const resultado = this.resultadosCompletos?.find(r => r.id === resultadoId);
                if (!resultado) return;

                const confirmar = await this.confirmar(
                    '🗑️ Excluir Resultado',
                    `Tem certeza que deseja excluir permanentemente o resultado de <strong>${resultado.alunoNome}</strong> na prova <strong>${resultado.provaTitulo}</strong>?`
                );

                if (!confirmar) return;

                try {
                    this.showToast('🗑️ Excluindo resultado...', 'info');

                    const token = localStorage.getItem('auth_token');
                    
                    const response = await fetch(`/api/admin/resultados/${resultadoId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    const data = await response.json();

                    if (data.success) {
                        this.showToast('✅ Resultado excluído com sucesso!', 'success');
                        this.carregarResultados(); // Recarregar lista
                    } else {
                        throw new Error(data.error || 'Erro ao excluir');
                    }

                } catch (error) {
                    console.error('❌ Erro:', error);
                    this.showToast('❌ ' + error.message, 'error');
                }
            }

            // ============ VER DETALHES DE CANCELAMENTO ============
            async verDetalhesCancelamento(resultadoId) {
                const resultado = this.resultadosCompletos?.find(r => r.id === resultadoId);
                if (!resultado) return;

                const isCancelada = resultado.cancelada === true;

                if (!isCancelada) {
                    this.showToast('❌ Este resultado não foi cancelado', 'error');
                    return;
                }

                try {
                    const token = localStorage.getItem('auth_token');
                    const response = await fetch(`/api/admin/resultados/${resultadoId}/cancelamento`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.mostrarModalCancelamento(data);
                        return;
                    }
                } catch (error) {
                    console.log('⚠️ Usando dados locais');
                }

                // Fallback com dados locais
                const motivo = resultado.motivoCancelamento || '';
                const motivoLower = motivo.toLowerCase();
                
                const isViolacao = motivoLower.includes('violação') || 
                                motivoLower.includes('violacao') ||
                                resultado.flagViolacao === true;

                const dadosCancelamento = {
                    tipoCancelamento: isViolacao ? 'violacao' : 'prazo',
                    prova: { titulo: resultado.provaTitulo },
                    aluno: {
                        nome: resultado.alunoNome,
                        email: resultado.alunoEmail,
                        matricula: resultado.alunoMatricula
                    },
                    cancelamento: {
                        data: resultado.dataRealizacao,
                        motivo: resultado.motivoCancelamento || 'Prazo expirado',
                        nota: resultado.nota || 0,
                        tempoGasto: resultado.tempoGasto
                    }
                };

                this.mostrarModalCancelamento(dadosCancelamento);
            }

                                <i class="fas fa-${config.icone}" style="font-size: 30px; color: ${config.cor};"></i>
                            </div>

                        <div style="background: #f8fafc; border-radius: 12px; padding: 20px; margin-bottom: 20px;">

                                    <div style="font-size: 12px; color: #6b7280;">Prova</div>
                                    <div style="font-weight: 600;">${dados.prova.titulo}</div>
                                </div>
                                <div>
                                    <div style="font-size: 12px; color: #6b7280;">Aluno</div>
                                    <div style="font-weight: 600;">${dados.aluno.nome}</div>
                                </div>
                                <div>
                                    <div style="font-size: 12px; color: #6b7280;">Data</div>
