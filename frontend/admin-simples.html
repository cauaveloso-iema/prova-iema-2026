            // ============ EXTRAIR LISTA DE PROFESSORES DAS PROVAS ============
            extrairProfessores(provas) {
                const professores = new Map();
                
                provas.forEach(p => {
                    if (p.professor) {
                        if (typeof p.professor === 'object') {
                            const id = p.professor.id || p.professor._id;
                            const nome = p.professor.nome;
                            if (id && nome) {
                                professores.set(id, { id, nome });
                            }
                        } else if (typeof p.professor === 'string' && p.professor !== '-') {
                            professores.set(p.professor, { id: p.professor, nome: p.professor });
                        }
                    }
                    
                    if (p.professorId && !professores.has(p.professorId)) {
                        // Tentar buscar na lista de usuários
                        if (this.usuarios) {
                            const prof = this.usuarios.find(u => u._id === p.professorId || u.id === p.professorId);
                            if (prof) {
                                professores.set(p.professorId, { id: p.professorId, nome: prof.nome });
                            }
                        }
                    }
                });
                
                return Array.from(professores.values());
            }

            // ============ GERAR OPÇÕES DE PROFESSORES PARA O SELECT ============
            gerarOpcoesProfessores() {
                if (!this.professoresLista || this.professoresLista.length === 0) {
                    return '<option value="todos">Nenhum professor encontrado</option>';
                }
                
                return this.professoresLista.map(prof => 
                    `<option value="${prof.id}">👨‍🏫 ${prof.nome}</option>`
                ).join('');
            }

            // ============ APLICAR FILTROS ============
            aplicarFiltros() {
                const filtros = {
                    busca: document.getElementById('filtroBusca')?.value || '',
                    status: document.getElementById('filtroStatus')?.value || 'todos',
                    tipo: document.getElementById('filtroTipo')?.value || 'todos',
                    professor: document.getElementById('filtroProfessor')?.value || 'todos'
                };
                
                console.log('🔍 Aplicando filtros:', filtros);
                
                // Filtrar as provas
                let filtradas = [...this.provas];
                const agora = new Date();
                
                // Filtro de busca
                if (filtros.busca) {
                    const busca = filtros.busca.toLowerCase();
                    filtradas = filtradas.filter(p => 
                        (p.titulo && p.titulo.toLowerCase().includes(busca)) ||
                        (p.conteudo && p.conteudo.toLowerCase().includes(busca))
                    );
                }
                
                // Filtro de status
                if (filtros.status !== 'todos') {
                    filtradas = filtradas.filter(p => {
                        if (filtros.status === 'rascunho') return !p.publicada && !p.cancelada;
                        if (filtros.status === 'ativa') return p.publicada && !p.cancelada && (!p.dataLimite || new Date(p.dataLimite) > agora);
                        if (filtros.status === 'expirada') return p.publicada && !p.cancelada && p.dataLimite && new Date(p.dataLimite) < agora;
                        if (filtros.status === 'cancelada') return p.cancelada === true;
                        return true;
                    });
                }
                
                // Filtro de tipo
                if (filtros.tipo !== 'todos') {
                    filtradas = filtradas.filter(p => {
                        if (filtros.tipo === 'simples') return !p.adaptada && (!p.tipoProva || p.tipoProva === 'simples');
                        if (filtros.tipo === 'enem') return p.tipoProva === 'enem';
                        if (filtros.tipo === 'adaptada') return p.adaptada === true;
                        return true;
                    });
                }
                
                // Filtro de professor
                if (filtros.professor !== 'todos') {
                    filtradas = filtradas.filter(p => {
                        // Verificar várias possibilidades
                        if (p.professor) {
                            if (typeof p.professor === 'object') {
                                return p.professor.id === filtros.professor || p.professor._id === filtros.professor;
                            }
                            return p.professor === filtros.professor;
                        }
                        if (p.professorId) {
                            return p.professorId === filtros.professor;
                        }
                        return false;
                    });
                }
                
                // Atualizar tabela
                const tabela = document.getElementById('tabelaProvas');
                if (tabela) {
                    tabela.innerHTML = this.gerarLinhasProvas(filtradas);
                }
                
                // Atualizar estatísticas
                this.atualizarStatsFiltros(filtradas);
            }

            // ============ ATUALIZAR ESTATÍSTICAS DOS FILTROS ============
            atualizarStatsFiltros(provas) {
                const agora = new Date();
                
                document.getElementById('statsTotal').textContent = provas.length;
                document.getElementById('statsRascunhos').textContent = provas.filter(p => !p.publicada).length;
                document.getElementById('statsAtivas').textContent = provas.filter(p => 
                    p.publicada && !p.cancelada && (!p.dataLimite || new Date(p.dataLimite) > agora)
                ).length;
                document.getElementById('statsExpiradas').textContent = provas.filter(p => 
                    p.publicada && p.dataLimite && new Date(p.dataLimite) < agora
                ).length;
            }

            // ============ LIMPAR FILTROS ============
            limparFiltros() {
                // Resetar campos
                document.getElementById('filtroBusca').value = '';
                document.getElementById('filtroStatus').value = 'todos';
                document.getElementById('filtroTipo').value = 'todos';
                document.getElementById('filtroProfessor').value = 'todos';
                
                // Recarregar provas
                this.carregarProvas();
            }

            gerarLinhasProvas(provas) {
                if (!provas || provas.length === 0) {
                    return '<tr><td colspan="8" class="empty-state">Nenhuma prova encontrada</td></tr>';
                }

                return provas.map(p => {
                    // Determinar se pode excluir
                    const podeExcluir = (!p.publicada || (p.publicada && p.dataLimite && new Date(p.dataLimite) < new Date())) && !p.cancelada;
                    
                    // Determinar cor e texto do status
                    let statusClass = '';
                    let statusText = '';
                    
                    if (p.cancelada) {
                        statusClass = 'inactive';
                        statusText = 'Cancelada';
                    } else if (!p.publicada) {
                        statusClass = 'pending';
                        statusText = 'Rascunho';
                    } else if (p.dataLimite && new Date(p.dataLimite) < new Date()) {
                        statusClass = 'inactive';
                        statusText = 'Expirada';
                    } else {
                        statusClass = 'active';
                        statusText = 'Ativa';
                    }
                    
                    // Tipo da prova
                    let tipoClass = 'primary';
                    let tipo = 'Simples';
                    
                    if (p.tipoProva === 'enem') {
                        tipoClass = 'info';
                        tipo = 'ENEM';
                    } else if (p.adaptada === true) {
                        tipoClass = 'warning';
                        tipo = 'Adaptada';
                    }

                    return `
                        <tr>
                            <td>
                                <strong>${p.titulo || 'Sem título'}</strong>
                                <br><small style="color: #666;">${p.conteudo?.substring(0, 50) || ''}</small>
                            </td>
                            <td>${this.obterNomeProfessor(p)}</td>
                            <td>${p.turma?.nome || p.turma || '-'}</td>
                            <td>
                                <span class="status-badge ${tipoClass}">${tipo}</span>
                            </td>
                            <td>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </td>
                            <td>${p.quantidadeQuestoes || 0}</td>
                            <td>
                                <div style="text-align: center;">
                                    <strong>${p.totalParticipantes || p.alunosRealizaram || 0}</strong>
                                    <br><small style="color: #666;">alunos</small>
                                </div>
                            </td>
                            <td>
                                <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                                    <!-- Botão Ver Detalhes -->
                                    <button class="btn-icon" style="background: #3498db; color: white;" 
                                            onclick="adminSimples.verDetalhesProva('${p.id}')" 
                                            title="Ver detalhes">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    
                                    <!-- Botão Ver Questões -->
                                    <button class="btn-icon" style="background: #9b59b6; color: white;" 
                                            onclick="adminSimples.visualizarQuestoes('${p.id}')" 
                                            title="Ver questões">
                                        <i class="fas fa-question-circle"></i>
                                    </button>
                                    
                                    <!-- Botão Ver Resultados (só para provas publicadas) -->
                                    ${p.publicada ? `
                                    <button class="btn-icon" style="background: #27ae60; color: white;" 
                                            onclick="adminSimples.verResultadosProva('${p.id}')" 
                                            title="Ver resultados">
                                        <i class="fas fa-chart-bar"></i>
                                    </button>
                                    ` : ''}
                                    
                                    <!-- Botão Publicar (só para rascunhos) -->
                                    ${!p.publicada && !p.cancelada ? `
                                    <button class="btn-icon" style="background: #f39c12; color: white;" 
                                            onclick="adminSimples.publicarProva('${p.id}')" 
                                            title="Publicar prova">
                                        <i class="fas fa-paper-plane"></i>
                                    </button>
                                    ` : ''}
                                    
                                    <!-- Botão Adiar (só para provas ativas) -->
                                    ${p.publicada && !p.cancelada && p.dataLimite && new Date(p.dataLimite) > new Date() ? `
                                    <button class="btn-icon" style="background: #e67e22; color: white;" 
                                            onclick="adminSimples.adiarProva('${p.id}')" 
                                            title="Adiar data">
                                        <i class="fas fa-calendar-plus"></i>
                                    </button>
                                    ` : ''}
                                    
                                    <!-- Botão Excluir -->
                                    ${podeExcluir ? `
                                    <button class="btn-icon" style="background: #e74c3c; color: white;" 
                                            onclick="adminSimples.excluirProva('${p.id}')" 
                                            title="Excluir prova">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                    ` : ''}
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            // ============ OBTER NOME DO PROFESSOR ============
            obterNomeProfessor(prova) {
                // Verificar campo professor (objeto)
                if (prova.professor) {
                    if (typeof prova.professor === 'object') {
                        return prova.professor.nome || prova.professor.name || 'Não informado';
                    }
                    return prova.professor;
                }
                
                // Verificar campo professorNome (string direta)
                if (prova.professorNome) {
                    return prova.professorNome;
                }
                
                // Verificar professorId e buscar na lista de usuários
                if (prova.professorId && this.usuarios && this.usuarios.length > 0) {
                    const prof = this.usuarios.find(u => u._id === prova.professorId || u.id === prova.professorId);
                    if (prof) {
                        return prof.nome;
                    }
                }
                
                // Verificar userId (às vezes o professor está aqui)
                if (prova.userId) {
                    if (typeof prova.userId === 'object') {
                        return prova.userId.nome || 'Não informado';
                    }
                    if (this.usuarios && this.usuarios.length > 0) {
                        const prof = this.usuarios.find(u => u._id === prova.userId || u.id === prova.userId);
                        if (prof) {
                            return prof.nome;
                        }
                    }
                }
                
                return 'Não informado';
            }
            
            // ============ EXCLUIR PROVA ============
            async excluirProva(id) {
                console.log('🗑️ excluirProva chamado com ID:', id);
                
                const prova = this.provas.find(p => p.id === id);
                if (!prova) {
                    this.showToast('❌ Prova não encontrada', 'error');
                    return;
                }
                
                // Verificar se pode excluir
                if (prova.publicada && !prova.dataLimite || (prova.publicada && new Date(prova.dataLimite) > new Date())) {
                    this.showToast('❌ Não é possível excluir uma prova ativa', 'error');
                    return;
                }
                
                if (prova.cancelada) {
                    this.showToast('❌ Prova já está cancelada', 'error');
                    return;
                }
                
                // Verificar se tem participantes
                if (prova.totalParticipantes > 0) {
                    const confirmarForcar = await this.confirmar(
                        '⚠️ Prova com Resultados',
                        `Esta prova tem <strong>${prova.totalParticipantes} aluno(s)</strong> que já realizaram.<br><br>
                        Excluir a prova também removerá todos os resultados.<br><br>
                        Deseja continuar mesmo assim?`,
                        'Sim, excluir tudo', 'Cancelar'
                    );
                    
                    if (!confirmarForcar) return;
                } else {
                    // Confirmação simples
                    const confirmar = await this.confirmar(
                        '🗑️ Excluir Prova',
                        `Tem certeza que deseja excluir a prova <strong>${prova.titulo}</strong>?<br><br>
                        Esta ação não pode ser desfeita.`,
                        'Sim, excluir', 'Cancelar'
                    );
                    
                    if (!confirmar) return;
                }
                
                try {
                    this.showToast('🗑️ Excluindo prova...', 'info');
                    
                    const response = await fetch(`/api/professor/provas/${id}`, {
                        method: 'DELETE',
                        headers: { 
                            'Authorization': `Bearer ${localStorage.getItem('auth_token')}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.showToast('✅ Prova excluída com sucesso!', 'success');
                        
                        // Remover da lista local
                        this.provas = this.provas.filter(p => p.id !== id);
                        
                        // Recarregar a tabela
                        const tabela = document.getElementById('tabelaProvas');
                        if (tabela) {
                            tabela.innerHTML = this.gerarLinhasProvas(this.provas);
                        }
                        
                        // Atualizar contadores
                        this.atualizarContadoresProvas();
                        
                    } else {
                        throw new Error(data.error || 'Erro ao excluir prova');
                    }
                    
                } catch (error) {
                    console.error('❌ Erro ao excluir prova:', error);
                    this.showToast('❌ ' + error.message, 'error');
                }
            }

            // ============ ATUALIZAR CONTADORES DE PROVAS ============
            atualizarContadoresProvas() {
                const totalEl = document.getElementById('totalProvasCount');
                const ativasEl = document.getElementById('ativasCount');
                const rascunhosEl = document.getElementById('rascunhosCount');
                
                if (totalEl) {
                    totalEl.textContent = this.provas.length;
                }
                
                if (ativasEl) {
                    const ativas = this.provas.filter(p => 
                        p.publicada && !p.cancelada && (!p.dataLimite || new Date(p.dataLimite) > new Date())
                    ).length;
                    ativasEl.textContent = ativas;
                }
                
                if (rascunhosEl) {
                    const rascunhos = this.provas.filter(p => !p.publicada && !p.cancelada).length;
                    rascunhosEl.textContent = rascunhos;
                }
            }

            filtrarProvasLista() {
                const busca = document.getElementById('buscaProva')?.value.toLowerCase() || '';
                const status = document.getElementById('filtroStatusProva')?.value || 'todas';
                const tipo = document.getElementById('filtroTipoProva')?.value || 'todas';
                
                const agora = new Date();
                
                console.log('Filtrando provas. Total:', this.provas.length);
                
                const filtradas = this.provas.filter(p => {
                    // Nome do professor para busca
                    let nomeProfessor = '';
                    if (p.professor) {
                        if (typeof p.professor === 'object') {
                            nomeProfessor = p.professor.nome || '';
                        } else {
                            nomeProfessor = p.professor;
                        }
                    }
                    
                    // Nome da turma para busca
                    let nomeTurma = '';
                    if (p.turma) {
                        if (typeof p.turma === 'object') {
                            nomeTurma = p.turma.nome || '';
                        } else {
                            nomeTurma = p.turma;
                        }
                    }
                    
                    // Filtro de busca
                    const matchBusca = busca === '' || 
                        (p.titulo && p.titulo.toLowerCase().includes(busca)) ||
                        (nomeProfessor && nomeProfessor.toLowerCase().includes(busca)) ||
                        (nomeTurma && nomeTurma.toLowerCase().includes(busca));
                    
                    // Filtro de status
                    let matchStatus = true;
                    if (status === 'rascunho') {
                        matchStatus = (p.publicada === false || p.publicada === 'false') && p.cancelada !== true;
                    }
                    else if (status === 'ativa') {
                        const dataLimite = p.dataLimite ? new Date(p.dataLimite) : null;
                        matchStatus = (p.publicada === true || p.publicada === 'true') && p.cancelada !== true && (!dataLimite || dataLimite > agora);
                    }
                    else if (status === 'expirada') {
                        const dataLimite = p.dataLimite ? new Date(p.dataLimite) : null;
                        matchStatus = (p.publicada === true || p.publicada === 'true') && p.cancelada !== true && dataLimite && dataLimite < agora;
                    }
                    else if (status === 'cancelada') {
                        matchStatus = p.cancelada === true || p.status === 'cancelada';
                    }
                    
                    // Filtro de tipo
                    let matchTipo = true;
                    if (tipo === 'simples') {
                        matchTipo = (p.tipoProva === 'simples' || !p.tipoProva) && p.adaptada !== true;
                    }
                    else if (tipo === 'enem') {
                        matchTipo = p.tipoProva === 'enem';
                    }
                    else if (tipo === 'adaptada') {
                        matchTipo = p.adaptada === true || p.tipoProva === 'adaptada';
                    }
                    
                    return matchBusca && matchStatus && matchTipo;
                });
                
                console.log('Provas filtradas:', filtradas.length);
                
                document.getElementById('tabelaProvas').innerHTML = this.gerarLinhasProvas(filtradas);
                
                // Atualizar contadores
                document.getElementById('totalProvasCount').textContent = filtradas.length;
                document.getElementById('ativasCount').textContent = filtradas.filter(p => 
                    (p.publicada === true || p.publicada === 'true') && 
                    p.cancelada !== true && 
                    (!p.dataLimite || new Date(p.dataLimite) > new Date())
                ).length;
                document.getElementById('rascunhosCount').textContent = filtradas.filter(p => 
                    (p.publicada === false || p.publicada === 'false') && p.cancelada !== true
                ).length;
            }

            exportarProvasCSV() {
                if (!this.provas || this.provas.length === 0) {
                    this.showToast('❌ Nenhuma prova para exportar', 'error');
                    return;
                }
                
                const headers = ['Título', 'Professor', 'Turma', 'Tipo', 'Questões', 'Status', 'Realizações', 'Data Criação'];
                let csvContent = headers.join(',') + '\n';
                
                this.provas.forEach(p => {
                    const tipo = p.tipoProva === 'enem' ? 'ENEM' : (p.adaptada ? 'Adaptada' : 'Simples');
                    
                    let status = '';
                    if (p.cancelada) status = 'Cancelada';
                    else if (!p.publicada) status = 'Rascunho';
                    else if (p.dataLimite && new Date(p.dataLimite) < new Date()) status = 'Expirada';
                    else status = 'Ativa';
                    
                    const data = new Date(p.dataCriacao).toLocaleDateString('pt-BR');
                    
                    const linha = [
                        `"${p.titulo || ''}"`,
                        `"${p.professor?.nome || p.professor || ''}"`,
                        `"${p.turma?.nome || p.turma || ''}"`,
                        `"${tipo}"`,
                        p.quantidadeQuestoes || 0,
                        `"${status}"`,
                        p.totalParticipantes || 0,
                        `"${data}"`
                    ].join(',');
                    
                    csvContent += linha + '\n';
                });
                
                const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `provas-${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
                
                this.showToast('✅ Provas exportadas!', 'success');
            }

                try {
                    const response = await fetch('/api/admin/todos-resultados', {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('auth_token')}` }
                    });

                    const data = await response.json();
                    this.resultados = data.success ? data.resultados : [];

                    content.innerHTML = `
                        <div class="section-header">
                            <h2><i class="fas fa-chart-bar"></i> Resultados</h2>
                        </div>

                        <div class="filters-bar">
                            <div class="filter-group">
                                <label>Buscar</label>
                                <input type="text" id="buscaResultado" placeholder="Aluno ou prova..." 
                                    class="form-control" onkeyup="adminSimples.filtrarResultados()">
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Aluno</th>
                                        <th>Prova</th>
                                        <th>Data</th>
                                        <th>Nota</th>
                                        <th>Acertos</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaResultados">
                                    ${this.gerarLinhasResultados(this.resultados)}
                                </tbody>
                            </table>
                        </div>
                    `;
                    
                } catch (error) {
                    content.innerHTML = `<p style="color: red;">Erro: ${error.message}</p>`;
                }
            }

            gerarLinhasResultados(resultados) {
                if (!resultados || resultados.length === 0) {
                    return '<tr><td colspan="6" class="empty-state">Nenhum resultado encontrado</td></tr>';
                }

                return resultados.slice(0, 50).map(r => {
                    const data = new Date(r.dataRealizacao || r.createdAt).toLocaleDateString('pt-BR');
                    
                    let statusClass = '';
                    let statusText = '';
                    
                    if (r.cancelada) {
                        statusClass = 'inactive';
                        statusText = 'Cancelada';
                    } else if (r.nota && r.nota >= 7) {
                        statusClass = 'active';
                        statusText = 'Aprovado';
                    } else if (r.nota) {
                        statusClass = 'inactive';
                        statusText = 'Reprovado';
                    } else {
                        statusClass = 'pending';
                        statusText = 'Pendente';
                    }

                    return `
                        <tr>
                            <td><strong>${r.alunoNome || 'N/A'}</strong></td>
                            <td>${r.provaTitulo || 'N/A'}</td>
                            <td>${data}</td>
                            <td><strong>${r.nota ? r.nota.toFixed(2) : '-'}</strong></td>
                            <td>${r.acertos || 0}/${r.total || 0}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        </tr>
                    `;
                }).join('');
            }

            filtrarResultados() {
                const busca = document.getElementById('buscaResultado')?.value.toLowerCase() || '';
                
                const filtrados = this.resultados.filter(r => 
                    (r.alunoNome && r.alunoNome.toLowerCase().includes(busca)) ||
                    (r.provaTitulo && r.provaTitulo.toLowerCase().includes(busca))
                );
                
                document.getElementById('tabelaResultados').innerHTML = this.gerarLinhasResultados(filtrados);
            }

            // ============ MODAL ============
            // Localize este método no seu código e substitua por esta versão corrigida:
            abrirModal(titulo, conteudo, salvar = true) {
                console.log('📂 Abrindo modal:', { titulo, salvar, temConteudo: !!conteudo });
                
                const modalTitle = document.getElementById('modalTitle');
                const modalBody = document.getElementById('modalBody');
                const modalSaveBtn = document.getElementById('modalSaveBtn');
                
                if (!modalTitle || !modalBody) {
                    console.error('❌ Elementos do modal não encontrados');
                    return;
                }
                
                // Definir título (garantir que não é undefined)
                modalTitle.innerHTML = titulo || 'Título';
                
                // Definir conteúdo (garantir que não é undefined)
                modalBody.innerHTML = conteudo || '<p style="padding: 20px; text-align: center;">Nenhum conteúdo disponível</p>';
                
                // Mostrar/esconder botão salvar
                if (modalSaveBtn) {
                    modalSaveBtn.style.display = salvar ? 'inline-block' : 'none';
                    // Limpar eventos anteriores
                    modalSaveBtn.onclick = null;
                }
                
                // Abrir modal
                const modal = document.getElementById('modal');
                if (modal) {
                    modal.style.display = 'flex';
                } else {
                    console.error('❌ Modal não encontrado no DOM');
                }
            }

            // ============ FECHAR MODAL ============
            fecharModal() {
                console.log('🔚 Fechando modal');
                const modal = document.getElementById('modal');
                if (modal) {
                    modal.style.display = 'none';
                }
                
                const modalSaveBtn = document.getElementById('modalSaveBtn');
                if (modalSaveBtn) {
                    modalSaveBtn.style.display = 'inline-block';
                    modalSaveBtn.onclick = null; // Limpar evento anterior
                }
            }

            salvarModal() {
                // Será sobrescrito pelo onclick específico
            }

            // ============ CONFIRMAR COM BOTÕES PERSONALIZADOS ============
            async confirmar(titulo, mensagem, textoSim = 'Sim', textoNao = 'Não') {
                return new Promise((resolve) => {
                    const modal = document.getElementById('confirmModal');
                    const titleEl = document.getElementById('confirmTitle');
                    const messageEl = document.getElementById('confirmMessage');
                    const btnSim = document.getElementById('confirmBtn');
                    const btnNao = document.querySelector('#confirmModal .btn-cancel');
                    
                    if (!modal || !titleEl || !messageEl || !btnSim || !btnNao) {
                        // Fallback para confirm nativo
                        return Promise.resolve(confirm(mensagem));
                    }
                    
                    titleEl.innerHTML = titulo;
                    messageEl.innerHTML = mensagem;
                    btnSim.textContent = textoSim;
                    btnNao.textContent = textoNao;
                    
                    modal.style.display = 'flex';
                    
                    const handlerSim = () => {
                        modal.style.display = 'none';
                        btnSim.removeEventListener('click', handlerSim);
                        btnNao.removeEventListener('click', handlerNao);
                        resolve(true);
                    };
                    
                    const handlerNao = () => {
                        modal.style.display = 'none';
                        btnSim.removeEventListener('click', handlerSim);
                        btnNao.removeEventListener('click', handlerNao);
                        resolve(false);
                    };
                    
                    btnSim.addEventListener('click', handlerSim);
                    btnNao.addEventListener('click', handlerNao);
                    
                    // Fechar ao clicar no X
                    const closeBtn = modal.querySelector('.modal-close');
                    if (closeBtn) {
                        closeBtn.addEventListener('click', handlerNao);
                    }
                });
            }

            fecharConfirmModal() {
                document.getElementById('confirmModal').style.display = 'none';
            }

            // ============ UTILITÁRIOS ============
            showToast(mensagem, tipo = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${tipo}`;
                toast.innerHTML = `<i class="fas ${tipo === 'success' ? 'fa-check-circle' : tipo === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${mensagem}`;
                document.getElementById('toastContainer').appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            logout() {
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user_data');
                window.location.href = 'login.html';
            }
        }

        // Inicializar
        const adminSimples = new AdminSimples();
        window.adminSimples = adminSimples;

        // ============================================
        // FUNÇÃO PARA FECHAR MENU E VOLTAR
        // ============================================
        function fecharMenuEVoltar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            
            if (sidebar) {
                sidebar.classList.remove('active');
            }
            
            if (overlay) {
                overlay.classList.remove('active');
            }
            
            document.body.style.overflow = '';
            
            // Rolar para o topo suavemente
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>
