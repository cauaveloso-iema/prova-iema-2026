<!-- frontend/admin-simples.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Simples - Sistema de Provas</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sistema de Provas">

    <!-- 🔥 FAVICON LOCAL (NÃO DEPENDE DE INTERNET) -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/favicon.ico">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #2c3e50;
            color: white;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: all 0.3s;
            z-index: 1000;
        }

        .sidebar.collapsed {
            transform: translateX(-260px);
        }

        .sidebar-header {
            padding: 20px;
            background: #1e2b37;
            text-align: center;
            border-bottom: 1px solid #3a4a5a;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo i {
            color: #3498db;
            margin-right: 5px;
        }

        .user-info {
            padding: 15px 20px;
            background: #243342;
            margin-bottom: 10px;
            border-left: 3px solid #3498db;
            position: relative;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .user-email {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 3px;
            word-break: break-all;
        }

        .notificacao-sidebar {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
        }

        .notificacao-sidebar .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e74c3c;
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            transition: 0.3s;
            cursor: pointer;
            gap: 10px;
            position: relative;
        }

        .nav-item i {
            width: 20px;
            text-align: center;
        }

        .nav-item:hover {
            background: #34495e;
            color: white;
        }

        .nav-item.active {
            background: #3498db;
            color: white;
        }

        .nav-item .notificacao-badge {
            position: absolute;
            right: 10px;
            background: #e74c3c;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        .sidebar-footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 20px;
            border-top: 1px solid #3a4a5a;
        }

        .logout-btn {
            width: 100%;
            padding: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
            transition: all 0.3s;
        }

        .main-content.expanded {
            margin-left: 0;
        }

        .top-bar {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #333;
            margin-right: 15px;
            display: none;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .notificacao-icone {
            position: relative;
            cursor: pointer;
            font-size: 20px;
            color: #555;
        }

        .notificacao-icone .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e74c3c;
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        .datetime {
            color: #666;
            font-size: 14px;
        }

        /* Notificações Panel */
        .notificacoes-panel {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 380px;
            max-width: calc(100% - 40px);
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            animation: slideDown 0.3s ease;
            max-height: 80vh;
            overflow-y: auto;
        }

        .notificacoes-panel.active {
            display: block;
        }

        .notificacoes-header {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            border-radius: 12px 12px 0 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .notificacoes-header h3 {
            font-size: 16px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notificacoes-header h3 i {
            color: #3498db;
        }

        .notificacoes-actions {
            display: flex;
            gap: 8px;
        }

        .btn-notificacao {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: 0.3s;
            font-size: 14px;
        }

        .btn-notificacao:hover {
            background: #e9ecef;
            color: #333;
        }

        .notificacoes-list {
            padding: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .notificacao-item {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-left: 4px solid transparent;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }

        .notificacao-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .notificacao-item.nao-lida {
            background: #e8f4fd;
            border-left-color: #3498db;
        }

        .notificacao-item .notificacao-titulo {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notificacao-item .notificacao-mensagem {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .notificacao-item .notificacao-tempo {
            font-size: 11px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .notificacao-item .notificacao-icone {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
        }

        .notificacao-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: none;
            gap: 5px;
        }

        .notificacao-item:hover .notificacao-actions {
            display: flex;
        }

        .notificacao-actions button {
            background: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .notificacao-actions button:hover {
            background: #f0f0f0;
        }

        .notificacao-actions button.delete:hover {
            color: #e74c3c;
        }

        .empty-notificacoes {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .empty-notificacoes i {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-icon.blue { background: #e3f2fd; color: #1976d2; }
        .stat-icon.green { background: #e8f5e9; color: #388e3c; }
        .stat-icon.orange { background: #fff3e0; color: #f57c00; }
        .stat-icon.purple { background: #f3e5f5; color: #8e24aa; }
        .stat-icon.red { background: #ffebee; color: #c62828; }

        .stat-content h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }

        .stat-detail {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* Tab Content */
        .tab-content {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 18px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-success {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #e9ecef;
        }

        tr:hover td {
            background: #f8f9fa;
        }

        /* Status Badges */
        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        .status-badge.active { background: #d4edda; color: #155724; }
        .status-badge.inactive { background: #f8d7da; color: #721c24; }
        .status-badge.pending { background: #fff3cd; color: #856404; }
        .status-badge.info { background: #d1ecf1; color: #0c5460; }
        .status-badge.warning { background: #fff3cd; color: #856404; }
        .status-badge.primary { background: #cfe2ff; color: #084298; }

        /* Role Badges */
        .role-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        .role-badge.admin { background: #cfe2ff; color: #084298; }
        .role-badge.professor { background: #d1e7dd; color: #0f5132; }
        .role-badge.aluno { background: #fff3cd; color: #856404; }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }

        .btn-icon {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 4px;
            background: none;
            cursor: pointer;
            color: #666;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            font-size: 12px;
        }

        .btn-icon:hover {
            background: #e9ecef;
            color: #3498db;
        }

        .btn-icon.edit:hover { color: #f39c12; }
        .btn-icon.delete:hover { color: #e74c3c; }
        .btn-icon.success:hover { background: #d4edda; color: #27ae60; }
        .btn-icon.warning:hover { background: #fff3cd; color: #f39c12; }

        /* Filters Bar */
        .filters-bar {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filter-group {
            flex: 1;
            min-width: 150px;
        }

        .filter-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #555;
        }

        .form-control {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 13px;
        }

        .form-control:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn-filter {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-pagination {
            padding: 5px 10px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-pagination.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }

        .btn-pagination:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .modal-content {
            background: white;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideDown 0.3s ease;
        }

        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            border-radius: 10px 10px 0 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            line-height: 1;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: #f8f9fa;
            border-radius: 0 0 10px 10px;
            position: sticky;
            bottom: 0;
        }

        .btn-save {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-cancel {
            background: #e9ecef;
            color: #666;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Form */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-card {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 5px;
            font-size: 12px;
            color: #084298;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .info-card i {
            font-size: 18px;
        }

        /* Loading */
        .loading-spinner {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            margin: 0 auto 10px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-small {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #666;
            font-size: 12px;
        }

        .loading-small i {
            animation: spin 1s linear infinite;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
        }

        .empty-state i {
            font-size: 48px;
            color: #dee2e6;
            margin-bottom: 10px;
        }

        .empty-state h3 {
            color: #666;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .empty-state p {
            color: #999;
            font-size: 13px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 5px;
            color: white;
            z-index: 9999;
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 250px;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.success { background: #28a745; }
        .toast.error { background: #dc3545; }
        .toast.info { background: #17a2b8; }
        .toast.warning { background: #ffc107; color: #333; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-260px);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .menu-toggle {
                display: block;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .filters-bar {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .notificacoes-panel {
                top: 60px;
                right: 10px;
                width: calc(100% - 20px);
            }
        }

        /* Acessibilidade */
        .badge-acessibilidade {
            background: #f39c12;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <!-- Header com Botão Voltar -->
            <div class="sidebar-header">
                <div class="menu-header">
                    <div class="logo-area">
                        <i class="fas fa-graduation-cap"></i>
                        <span>Sistema de Provas Admin</span>
                    </div>
                    <button class="btn-voltar-inicio" onclick="fecharMenuEVoltar()">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </button>
                </div>
            </div>

            <!-- User Info (mantido igual) -->
            <div class="user-info" id="userInfo">
                <div class="user-name" id="adminNome">Carregando...</div>
                <div class="user-email" id="adminEmail">...</div>
                
                <div class="notificacao-sidebar" onclick="adminSimples.abrirPainelNotificacoes()">
                    <i class="fas fa-bell"></i>
                    <span class="badge" id="sidebarNotificacaoBadge">0</span>
                </div>
            </div>

            <!-- Navegação (mantida igual) -->
            <nav>
                <div class="nav-item" data-section="dashboard" onclick="adminSimples.mudarAba('dashboard')">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </div>
                <div class="nav-item" data-section="usuarios" onclick="adminSimples.mudarAba('usuarios')">
                    <i class="fas fa-users"></i> Usuários
                    <span class="notificacao-badge" id="menuNotificacaoBadge" style="display: none;">0</span>
                </div>
                <div class="nav-item" data-section="turmas" onclick="adminSimples.mudarAba('turmas')">
                    <i class="fas fa-school"></i> Turmas
                </div>
                <div class="nav-item" data-section="provas" onclick="adminSimples.mudarAba('provas')">
                    <i class="fas fa-file-alt"></i> Provas
                </div>
                <div class="nav-item" data-section="resultados" onclick="adminSimples.mudarAba('resultados')">
                    <i class="fas fa-chart-bar"></i> Resultados
                </div>
            </nav>

            <!-- Footer (mantido igual) -->
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="adminSimples.logout()">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <div class="top-bar">
                <div style="display: flex; align-items: center;">
                    <button class="menu-toggle" id="menuToggle" onclick="adminSimples.toggleMenu()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="page-title" id="pageTitle">Dashboard</span>
                </div>
                
                <div class="top-bar-actions">
                    <div class="notificacao-icone" onclick="adminSimples.abrirPainelNotificacoes()">
                        <i class="fas fa-bell"></i>
                        <span class="badge" id="topNotificacaoBadge">0</span>
                    </div>
                    <div class="datetime" id="datetime"></div>
                </div>
            </div>

            <!-- Painel de Notificações -->
            <div class="notificacoes-panel" id="notificacoesPanel">
                <div class="notificacoes-header">
                    <h3><i class="fas fa-bell"></i> Notificações</h3>
                    <div class="notificacoes-actions">
                        <button class="btn-notificacao" onclick="adminSimples.marcarTodasLidas()" title="Marcar todas como lidas">
                            <i class="fas fa-check-double"></i>
                        </button>
                        <button class="btn-notificacao" onclick="adminSimples.fecharPainelNotificacoes()" title="Fechar">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div class="notificacoes-list" id="notificacoesList">
                    <div class="empty-notificacoes">
                        <i class="fas fa-bell-slash"></i>
                        <p>Nenhuma notificação</p>
                    </div>
                </div>
            </div>

            <!-- Toast Container -->
            <div id="toastContainer" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;"></div>

            <!-- Content Area -->
            <div id="contentArea">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Carregando sistema...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Título</h3>
                <button class="modal-close" onclick="adminSimples.fecharModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="adminSimples.fecharModal()">Cancelar</button>
                <button class="btn-save" id="modalSaveBtn" onclick="adminSimples.salvarModal()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal" id="confirmModal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3 id="confirmTitle">Confirmar</h3>
                <button class="modal-close" onclick="adminSimples.fecharConfirmModal()">&times;</button>
            </div>
            <div class="modal-body" id="confirmMessage"></div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="adminSimples.fecharConfirmModal()">Não</button>
                <button class="btn-save" id="confirmBtn">Sim</button>
            </div>
        </div>
    </div>

    <script>
        class AdminSimples {
            constructor() {
                this.abaAtual = 'dashboard';
                this.usuarios = [];
                this.turmas = [];
                this.provas = [];
                this.resultados = [];
                this.notificacoes = [];
                this.paginaAtual = 1;
                this.itensPorPagina = 10;
                this.usuario = null;
                
                this.init();
            }

            async init() {
                console.log('🚀 Inicializando admin simples...');
                await this.verificarAuth();
                this.atualizarDataHora();
                setInterval(() => this.atualizarDataHora(), 1000);
                
                await this.carregarNotificacoes();
                setInterval(() => this.carregarNotificacoes(), 30000);
                
                // CARREGAR DADOS AO INICIAR
                await this.carregarUsuarios();
                await this.carregarTurmas();
                await this.carregarProvas(); // <-- ESSA LINHA É CRÍTICA
                await this.carregarResultados();
                
                await this.carregarDashboard();
            }

            async verificarAuth() {
                const token = localStorage.getItem('auth_token');
                const userData = JSON.parse(localStorage.getItem('user_data') || '{}');

                if (!token) {
                    window.location.href = 'login.html';
                    return;
                }

                if (userData.role !== 'admin' && userData.role !== 'super_admin') {
                    this.showToast('❌ Acesso negado', 'error');
                    window.location.href = userData.role === 'professor' ? 'index.html' : 'aluno.html';
                    return;
                }

                this.usuario = userData;
                document.getElementById('adminNome').textContent = userData.nome || 'Administrador';
                document.getElementById('adminEmail').textContent = userData.email || 'admin@iemasaoluiscentro.net';
                
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.dataset.section === 'dashboard') {
                        item.classList.add('active');
                    }
                });
            }

            toggleMenu() {
                document.getElementById('sidebar').classList.toggle('active');
            }

            atualizarDataHora() {
                const agora = new Date();
                document.getElementById('datetime').textContent = agora.toLocaleString('pt-BR');
            }

            // ============ SISTEMA DE NOTIFICAÇÕES ============
            async carregarNotificacoes() {
                try {
                    const token = localStorage.getItem('auth_token');
                    
                    const countResponse = await fetch('/api/notificacoes/nao-lidas/contador', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (countResponse.ok) {
                        const countData = await countResponse.json();
                        this.atualizarBadgesNotificacoes(countData.count || 0);
                    }
                    
                    const response = await fetch('/api/notificacoes?limite=20', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.notificacoes = data.notificacoes || [];
                        this.renderizarNotificacoes();
                    }
                } catch (error) {
                    console.error('Erro ao carregar notificações:', error);
                }
            }

            atualizarBadgesNotificacoes(total) {
                const badges = [
                    'sidebarNotificacaoBadge',
                    'topNotificacaoBadge',
                    'menuNotificacaoBadge'
                ];
                
                badges.forEach(id => {
                    const badge = document.getElementById(id);
                    if (badge) {
                        if (total > 0) {
                            badge.textContent = total > 99 ? '99+' : total;
                            badge.style.display = 'inline';
                        } else {
                            badge.style.display = 'none';
                        }
                    }
                });
            }

            renderizarNotificacoes() {
                const list = document.getElementById('notificacoesList');
                if (!list) return;
                
                if (!this.notificacoes || this.notificacoes.length === 0) {
                    list.innerHTML = `
                        <div class="empty-notificacoes">
                            <i class="fas fa-bell-slash"></i>
                            <p>Nenhuma notificação</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                this.notificacoes.slice(0, 10).forEach(notif => {
                    const data = new Date(notif.createdAt);
                    const agora = new Date();
                    const diffMs = agora - data;
                    const diffMin = Math.floor(diffMs / 60000);
                    const diffHora = Math.floor(diffMs / 3600000);
                    const diffDia = Math.floor(diffMs / 86400000);
                    
                    let tempoTexto = '';
                    if (diffMin < 1) tempoTexto = 'agora mesmo';
                    else if (diffMin < 60) tempoTexto = `há ${diffMin} min`;
                    else if (diffHora < 24) tempoTexto = `há ${diffHora} h`;
                    else tempoTexto = `há ${diffDia} d`;
                    
                    const naoLida = !notif.lida ? 'nao-lida' : '';
                    
                    html += `
                        <div class="notificacao-item ${naoLida}" data-id="${notif._id}" onclick="adminSimples.verNotificacao('${notif._id}')">
                            <div class="notificacao-titulo">
                                <span class="notificacao-icone" style="background: ${notif.cor || '#3498db'}20; color: ${notif.cor || '#3498db'};">
                                    <i class="fas ${notif.icone || 'fa-bell'}"></i>
                                </span>
                                ${notif.titulo || 'Notificação'}
                            </div>
                            <div class="notificacao-mensagem">${notif.mensagem || ''}</div>
                            <div class="notificacao-tempo">
                                <i class="far fa-clock"></i> ${tempoTexto}
                            </div>
                            <div class="notificacao-actions">
                                <button onclick="event.stopPropagation(); adminSimples.marcarLida('${notif._id}')" title="Marcar como lida">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button class="delete" onclick="event.stopPropagation(); adminSimples.excluirNotificacao('${notif._id}')" title="Excluir">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                
                list.innerHTML = html;
            }

            abrirPainelNotificacoes() {
                document.getElementById('notificacoesPanel').classList.toggle('active');
                this.carregarNotificacoes();
            }

            fecharPainelNotificacoes() {
                document.getElementById('notificacoesPanel').classList.remove('active');
            }

            async marcarLida(id) {
                try {
                    const token = localStorage.getItem('auth_token');
                    
                    const response = await fetch(`/api/notificacoes/${id}/lida`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        await this.carregarNotificacoes();
                    }
                } catch (error) {
                    console.error('Erro ao marcar como lida:', error);
                }
            }

            async marcarTodasLidas() {
                try {
                    const token = localStorage.getItem('auth_token');
                    
                    const response = await fetch('/api/notificacoes/marcar-todas-lidas', {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        await this.carregarNotificacoes();
                        this.showToast('✅ Todas notificações marcadas como lidas', 'success');
                    }
                } catch (error) {
                    console.error('Erro ao marcar todas como lidas:', error);
                }
            }

            async excluirNotificacao(id) {
                try {
                    const token = localStorage.getItem('auth_token');
                    
                    const response = await fetch(`/api/notificacoes/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        await this.carregarNotificacoes();
                        this.showToast('✅ Notificação excluída', 'success');
                    }
                } catch (error) {
                    console.error('Erro ao excluir notificação:', error);
                }
            }

            async verNotificacao(id) {
                await this.marcarLida(id);
                const notif = this.notificacoes.find(n => n._id === id);
                if (notif && notif.link) {
                    window.location.href = notif.link;
                }
            }

            // ============ MUDAR ABA ============
            async mudarAba(aba) {
                this.abaAtual = aba;
                
                document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
                document.querySelectorAll('.nav-item[data-section="' + aba + '"]').forEach(item => item.classList.add('active'));

                const titulos = {
                    dashboard: 'Dashboard',
                    usuarios: 'Gerenciar Usuários',
                    turmas: 'Gerenciar Turmas',
                    provas: 'Gerenciar Provas',
                    resultados: 'Resultados'
                };
                document.getElementById('pageTitle').textContent = titulos[aba] || 'Dashboard';

                switch(aba) {
                    case 'dashboard': await this.carregarDashboard(); break;
                    case 'usuarios': await this.carregarUsuarios(); break;
                    case 'turmas': await this.carregarTurmas(); break;
                    case 'provas': await this.carregarProvas(); break;
                    case 'resultados': await this.carregarResultados(); break;
                }
                
                this.fecharPainelNotificacoes();
            }

            // ============ DASHBOARD ============
            async carregarDashboard() {
                const content = document.getElementById('contentArea');
                
                try {
                    const response = await fetch('/api/admin/dashboard', {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('auth_token')}` }
                    });

                    const data = await response.json();
                    const stats = data.success ? data.data : this.getDadosExemplo();

                    content.innerHTML = `
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-icon blue"><i class="fas fa-users"></i></div>
                                <div class="stat-content">
                                    <h3>Total de Usuários</h3>
                                    <div class="stat-number">${stats.totalUsuarios || 0}</div>
                                    <div class="stat-detail">${stats.totalAlunos || 0} alunos • ${stats.totalProfessores || 0} professores</div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon green"><i class="fas fa-school"></i></div>
                                <div class="stat-content">
                                    <h3>Turmas</h3>
                                    <div class="stat-number">${stats.totalTurmas || 0}</div>
                                    <div class="stat-detail">${stats.turmasAtivas || 0} ativas</div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon orange"><i class="fas fa-file-alt"></i></div>
                                <div class="stat-content">
                                    <h3>Provas</h3>
                                    <div class="stat-number">${stats.totalProvas || 0}</div>
                                    <div class="stat-detail">${stats.provasPorStatus?.ativa || 0} ativas</div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon purple"><i class="fas fa-chart-bar"></i></div>
                                <div class="stat-content">
                                    <h3>Resultados</h3>
                                    <div class="stat-number">${stats.totalResultados || 0}</div>
                                    <div class="stat-detail">Média: ${stats.mediaGeral || '0.0'}</div>
                                </div>
                            </div>
                        </div>

                        <div style="background: white; border-radius: 10px; padding: 20px;">
                            <h3 style="margin-bottom: 15px;">📋 Últimas Atividades</h3>
                            <div id="atividades">
                                ${this.gerarAtividades(stats.atividadesRecentes)}
                            </div>
                        </div>
                    `;
                } catch (error) {
                    content.innerHTML = `<p style="color: red;">Erro: ${error.message}</p>`;
                }
            }

            getDadosExemplo() {
                return {
                    totalUsuarios: 150,
                    totalAlunos: 120,
                    totalProfessores: 28,
                    totalTurmas: 12,
                    turmasAtivas: 10,
                    totalProvas: 45,
                    provasPorStatus: { ativa: 25 },
                    totalResultados: 230,
                    mediaGeral: 7.2,
                    atividadesRecentes: []
                };
            }

            gerarAtividades(atividades) {
                if (!atividades || atividades.length === 0) {
                    return '<p style="color: #999;">Nenhuma atividade recente</p>';
                }
                return atividades.slice(0, 5).map(a => `
                    <div style="padding: 10px; border-bottom: 1px solid #eee;">
                        <strong>${a.usuario}</strong> ${a.acao} <strong>${a.prova}</strong>
                        <br><small>${new Date(a.data).toLocaleString()}</small>
                    </div>
                `).join('');
            }

            // ============ CARREGAR USUÁRIOS (VERSÃO COMPLETA E CORRIGIDA) ============
            async carregarUsuarios() {
                console.log('📢 CARREGANDO USUÁRIOS...');
                const content = document.getElementById('contentArea');
                
                // Mostrar loading
                content.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><p>Carregando usuários...</p></div>';

                try {
                    const token = localStorage.getItem('auth_token');
                    const userData = JSON.parse(localStorage.getItem('user_data') || '{}');
                    const isAdminNormal = userData.role === 'admin'; // Admin normal
                    const isSuperAdmin = userData.role === 'super_admin';
                    
                    console.log('🔑 Token:', token ? 'OK' : 'NULO');
                    console.log('👤 Usuário logado:', userData.role);
                    
                    const response = await fetch('/api/admin/usuarios?limit=100', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    console.log('📡 Resposta status:', response.status);
                    
                    if (!response.ok) {
                        throw new Error(`Erro HTTP: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    console.log('📦 Dados recebidos:', data);

                    if (!data.success) {
                        throw new Error(data.error || 'Erro ao carregar usuários');
                    }

                    // 🔥 FILTRAGEM: Admin normal não vê super_admins
                    let usuarios = data.usuarios || [];
                    
                    if (isAdminNormal) {
                        const totalAntes = usuarios.length;
                        usuarios = usuarios.filter(u => u.role !== 'super_admin');
                        console.log(`🔍 Admin normal: removidos ${totalAntes - usuarios.length} super_admins`);
                    }
                    
                    // Se for super_admin, mantém todos
                    if (isSuperAdmin) {
                        console.log('👑 Super Admin: mostrando todos os usuários');
                    }

                    this.usuarios = usuarios;
                    console.log(`✅ Usuários carregados: ${this.usuarios.length}`);

                    // Renderizar a interface
                    content.innerHTML = `
                        <div class="section-header">
                            <h2><i class="fas fa-users"></i> Usuários</h2>
                            <button class="btn-primary" onclick="adminSimples.novoUsuario()">
                                <i class="fas fa-plus"></i> Novo
                            </button>
                        </div>

                        <div class="filters-bar">
                            <div class="filter-group">
                                <label><i class="fas fa-search"></i> Buscar</label>
                                <input type="text" id="buscaUsuario" placeholder="Nome, email ou matrícula..." 
                                    class="form-control" onkeyup="adminSimples.filtrarUsuarios()" autocomplete="off">
                            </div>
                            <div class="filter-group">
                                <label><i class="fas fa-user-tag"></i> Perfil</label>
                                <select id="filtroRole" class="form-control" onchange="adminSimples.filtrarUsuarios()">
                                    <option value="todos">Todos</option>
                                    <option value="aluno">Alunos</option>
                                    <option value="professor">Professores</option>
                                    <option value="admin">Admins</option>
                                </select>
                            </div>
                            <div class="filter-actions">
                                <button class="btn-filter" onclick="adminSimples.limparFiltrosUsuarios()">
                                    <i class="fas fa-eraser"></i> Limpar
                                </button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>Email</th>
                                        <th>Perfil</th>
                                        <th>Matrícula</th>
                                        <th>CPF</th>
                                        <th>Telefone</th>
                                        <th>Status</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaUsuarios">
                                    ${this.gerarLinhasUsuarios(this.usuarios)}
                                </tbody>
                            </table>
                        </div>

                        <div class="pagination">
                            <button class="btn-pagination" onclick="adminSimples.paginaAnterior('usuarios')" id="btnAnteriorUsuario" disabled>
                                <i class="fas fa-chevron-left"></i> Anterior
                            </button>
                            <span id="pageInfoUsuario">Página 1 de 1</span>
                            <button class="btn-pagination" onclick="adminSimples.proximaPagina('usuarios')" id="btnProximaUsuario" disabled>
                                Próxima <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    `;

                    // Inicializar variáveis de paginação
                    this.paginaAtualUsuario = 1;
                    this.usuariosFiltrados = [...this.usuarios];
                    this.itensPorPagina = 10;
                    
                    // Atualizar a tabela com paginação
                    this.atualizarTabelaUsuarios();
                    
                } catch (error) {
                    console.error('❌ Erro ao carregar usuários:', error);
                    content.innerHTML = `
                        <div class="error-container" style="text-align: center; padding: 40px;">
                            <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #dc3545; margin-bottom: 15px;"></i>
                            <h3 style="color: #721c24;">Erro ao carregar usuários</h3>
                            <p style="color: #6c757d;">${error.message}</p>
                            <button onclick="adminSimples.carregarUsuarios()" class="btn-primary" style="margin-top: 15px;">
                                <i class="fas fa-sync-alt"></i> Tentar novamente
                            </button>
                        </div>
                    `;
                }
            }

            // ============ GERAR LINHAS USUÁRIOS (COM FILTRO) ============
            gerarLinhasUsuarios(usuarios) {
                // 🔥 FILTRO: Admin normal não vê super_admins
                const usuariosFiltrados = usuarios.filter(u => u.role !== 'super_admin');
                
                console.log('Usuários após filtrar super_admin:', usuariosFiltrados.length);
                
                if (!usuariosFiltrados || usuariosFiltrados.length === 0) {
                    return '<tr><td colspan="6" class="empty-state">Nenhum usuário encontrado</td></tr>';
                }

                return usuariosFiltrados.map(u => {
                    // Formatar CPF e Telefone se existirem
                    const cpfFormatado = u.cpf ? u.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : '-';

            atualizarTabelaUsuarios() {
                if (!this.usuariosFiltrados) return;
                
                const inicio = (this.paginaAtualUsuario - 1) * this.itensPorPagina;
                const fim = inicio + this.itensPorPagina;
                const pagina = this.usuariosFiltrados.slice(inicio, fim);
                
                document.getElementById('tabelaUsuarios').innerHTML = this.gerarLinhasUsuarios(pagina);
                
                const totalPaginas = Math.ceil(this.usuariosFiltrados.length / this.itensPorPagina);
                document.getElementById('pageInfoUsuario').textContent = `Página ${this.paginaAtualUsuario} de ${totalPaginas}`;
                document.getElementById('btnAnteriorUsuario').disabled = this.paginaAtualUsuario === 1;
                document.getElementById('btnProximaUsuario').disabled = this.paginaAtualUsuario === totalPaginas;
            }

            // ============ FILTRAR USUÁRIOS ============
            filtrarUsuarios() {
                const busca = document.getElementById('buscaUsuario')?.value.toLowerCase() || '';
                const role = document.getElementById('filtroRole')?.value || 'todos';
                
                // Filtrar removendo super_admin primeiro
                const usuariosSemSuper = this.usuarios.filter(u => u.role !== 'super_admin');
                
                this.usuariosFiltrados = usuariosSemSuper.filter(u => {
                    const matchBusca = busca === '' || 
                        (u.nome && u.nome.toLowerCase().includes(busca)) ||
                        (u.email && u.email.toLowerCase().includes(busca));
                    
                    const matchRole = role === 'todos' || u.role === role;
                    
                    return matchBusca && matchRole;
                });
                
                this.paginaAtualUsuario = 1;
                this.atualizarTabelaUsuarios();
            }

            paginaAnterior(tipo) {
                if (tipo === 'usuarios') {
                    if (this.paginaAtualUsuario > 1) {
                        this.paginaAtualUsuario--;
                        this.atualizarTabelaUsuarios();
                    }
                } else if (tipo === 'turmas') {
                    if (this.paginaAtualTurma > 1) {
                        this.paginaAtualTurma--;
                        this.atualizarTabelaTurmas();
                    }
                }
            }

            proximaPagina(tipo) {
                if (tipo === 'usuarios') {
                    const totalPaginas = Math.ceil(this.usuariosFiltrados.length / this.itensPorPagina);
                    if (this.paginaAtualUsuario < totalPaginas) {
                        this.paginaAtualUsuario++;
                        this.atualizarTabelaUsuarios();
                    }
                } else if (tipo === 'turmas') {
                    const totalPaginas = Math.ceil(this.turmasFiltradas.length / this.itensPorPagina);
                    if (this.paginaAtualTurma < totalPaginas) {
                        this.paginaAtualTurma++;
                        this.atualizarTabelaTurmas();
                    }
                }
            }

                this.abrirModalUsuario();

            async editarUsuario(id) {
                const usuario = this.usuarios.find(u => u._id === id);
                if (usuario) {
                    if (usuario.role === 'super_admin') {
                        this.showToast('❌ Não é possível editar Super Admins', 'error');
                        return;
                    }
                    this.abrirModalUsuario(usuario);
                }
            }

            async resetarSenha(id) {
                const usuario = this.usuarios.find(u => u._id === id);
                if (!usuario) return;
                
                if (usuario.role === 'super_admin') {
                    this.showToast('❌ Não é possível resetar senha de Super Admins', 'error');
                    return;
                }
                
                const novaSenha = Math.random().toString(36).slice(-8);
                
                if (confirm(`Resetar senha de ${usuario.nome}? Nova senha: ${novaSenha}`)) {
                    try {
                        this.showToast('Processando...', 'info');
                        
                        const response = await fetch(`/api/admin/usuarios/${id}/reset-password`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${localStorage.getItem('auth_token')}`
                            },
                            body: JSON.stringify({ novaSenha })
                        });
                        
                        const data = await response.json();
                        
                        if (data.success) {
                            this.showToast(`✅ Nova senha: ${novaSenha}`, 'success');
                        } else {
                            throw new Error(data.error || 'Erro ao resetar senha');
                        }
                        
                    } catch (error) {
                        this.showToast('❌ ' + error.message, 'error');
                    }
                }
            }

                    role: roleSelecionada,
                    ativo: document.getElementById('statusUsuario').value === 'true'
                };

                    const senha = document.getElementById('senhaUsuario').value;
                    if (senha) dados.password = senha;
                }

                this.showToast('Salvando...', 'info');

                try {
                    const url = id ? `/api/admin/usuarios/${id}` : '/api/admin/usuarios';
                    const method = id ? 'PUT' : 'POST';

                    const response = await fetch(url, {
                        method,
                        headers: {

                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(dados)
                    });

                        this.showToast(id ? 'Usuário atualizado!' : 'Usuário criado!', 'success');

                // Abrir modal usando o método abrirModal com o título e conteúdo
                this.abrirModal(titulo, conteudoHTML, true);
                
                // Configurar o botão salvar
                document.getElementById('modalSaveBtn').onclick = () => this.salvarTurma(id);
            }

            async salvarTurma(id = null) {
                const dados = {
                    nome: document.getElementById('nomeTurma').value,
                    disciplina: document.getElementById('disciplinaTurma').value,
                    eixo: document.getElementById('eixoTurma').value,
                    ativa: document.getElementById('ativaTurma').checked
                };

                this.showToast('Salvando...', 'info');

                try {
                    const url = id ? `/api/admin/turmas/${id}` : '/api/admin/turmas';
                    const method = id ? 'PUT' : 'POST';

                    const response = await fetch(url, {
                        method,
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('auth_token')}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(dados)
                    });

                    const data = await response.json();

                    if (data.success) {
                        this.showToast(id ? 'Turma atualizada!' : 'Turma criada!', 'success');
                        this.fecharModal();
                        await this.carregarTurmas();
                    } else {
                        throw new Error(data.error || 'Erro ao salvar');
                    }
                } catch (error) {
                    this.showToast('❌ ' + error.message, 'error');
                }
            }

            // ============ CARREGAR PROVAS COM FILTROS ============

                    if (filtros.status && filtros.status !== 'todos') {
                        url += `&status=${filtros.status}`;
                    }
                    if (filtros.tipo && filtros.tipo !== 'todos') {
                        url += `&tipo=${filtros.tipo}`;
                    }
                    if (filtros.eixo && filtros.eixo !== 'todos') {
                        url += `&eixo=${filtros.eixo}`;
                    }
                    if (filtros.professor && filtros.professor !== 'todos') {
                        url += `&professorId=${filtros.professor}`;
                    }
                    if (filtros.busca) {
                        url += `&search=${encodeURIComponent(filtros.busca)}`;
                    }
                    
                    const response = await fetch(url, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('auth_token')}` }
                    });

                    const data = await response.json();
                    this.provas = data.success ? data.provas : [];

                    content.innerHTML = `

                                </button>
                                <button class="btn-primary" onclick="adminSimples.limparFiltros()">
                                    <i class="fas fa-eraser"></i> Limpar Filtros
                                </button>
