<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Acadêmico - EducaPleno</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Calendário Academico">

    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/favicon.ico">

    <link rel="stylesheet" href="css/calendario.css">
    <script src="js/dialog-helper.js"></script>

    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => console.log('✅ Service Worker registrado:', registration.scope))
          .catch(error => console.log('❌ Service Worker falhou:', error));
      });
    }
    </script>
</head>
<body>
    <div class="calendario-container">

        <!-- HEADER -->
        <div class="calendario-header">
            <div class="header-content">
                <div class="header-icon">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div class="header-text">
                    <h1>Calendário Acadêmico</h1>
                    <p>Gerencie eventos, provas e prazos do ano letivo</p>
                </div>
                <button class="btn-voltar" id="btnVoltarCalendario">
                    <i class="fas fa-arrow-left"></i>
                    <span id="textoBotaoVoltar">Voltar ao Painel</span>
                </button>
            </div>
        </div>

        <!-- RODÍZIO (somente aluno) -->
        <div class="rodizio-widget" id="rodizioWidget" style="display:none;">
            <div class="rodizio-header">
                <div class="rodizio-icon">
                    <i class="fas fa-utensils"></i>
                </div>
                <div>
                    <h3>Horário do Almoço</h3>
                    <p>Consulte os dias que sua turma pode almoçar</p>
                </div>
            </div>
            <div id="rodizioLoading" class="rodizio-loading">
                <span>Verificando horário do almoço...</span>
            </div>
            <div id="rodizioContent" style="display:none;">
                <div class="rodizio-status" id="rodizioStatus"></div>
                <div class="dias-permitidos" id="diasPermitidos">
                    <h4><i class="fas fa-calendar-week"></i> Próximos dias que você pode almoçar:</h4>
                    <div class="dias-lista" id="listaDiasPermitidos"></div>
                </div>
            </div>
        </div>

        <!-- NAVEGAÇÃO DE MÊS -->
        <div class="mes-navegacao">
            <h2 class="mes-titulo" id="mesAtual">Carregando...</h2>
            <div class="mes-botoes">
                <button class="btn-mes" id="btnMesAnterior"><i class="fas fa-chevron-left"></i></button>
                <button class="btn-mes" id="btnProximoMes"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- FILTROS -->
        <div class="filtros-container" id="filtrosContainer">

            <div class="filtro-group" id="filtroTipoGroup">
                <label><i class="fas fa-filter"></i> Tipo de Evento</label>
                <select class="filtro-select" id="filtroTipo">
                    <option value="todos">Todos</option>
                    <option value="prova">📝 Provas</option>
                    <option value="lembrete">🔔 Lembretes</option>
                    <option value="feriado">🎉 Feriados</option>
                    <option value="reuniao">👥 Reuniões</option>
                    <option value="prazo">⏰ Prazos</option>
                </select>
            </div>

            <div class="filtro-group" id="filtroProfessorGroup">
                <label><i class="fas fa-chalkboard-teacher"></i> Professor</label>
                <select class="filtro-select" id="filtroProfessor">
                    <option value="todos">Todos</option>
                </select>
            </div>

            <div class="filtro-group" id="filtroTurmaGroup">
                <label><i class="fas fa-school"></i> Turma</label>
                <select class="filtro-select" id="filtroTurma">
                    <option value="todas">Todas</option>
                </select>
            </div>

            <button class="btn-criar" id="btnCriarEvento" style="display:none;">
                <i class="fas fa-plus-circle"></i>
                Novo Evento
            </button>
        </div>

        <!-- GRID -->
        <div class="calendario-grid" id="calendarioGrid"></div>

        <!-- PRÓXIMOS -->
        <div class="proximos-eventos">
            <h3><i class="fas fa-clock"></i> Próximos Eventos</h3>
            <div id="proximosEventosLista">
                <p style="color:#6c757d;text-align:center;padding:20px;">Carregando...</p>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-calendar-plus"></i> Evento</h2>
                <button class="modal-close" onclick="calendario.fecharModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <script src="js/calendario.js"></script>

    <!-- RODÍZIO (aluno) -->
    <script>
    async function carregarRodizioAluno() {
        const token = localStorage.getItem('auth_token');
        const userData = JSON.parse(localStorage.getItem('user_data') || '{}');
        const isAluno = userData.role === 'aluno';
        const widget = document.getElementById('rodizioWidget');

        if (!widget || !isAluno) return;

        widget.style.display = 'block';
        if (!token) return;

        const loadingDiv = document.getElementById('rodizioLoading');
        const contentDiv = document.getElementById('rodizioContent');

        try {
            const response = await fetch('/api/rodizio/meu-rodizio', {
                headers: { Authorization: `Bearer ${token}` }
            });
            const data = await response.json();

            loadingDiv.style.display = 'none';
            contentDiv.style.display = 'block';

            const statusDiv = document.getElementById('rodizioStatus');
            const diasContainer = document.getElementById('listaDiasPermitidos');

            if (!data.success) {
                statusDiv.innerHTML = `<div class="status-badge-rodizio status-negado">
                    <i class="fas fa-exclamation-triangle"></i>
                    <strong>❌ ${data.error || 'Erro ao carregar rodízio'}</strong>
                </div>`;
                return;
            }

            if (!data.temRodizio) {
                statusDiv.innerHTML = `<div class="status-badge-rodizio status-info">
                    <i class="fas fa-info-circle"></i>
                    <strong>⚠️ ${data.motivo || 'Sua turma ainda não tem rodízio configurado'}</strong>
                </div>`;
                document.getElementById('diasPermitidos').style.display = 'none';
                return;
            }

            if (data.podeAlmocarHoje) {
                statusDiv.innerHTML = `<div class="status-badge-rodizio status-permitido">
                    <i class="fas fa-check-circle"></i>
                    <strong>✅ Você pode almoçar hoje!</strong>
                    <span class="horario-info ms-2">
                        <i class="fas fa-clock"></i> ${data.horarioInicio} às ${data.horarioFim}
                    </span>
                </div>`;
            } else {
                statusDiv.innerHTML = `<div class="status-badge-rodizio status-negado">
                    <i class="fas fa-times-circle"></i>
                    <strong>❌ Hoje não é dia de almoço para sua turma</strong>
                </div>`;
            }

            if (data.diasPermitidos && data.diasPermitidos.length > 0) {
                diasContainer.innerHTML = data.diasPermitidos.map(d =>
                    `<span class="dia-permitido"><i class="fas fa-calendar-check"></i> ${d.dataSimples}</span>`
                ).join('');
            } else {
                diasContainer.innerHTML = '<p class="text-muted">Nenhum dia permitido nos próximos dias</p>';
            }
        } catch (error) {
            console.error('Erro ao carregar rodízio:', error);
            loadingDiv.style.display = 'none';
            document.getElementById('rodizioStatus').innerHTML = `<div class="status-badge-rodizio status-negado">
                <i class="fas fa-exclamation-triangle"></i>
                <strong>❌ Erro ao carregar informações do rodízio</strong>
            </div>`;
        }
    }

    document.addEventListener('DOMContentLoaded', carregarRodizioAluno);
    </script>

    <script src="js/vlibras-oficial.js"></script>
    <script src="js/acessibilidade.js"></script>
    <script src="js/chatbot-frontend.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="js/toggle-buttons.js"></script>
    <script src="js/draggable.js"></script>

    <script>
    (function() {
        if (window.innerWidth > 768) return;

        function calcularEscala() {
            const w = window.innerWidth;
            if (w <= 320) return 0.55;
            if (w <= 360) return 0.6;
            if (w <= 400) return 0.65;
            if (w <= 500) return 0.75;
            if (w <= 600) return 0.85;
            if (w <= 700) return 0.95;
            return 1;
        }

        function aplicar() {
            if (window.innerWidth > 768) return;
            document.documentElement.style.setProperty('--scale-ratio', calcularEscala());
            document.documentElement.style.setProperty('--current-width', window.innerWidth);
        }

        aplicar();

        let timeout;
        window.addEventListener('resize', () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                if (window.innerWidth <= 768) aplicar();
                else document.documentElement.style.setProperty('--scale-ratio', '1');
            }, 100);
        });

        window.addEventListener('orientationchange', () => {
            setTimeout(() => { if (window.innerWidth <= 768) aplicar(); }, 200);
        });
    })();

    window.addEventListener('online', () => console.log('🌐 Online'));
    window.addEventListener('offline', () => console.log('📴 Offline'));
    </script>
</body>
</html>
