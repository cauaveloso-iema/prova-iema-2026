<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Minhas Inscrições — EducaPleno</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0284c7">
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/eventos/css/minhas-inscricoes.css?v=2">
</head>
<body class="coord-body">

    <!-- TOPBAR -->
    <header class="coord-topbar">
        <div class="coord-topbar-inner">
            <div class="coord-brand">
                <div class="coord-brand-icon" style="background: linear-gradient(135deg, #10b981, #047857);"><i class="fas fa-list-check"></i></div>
                <div>
                    <strong>Minhas Inscrições</strong>
                    <small>Portal do Participante</small>
                </div>
            </div>
            <div class="coord-topbar-actions">
                <span class="coord-user-chip" id="chip-usuario" title="Usuário logado">
                    <i class="fas fa-user-circle"></i> <span id="perfil-nome">—</span>
                </span>
                <a href="javascript:history.back()" class="coord-btn coord-btn-secondary" title="Voltar">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
                <button class="coord-btn coord-btn-danger" id="btn-sair" title="Sair da conta">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </div>
    </header>

    <main class="coord-shell" style="max-width: 960px;">
        
        <!-- HERO -->
        <section class="coord-hero" style="background: linear-gradient(135deg, #10b981 0%, #047857 100%);">
            <div class="coord-hero-info">
                <h1><i class="fas fa-clipboard-list"></i> Acompanhe seus eventos</h1>
                <p>Consulte o status das suas inscrições, acesse os protocolos e verifique os detalhes de cada envio.</p>
            </div>
        </section>

        <!-- TABS -->
        <div class="minhas-tabs">
            <button class="minhas-tab active" data-cat="abertas">🟢 Abertas <span class="badge-count"></span></button>
            <button class="minhas-tab" data-cat="concluidas">✅ Concluídas <span class="badge-count"></span></button>
            <button class="minhas-tab" data-cat="encerradas">🔒 Encerradas <span class="badge-count"></span></button>
        </div>

        <!-- LISTA -->
        <div id="lista-inscricoes" style="margin-top: 16px;">
            <div class="coord-empty"><i class="fas fa-circle-notch fa-spin"></i> Carregando...</div>
        </div>

    </main>

    <!-- Modal de detalhes -->
    <div id="modalDetalhes"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/eventos/js/minhas-inscricoes.js?v=2"></script>
</body>
</html>
