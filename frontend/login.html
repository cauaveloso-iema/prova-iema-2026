<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- 🔥 CSP - PROTEÇÃO CONTRA XSS (com Google e Microsoft liberados) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://vlibras.gov.br https://accounts.google.com https://alcdn.msauth.net blob:; script-src-elem 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://vlibras.gov.br https://accounts.google.com https://alcdn.msauth.net blob:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.jsdelivr.net https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://cdn-icons-png.flaticon.com https://cdn.jsdelivr.net https://vlibras.gov.br https://lh3.googleusercontent.com; connect-src 'self' https://vlibras.gov.br https://cdn.jsdelivr.net https://api.dicionario-aberto.net https://servicos2.dicionario-aberto.net https://accounts.google.com https://oauth2.googleapis.com https://login.microsoftonline.com https://graph.microsoft.com ws: wss:; media-src 'self' blob: data:; frame-src 'self' https://vlibras.gov.br https://accounts.google.com https://login.microsoftonline.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EducaPleno">

    <!-- 🔥 FAVICON LOCAL (NÃO DEPENDE DE INTERNET) -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/favicon.ico">
    
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('✅ Service Worker registrado:', registration.scope);
          })
          .catch(error => {
            console.log('❌ Service Worker falhou:', error);
          });
      });
    }
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Login - EducaPleno</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Microsoft MSAL -->
    <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>

    <!-- CSS EXTERNO -->
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

    <!-- ============================================================
    FUNDO ANIMADO
    ============================================================ -->
    <div class="background-animated">
        <div class="bg-gradient-1"></div>
        <div class="bg-gradient-2"></div>
        <div class="bg-gradient-3"></div>
    </div>

    <!-- ============================================================
    PARTÍCULAS
    ============================================================ -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ============================================================
    CONTAINER PRINCIPAL
    ============================================================ -->
    <div class="login-container">

        <!-- HEADER -->
        <div class="login-header">
            <div class="icon-wrapper">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h1>Educa<span>Pleno</span></h1>
            <p>Plataforma Inteligente de Gestão Educacional</p>
        </div>

        <!-- ALERTA -->
        <div id="alert" class="alert"></div>

        <!-- ============================================================
        LOGIN
        ============================================================ -->
        <div id="login-tab" class="tab-content active">
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginIdentifier">
                        <i class="fas fa-user-circle"></i> Email ou CPF
                    </label>
                    <input type="text" id="loginIdentifier" class="form-control"
                           placeholder="Digite seu email ou CPF" required
                           autocomplete="username" />
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <!-- 🔥 CAMPO DE SENHA COM BOTÃO DE MOSTRAR/OCULTAR (DISCRETO) -->
                    <div class="password-wrapper" id="passwordWrapper">
                        <input type="password" id="loginPassword" class="form-control"
                               placeholder="Digite sua senha" required
                               autocomplete="current-password" />
                        <button type="button" class="toggle-password" id="togglePassword"
                                aria-label="Mostrar senha" title="Mostrar senha"
                                tabindex="-1">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe" />
                        <span>Lembrar de mim</span>
                    </label>
                    <a href="recuperar-senha.html" class="forgot-link">
                        Esqueci minha senha
                    </a>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>

            <!-- DIVISOR -->
            <div class="divider">
                <span>ou</span>
            </div>

            <!-- 🔥 LOGIN SOCIAL -->
            <div class="social-login">
                <button type="button" class="btn-social btn-google" id="btnGoogleLogin">
                    <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
                        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
                        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C41.5 35.1 44 30 44 24c0-1.3-.1-2.3-.4-3.5z"/>
                    </svg>
                    <span>Continuar com Google</span>
                </button>

                <button type="button" class="btn-social btn-microsoft" id="btnMicrosoftLogin">
                    <svg width="18" height="18" viewBox="0 0 23 23" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path fill="#f35325" d="M1 1h10v10H1z"/>
                        <path fill="#81bc06" d="M12 1h10v10H12z"/>
                        <path fill="#05a6f0" d="M1 12h10v10H1z"/>
                        <path fill="#ffba08" d="M12 12h10v10H12z"/>
                    </svg>
                    <span>Continuar com Microsoft</span>
                </button>
            </div>

            <!-- WHATSAPP -->
            <a href="https://wa.me/98983086504" target="_blank" rel="noopener noreferrer" class="whatsapp-link">
                <i class="fab fa-whatsapp"></i>
                <span>Falar com o suporte</span>
            </a>

            <!-- CADASTRO -->
            <div class="register-link">
                Ainda não possui uma conta? <a href="cadastro-etapas.html">Criar conta</a>
            </div>
        </div>

        <!-- RODAPÉ -->
        <div class="footer">
            &copy; 2026 EducaPleno &mdash; Todos os direitos reservados
        </div>
    </div>

    <!-- ================================================================
    JAVASCRIPT EXTERNO
    ================================================================ -->
    <script src="js/login.js"></script>

    <!-- VLibras Oficial -->
    <script src="js/vlibras-oficial.js"></script>
    <script src="js/acessibilidade.js"></script>
    <script src="js/chatbot-frontend.js"></script>
    <script src="js/toggle-buttons.js"></script>
    <script src="js/draggable.js"></script>

</body>
</html>
